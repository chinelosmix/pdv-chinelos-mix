<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>PDV Chinelos Mix</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

input, button {
  padding: 10px;
  margin: 5px;
  font-size: 16px;
}

button {
  background: green;
  color: white;
  border: none;
  cursor: pointer;
}

#app {
  display: none;
}

#login {
  margin-top: 100px;
}

.container {
  margin-top: 20px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>🔐 Login</h2>
  <input id="user" placeholder="Usuário"><br>
  <input id="senha" type="password" placeholder="Senha"><br>
  <button onclick="entrar()">Entrar</button>
</div>

<!-- SISTEMA -->
<div id="app">

  <h1>🛒 PDV Chinelos Mix</h1>

  <button onclick="sair()">🚪 Sair</button>

  <div class="container">

    <h3>Produto</h3>
    <input id="produto" placeholder="Nome do produto">
    <input id="preco" placeholder="Preço">

    <br>

    <button onclick="adicionar()">Adicionar</button>

    <h3>Lista</h3>
    <ul id="lista"></ul>

    <h3>Total: R$ <span id="total">0</span></h3>

  </div>

</div>

<script>

// LOGIN
function entrar() {
  fetch('/login', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      user: document.getElementById('user').value,
      senha: document.getElementById('senha').value
    })
  })
  .then(res => {
    if (res.ok) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    } else {
      alert('Login inválido');
    }
  });
}

// SAIR
function sair() {
  location.reload();
}

// PDV SIMPLES
let total = 0;

function adicionar() {
  let nome = document.getElementById('produto').value;
  let preco = parseFloat(document.getElementById('preco').value);

  if (!nome || isNaN(preco)) {
    alert('Preencha corretamente');
    return;
  }

  total += preco;

  let li = document.createElement('li');
  li.innerHTML = `${nome} - R$ ${preco.toFixed(2)} 
  <button onclick="remover(this, ${preco})">❌</button>`;

  document.getElementById('lista').appendChild(li);

  document.getElementById('total').innerText = total.toFixed(2);

  document.getElementById('produto').value = '';
  document.getElementById('preco').value = '';
}

function remover(btn, preco) {
  btn.parentElement.remove();
  total -= preco;
  document.getElementById('total').innerText = total.toFixed(2);
}

</script>

</body>
</html>
