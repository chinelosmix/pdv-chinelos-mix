```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV CHINELOS MIX PRO</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff}
header{background:#000;padding:15px;text-align:center;font-size:20px}
.menu{display:flex;justify-content:space-around;background:#222;padding:10px}
.menu button{padding:15px;width:100%;margin:2px}
.box{display:none;padding:10px}
input,select{padding:12px;margin:5px;width:90%}
button{background:#28a745;color:#fff;border:none;padding:12px}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #444;padding:5px}
#reader,#readerVenda{width:300px;margin:auto}
</style>
</head>

<body>

<header>PDV CHINELOS MIX</header>

<div id="login" class="box" style="display:block">
<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">
<button onclick="login()">Entrar</button>
</div>

<div id="menu" class="menu box">
<button onclick="show('prod')">Produtos</button>
<button onclick="show('ven')">Venda</button>
<button onclick="show('fun')">Funcionários</button>
<button onclick="show('cx')">Caixa</button>
<button onclick="show('rel')">Relatório</button>
</div>

<!-- PRODUTOS -->
<div id="prod" class="box">
<h2>Produtos</h2>

<input id="codigo">
<button onclick="scanP()">📷</button>
<div id="reader"></div>

<input id="nome">
<input id="cor">
<input id="numero">
<input id="qtdEstoque">
<input id="valor">

<button onclick="salvarP()">Salvar</button>

<table id="listaP"></table>
</div>

<!-- VENDAS -->
<div id="ven" class="box">
<h2>Venda</h2>

<input id="codVenda">
<button onclick="scanV()">📷</button>
<div id="readerVenda"></div>

<input id="qtdVenda" value="1">
<button onclick="add()">Adicionar</button>

<select id="pag">
<option>Dinheiro</option>
<option>Pix</option>
<option>Débito</option>
<option>Crédito à vista</option>
<option>Crédito 2x</option>
<option>Crédito 3x</option>
<option>Vale</option>
</select>

<input id="recebido" placeholder="Valor recebido">

<h3>Total: R$ <span id="tot">0</span></h3>
<h3>Troco: R$ <span id="tro">0</span></h3>

<button onclick="printCupom()">🧾 Cupom</button>
<button onclick="finalizar()">Finalizar</button>

<table id="listaV"></table>
</div>

<!-- FUNCIONARIO -->
<div id="fun" class="box">
<h2>Funcionários</h2>

<input id="nomeF">
<input id="cargoF">

<button onclick="salvarF()">Salvar</button>

<table id="listaF"></table>
</div>

<!-- CAIXA -->
<div id="cx" class="box">
<input id="ini">
<button onclick="abrir()">Abrir Caixa</button>
<button onclick="fechar()">Fechar</button>
<h3 id="status"></h3>
</div>

<!-- RELATORIO -->
<div id="rel" class="box">
<table id="listaR"></table>
<h3>Total: R$ <span id="totR">0</span></h3>
</div>

<script>

function login(){
if(user.value=="admin" && pass.value=="123"){
login.style.display="none"
menu.style.display="flex"
show("ven")
}
}

function show(t){
document.querySelectorAll(".box").forEach(x=>x.style.display="none")
document.getElementById(t).style.display="block"
listarP(); listarF(); listarR();
}

// PRODUTO
let prod=JSON.parse(localStorage.getItem("p"))||[]

function salvarP(){
prod.push({
c:codigo.value,n:nome.value,cor:cor.value,num:numero.value,q:qtdEstoque.value,v:valor.value
})
localStorage.setItem("p",JSON.stringify(prod))
listarP()
}

function listarP(){
listaP.innerHTML=prod.map(p=>`<tr><td>${p.n}</td><td>${p.q}</td><td>${p.v}</td></tr>`).join("")
}

// SCANNER
function scanP(){
new Html5Qrcode("reader").start({facingMode:"environment"},{fps:10},c=>codigo.value=c)
}
function scanV(){
new Html5Qrcode("readerVenda").start({facingMode:"environment"},{fps:10},c=>codVenda.value=c)
}

// VENDA
let venda=[],total=0

function add(){
let p=prod.find(x=>x.c==codVenda.value)
if(!p)return alert("não encontrado")

let q=Number(qtdVenda.value)
p.q-=q

venda.push({...p,qtd:q})
total+=p.v*q

localStorage.setItem("p",JSON.stringify(prod))
att()
}

function att(){
listaV.innerHTML=venda.map(p=>`<tr><td>${p.n}</td><td>${p.qtd}</td><td>${p.v}</td></tr>`).join("")
tot.innerText=total.toFixed(2)

let r=Number(recebido.value)
tro.innerText=r? (r-total).toFixed(2):0
}

recebido.oninput=att

function printCupom(){
let c="CHINELOS MIX\nCNPJ: 46.982.791/0001-01\nEND: POÁ\n\n"
venda.forEach(p=>c+=`${p.n} ${p.qtd} R$${p.v}\n`)
c+=`\nTOTAL: R$${total}\n${pag.value}`
let w=window.open()
w.document.write("<pre>"+c+"</pre>")
w.print()
}

// CAIXA
let cx=0,ab=false,rel=JSON.parse(localStorage.getItem("r"))||[]

function abrir(){cx=Number(ini.value);ab=true;status.innerText="Aberto"}
function fechar(){ab=false;status.innerText="Total: "+cx}

function finalizar(){
if(!ab)return alert("Abra o caixa")

cx+=total
rel.push({d:new Date().toLocaleString(),t:total,p:pag.value})
localStorage.setItem("r",JSON.stringify(rel))

venda=[];total=0;att()
alert("OK")
}

// RELATORIO
function listarR(){
let t=0
listaR.innerHTML=rel.map(r=>{t+=Number(r.t);return `<tr><td>${r.d}</td><td>${r.t}</td></tr>`}).join("")
totR.innerText=t.toFixed(2)
}

// FUNCIONARIO
let f=JSON.parse(localStorage.getItem("f"))||[]

function salvarF(){
f.push({n:nomeF.value,c:cargoF.value,p:[]})
localStorage.setItem("f",JSON.stringify(f))
listarF()
}

function listarF(){
listaF.innerHTML=f.map((x,i)=>`
<tr>
<td>${x.n}</td>
<td>
<button onclick="ponto(${i},'Entrada')">Entrada</button>
<button onclick="ponto(${i},'Almoço')">Almoço</button>
<button onclick="ponto(${i},'Volta')">Volta</button>
<button onclick="ponto(${i},'Saída')">Saída</button>
</td>
</tr>`).join("")
}

function ponto(i,t){
let h=new Date().toLocaleString()
f[i].p.push({t,h})
localStorage.setItem("f",JSON.stringify(f))
alert(t+" "+h)
}

</script>

</body>
</html>
```
