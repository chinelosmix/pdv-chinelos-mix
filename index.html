<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV CHINELOS MIX</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
header{background:#020617;padding:15px;text-align:center}
nav{display:flex;background:#020617}
nav button{flex:1;padding:12px;border:none;background:#020617;color:#fff}
.box{display:none;padding:10px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:5px;border:none}
button{padding:10px;background:#22c55e;color:#fff;border:none;border-radius:5px;margin-top:5px}
table{width:100%;margin-top:10px;border-collapse:collapse}
td,th{border-bottom:1px solid #334155;padding:8px}
#reader,#readerVenda{width:300px;margin:auto}
</style>
</head>

<body>

<header>PDV CHINELOS MIX</header>

<div id="loginBox">
<input id="user" placeholder="Nome">
<input id="senha" placeholder="Senha" type="password">
<button onclick="login()">Entrar</button>
</div>

<nav>
<button onclick="show('prod')">Produtos</button>
<button onclick="show('ven')">Venda</button>
<button onclick="show('rel')">Relatório</button>
</nav>

<!-- PRODUTOS -->
<div id="prod" class="box">

<input id="codigo" placeholder="Código ou escaneie">
<button onclick="gerarCodigo()">Gerar Código</button>
<button onclick="toggleScannerProduto()">📷 Scanner</button>

<div id="reader"></div>

<input id="nome" placeholder="Nome">
<input id="cor" placeholder="Cor">
<input id="numero" placeholder="Numeração">
<input id="estoque" placeholder="Quantidade">
<input id="valor" placeholder="Valor">

<button onclick="salvarProduto()">Salvar</button>

<table>
<thead>
<tr>
<th>Código</th><th>Nome</th><th>Cor</th><th>Nº</th><th>Qtd</th><th>Valor</th><th>Ações</th>
</tr>
</thead>
<tbody id="listaProdutos"></tbody>
</table>

</div>

<!-- VENDA -->
<div id="ven" class="box">

<input id="codVenda" placeholder="Passe o código">
<input id="qtd" value="1">
<button onclick="addVenda()">Adicionar</button>

<button onclick="toggleScannerVenda()">📷 Scanner</button>
<div id="readerVenda"></div>

<h3>Total: R$ <span id="total">0</span></h3>

<table id="listaVenda"></table>

<h3>Pagamento</h3>

<select id="pagamento">
<option>Dinheiro</option>
<option>PIX</option>
<option>Débito</option>
<option>Crédito à vista</option>
<option>2x</option>
<option>3x</option>
<option>Vale</option>
</select>

<input id="valorPago" placeholder="Valor pago">

<button onclick="usar2Pagamentos()">💳 2 Formas</button>

<div id="pagamento2" style="display:none">
<select id="pagamentoExtra">
<option>Dinheiro</option>
<option>PIX</option>
<option>Débito</option>
<option>Crédito</option>
</select>
<input id="valorExtra" placeholder="Valor">
</div>

<button onclick="finalizar()">Finalizar</button>

</div>

<!-- RELATORIO -->
<div id="rel" class="box">
<table id="listaRelatorio"></table>
<h3 id="totalRelatorio"></h3>
</div>

<script>

// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyARpePSrPuvzOwLP6v9gzmhWfzdo0JZJK4",
  authDomain: "pdv-chinelos.firebaseapp.com",
  projectId: "pdv-chinelos-2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let produtos=[]
let venda=[],totalVenda=0
let usuarioAtual=""

// SCANNER CONTROLE
let scannerProduto=null
let scannerVenda=null
let ativoProduto=false
let ativoVenda=false

// LOGIN
function login(){
if(!user.value || !senha.value){
alert("Preencha os dados")
return
}
usuarioAtual=user.value
loginBox.style.display="none"
}

// CODIGO
function gerarCodigo(){
codigo.value = "789" + Math.floor(Math.random()*1000000000)
}

// SCANNER PRODUTO
function toggleScannerProduto(){
if(!ativoProduto){
scannerProduto = new Html5Qrcode("reader")
scannerProduto.start({ facingMode:"environment" },{ fps:10, qrbox:250 },(c)=>{
codigo.value=c
})
ativoProduto=true
}else{
scannerProduto.stop()
ativoProduto=false
}
}

// SCANNER VENDA
function toggleScannerVenda(){
if(!ativoVenda){
scannerVenda = new Html5Qrcode("readerVenda")
scannerVenda.start({ facingMode:"environment" },{ fps:10, qrbox:250 },(c)=>{
codVenda.value=c
addVenda()
})
ativoVenda=true
}else{
scannerVenda.stop()
ativoVenda=false
}
}

// FIREBASE
db.collection("produtos").onSnapshot(snapshot=>{
produtos = snapshot.docs.map(doc=>({id:doc.id,...doc.data()}))
listarProdutos()
})

// SALVAR
async function salvarProduto(){
let cod = codigo.value || Date.now().toString()

let produto={
codigo: cod,
codigoBarras: cod,
nome: nome.value,
cor: cor.value,
numero: numero.value,
estoque: Number(estoque.value||0),
valor: Number(valor.value||0)
}

let existente = produtos.find(p=>p.codigo==cod)

if(existente){
await db.collection("produtos").doc(existente.id).set(produto)
}else{
await db.collection("produtos").add(produto)
}

limparCampos()
}

// LISTAR
function listarProdutos(){
listaProdutos.innerHTML = produtos.map(p=>`
<tr>
<td>${p.codigo}</td>
<td>${p.nome}</td>
<td>${p.cor}</td>
<td>${p.numero}</td>
<td>${p.estoque}</td>
<td>R$ ${Number(p.valor).toFixed(2)}</td>
<td>
<button onclick="editar('${p.codigo}')">✏️</button>
<button onclick="excluir('${p.codigo}')">🗑️</button>
</td>
</tr>
`).join("")
}

// VENDA
function addVenda(){
let p = produtos.find(x => x.codigo==codVenda.value || x.codigoBarras==codVenda.value)
if(!p)return alert("Produto não encontrado")

let q=Number(qtd.value)
venda.push({...p,qtd:q})
totalVenda+=p.valor*q
codVenda.value=""
atualizarVenda()
}

function atualizarVenda(){
listaVenda.innerHTML=venda.map(p=>`
<tr><td>${p.nome}</td><td>${p.qtd}</td><td>R$${p.valor}</td></tr>
`).join("")
total.innerText=totalVenda.toFixed(2)
}

// FINALIZAR
async function finalizar(){

let pagamentos=[{tipo:pagamento.value,valor:Number(valorPago.value||0)}]

await db.collection("vendas").add({
itens:venda,
total:totalVenda,
pagamentos:pagamentos,
data:new Date(),
usuario:usuarioAtual
})

imprimirCupom(pagamentos)

venda=[];totalVenda=0
atualizarVenda()
}

// CUPOM PROFISSIONAL
function imprimirCupom(pagamentos){

let totalItens = venda.reduce((t,p)=>t+p.qtd,0)

let itens = venda.map(p=>`
${p.nome}
${p.qtd} x R$${p.valor.toFixed(2)}
`).join("<br>")

let data = new Date().toLocaleString()

let html=`
<html>
<body style="font-family:monospace;font-size:12px">

<center>
<b>CHINELOS MIX</b><br>
CNPJ: 00.000.000/0001-00<br>
Rua Exemplo, 123 - SP<br>
</center>

--------------------------------<br>
Data: ${data}<br>
Operador: ${usuarioAtual}<br>
--------------------------------<br>

${itens}

--------------------------------<br>
TOTAL ITENS: ${totalItens}<br>
TOTAL: R$${totalVenda.toFixed(2)}<br>
--------------------------------<br>

<center>
Obrigado pela preferência!<br>
Volte sempre!
</center>

<script>
window.print();
setTimeout(()=>window.close(),500)
<\/script>

</body>
</html>
`

let w=window.open("","","width=300,height=600")
w.document.write(html)
}

// LIMPAR
function limparCampos(){
codigo.value=""
nome.value=""
cor.value=""
numero.value=""
estoque.value=""
valor.value=""
}

// NAV
function show(t){
document.querySelectorAll(".box").forEach(x=>x.style.display="none")
document.getElementById(t).style.display="block"
}

show("prod")

</script>

</body>
</html>
