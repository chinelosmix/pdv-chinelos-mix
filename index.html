<script>
const firebaseConfig = {
  apiKey: "AIzaSyARpePSrPuvzOwLP6v9gzmhWfzdo0JZJK4",
  authDomain: "pdv-chinelos.firebaseapp.com",
  projectId: "pdv-chinelos-2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let produtos = [];
let vendasCache = [];
let venda = [];
let totalVenda = 0;
let usuarioAtual = "";
let produtoEditandoId = null;
let ultimaVendaCompleta = null;

let scannerProduto = null;
let scannerVenda = null;
let scannerProdutoAtivo = false;
let scannerVendaAtivo = false;
let leituraProdutoBloqueada = false;
let leituraVendaBloqueada = false;

const beep = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
beep.preload = "auto";

function tocarBeep(){
  beep.currentTime = 0;
  beep.play().catch(()=>{});
}

function formatarData(valor){
  if(!valor) return "";
  try{
    if(typeof valor.toDate === "function"){
      return valor.toDate().toLocaleString();
    }
    if(valor instanceof Date){
      return valor.toLocaleString();
    }
    return new Date(valor).toLocaleString();
  }catch(e){
    return "";
  }
}

function login(){
  if(!user.value.trim()){
    alert("Preencha o nome")
    return;
  }
  usuarioAtual = user.value.trim();
  loginBox.style.display = "none";
}

function gerarCodigo(){
  codigo.value = "789" + Math.floor(Math.random() * 1000000000);
}

async function toggleScannerProduto(){
  try{
    if(!scannerProdutoAtivo){
      scannerProduto = new Html5Qrcode("reader");
      await scannerProduto.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        async (decoded) => {
          if(leituraProdutoBloqueada) return;
          leituraProdutoBloqueada = true;
          codigo.value = decoded;
          tocarBeep();
          setTimeout(() => leituraProdutoBloqueada = false, 700);
        }
      );
      scannerProdutoAtivo = true;
    }else{
      await scannerProduto.stop();
      await scannerProduto.clear();
      document.getElementById("reader").innerHTML = "";
      scannerProdutoAtivo = false;
      scannerProduto = null;
    }
  }catch(err){
    alert("Erro no scanner do produto");
  }
}

async function toggleScannerVenda(){
  try{
    if(!scannerVendaAtivo){
      scannerVenda = new Html5Qrcode("readerVenda");
      await scannerVenda.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        async (decoded) => {
          if(leituraVendaBloqueada) return;
          leituraVendaBloqueada = true;
          codVenda.value = decoded;
          tocarBeep();
          addVenda();
          setTimeout(() => leituraVendaBloqueada = false, 900);
        }
      );
      scannerVendaAtivo = true;
    }else{
      await scannerVenda.stop();
      await scannerVenda.clear();
      document.getElementById("readerVenda").innerHTML = "";
      scannerVendaAtivo = false;
      scannerVenda = null;
    }
  }catch(err){
    alert("Erro no scanner da venda");
  }
}

db.collection("produtos").onSnapshot(snapshot => {
  produtos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  listarProdutos();
});

db.collection("vendas").onSnapshot(snapshot => {
  vendasCache = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  if(document.getElementById("rel").style.display === "block"){
    atualizarRelatorio();
  }
});

function limparCampos(){
  codigo.value = "";
  nome.value = "";
  cor.value = "";
  numero.value = "";
  estoque.value = "";
  valor.value = "";
  produtoEditandoId = null;
}

function cancelarEdicao(){
  produtoEditandoId = null;
  limparCampos();
}

async function salvarProduto(){
  const cod = (codigo.value || Date.now().toString()).trim();
  const p = {
    codigo: cod,
    codigoBarras: cod,
    nome: nome.value.trim(),
    cor: cor.value.trim(),
    numero: numero.value.trim(),
    estoque: Number(estoque.value || 0),
    valor: Number(valor.value || 0)
  };

  if(!p.nome){
    alert("Preencha o nome");
    return;
  }

  if(produtoEditandoId){
    await db.collection("produtos").doc(produtoEditandoId).set(p);
    produtoEditandoId = null;
  }else{
    const existente = produtos.find(x => x.codigo === cod);
    if(existente){
      await db.collection("produtos").doc(existente.id).set(p);
    }else{
      await db.collection("produtos").add(p);
    }
  }

  limparCampos();
}

function editar(cod){
  const p = produtos.find(x => x.codigo === cod);
  if(!p) return;
  produtoEditandoId = p.id;
  codigo.value = p.codigo;
  nome.value = p.nome;
  cor.value = p.cor;
  numero.value = p.numero;
  estoque.value = p.estoque;
  valor.value = p.valor;
  show("prod");
}

async function excluir(cod){
  if(!confirm("Excluir produto?")) return;
  const p = produtos.find(x => x.codigo === cod);
  if(!p) return;
  await db.collection("produtos").doc(p.id).delete();
}

function listarProdutos(){
  if(!produtos.length){
    listaProdutos.innerHTML = "<tr><td colspan='7'>Nenhum produto</td></tr>";
    return;
  }

  listaProdutos.innerHTML = produtos.map(p => `
    <tr>
      <td>${p.codigo}</td>
      <td>${p.nome}</td>
      <td>${p.cor}</td>
      <td>${p.numero}</td>
      <td>${p.estoque}</td>
      <td>R$ ${Number(p.valor).toFixed(2)}</td>
      <td class="row-actions">
        <button onclick="editar('${p.codigo}')">✏️</button>
        <button class="danger" onclick="excluir('${p.codigo}')">🗑️</button>
        <button class="info" onclick="etiqueta('${p.codigo}')">🏷️</button>
      </td>
    </tr>
  `).join("");
}

function etiqueta(c){
  const p = produtos.find(x => x.codigo === c);
  if(!p) return;

  const html = `

<head>

body{

</head>
<body>

  <div class="loja">CHINELOS MIX</div>
  <div class="nome">${p.nome}</div>

  <svg id="barcode"></svg>

}

function addVenda(){
  const p = produtos.find(x => x.codigo === codVenda.value || x.codigoBarras === codVenda.value);
  if(!p){
    alert("Produto não encontrado");
    return;
  }

  const q = Number(qtd.value || 1);
  if(Number(p.estoque) < q){
    alert("Estoque insuficiente");
    return;
  }

  tocarBeep();

  venda.push({
    id: p.id,
    codigo: p.codigo,
    nome: p.nome,
    cor: p.cor,
    numero: p.numero,
    qtd: q,
    valor: Number(p.valor || 0)
  });

  totalVenda += Number(p.valor || 0) * q;

  codVenda.value = "";
  qtd.value = 1;
  renderVenda();
}

function removerItem(i){
  const item = venda[i];
  if(!item) return;
  totalVenda -= Number(item.valor || 0) * Number(item.qtd || 0);
  venda.splice(i,1);
  renderVenda();
}

function renderVenda(){
  if(!venda.length){
    listaVenda.innerHTML = "<tr><td colspan='5'>Nenhum item</td></tr>";
    total.innerText = "0.00";
    return;
  }

  listaVenda.innerHTML = venda.map((p,i) => `
    <tr>
      <td>${p.nome}</td>
      <td>${p.qtd}</td>
      <td>R$ ${Number(p.valor).toFixed(2)}</td>
      <td>R$ ${(Number(p.qtd) * Number(p.valor)).toFixed(2)}</td>
      <td><button class="danger" onclick="removerItem(${i})">❌</button></td>
    </tr>
  `).join("");

  total.innerText = totalVenda.toFixed(2);
}

function usar2Pagamentos(){
  pagamento2.style.display = "block";
}

function coletarPagamentos(){
  const pagamentos = [];
  const tipo1 = pagamento.value;
  let valor1 = Number(valorPago.value || 0);

  if(pagamento2.style.display === "block"){
    const tipo2 = pagamentoExtra.value;
    const valor2 = Number(valorExtra.value || 0);

    if(valor1 + valor2 < totalVenda){
      alert("Valor insuficiente");
      return null;
    }

    pagamentos.push({ tipo: tipo1, valor: valor1 });
    pagamentos.push({ tipo: tipo2, valor: valor2 });
    return pagamentos;
  }

  if(valor1 <= 0){
    valor1 = totalVenda;
  }

  if(valor1 < totalVenda){
    alert("Valor insuficiente");
    return null;
  }

  pagamentos.push({ tipo: tipo1, valor: valor1 });
  return pagamentos;
}

function gerarNumeroCupom(){
  return String(Date.now()).slice(-6);
}

function montarCupomHTML(vendaFinalizada){
  const data = formatarData(vendaFinalizada.data);
  const numeroCupom = vendaFinalizada.cupomNumero || gerarNumeroCupom();
  const itens = vendaFinalizada.itens || [];
  const totalItens = itens.reduce((t,p) => t + Number(p.qtd || 0), 0);
  const pagamentoTexto = (vendaFinalizada.pagamentos || []).map(p => p.tipo).join(" / ");

  function linha(){
    return "-".repeat(42);
  }

  function padDir(texto, tamanho){
    return (String(texto) + " ".repeat(tamanho)).substring(0, tamanho);
  }

  function padEsq(texto, tamanho){
    return (" ".repeat(tamanho) + String(texto)).slice(-tamanho);
  }

  const linhasItens = itens.map((p, i) => {
    const cod = String(i + 1).padStart(3, "0");
    const nome = padDir(p.nome, 20);
    const qtdItem = padEsq(p.qtd, 3);
    const unit = padEsq(Number(p.valor).toFixed(2), 8);
    const totalItem = padEsq((Number(p.qtd) * Number(p.valor)).toFixed(2), 9);
    return `${cod} ${nome}${qtdItem}${unit}${totalItem}`;
  }).join("\n");

  return `
<html>
<head>
<meta charset="UTF-8">
<style>
body{
  font-family:monospace;
  font-size:12px;
  width:280px;
  margin:0;
  white-space:pre;
}
.center{text-align:center}
.bold{font-weight:bold}
.hr{display:block}
</style>
</head>
<body>
           CHINELOS MIX
CNPJ: 46.982.791/0001-01
AV. LEONOR BOSONE MARQUES DA SILVA, 45
CENTRO - POÁ/SP

${linha()}

CUPOM Nº: ${numeroCupom}
DATA: ${data}

${linha()}

ITEM PRODUTO           QTD VALOR UNIT   TOTAL

${linha()}

${linhasItens}

${linha()}

ITENS: ${totalItens}
TOTAL: R$ ${Number(vendaFinalizada.total || 0).toFixed(2)}

PAGAMENTO: ${pagamentoTexto}
ATENDIDO POR: ${vendaFinalizada.usuario || usuarioAtual}

${linha()}

OBRIGADO, VOLTE SEMPRE!

<script>
window.print();
setTimeout(()=>window.close(), 800);
<\/script>
</body>
</html>`;
}

function imprimirCupom(vendaFinalizada){
  const w = window.open("", "", "width=300,height=600");
  w.document.write(montarCupomHTML(vendaFinalizada));
}

function imprimirCupomSeparado(){
  if(!ultimaVendaCompleta){
    alert("Nenhuma venda para reimprimir");
    return;
  }
  imprimirCupom(ultimaVendaCompleta);
}

async function finalizar(){
  if(!venda.length){
    alert("Nenhuma venda");
    return;
  }

  const pagamentos = coletarPagamentos();
  if(!pagamentos) return;

  const vendaFinalizada = {
    itens: venda.map(item => ({ ...item })),
    total: Number(totalVenda),
    pagamentos,
    usuario: usuarioAtual,
    data: new Date(),
    cupomNumero: gerarNumeroCupom()
  };

  for(const item of vendaFinalizada.itens){
    const prod = produtos.find(p => p.id === item.id);
    if(!prod) continue;

    const novoEstoque = Number(prod.estoque || 0) - Number(item.qtd || 0);
    await db.collection("produtos").doc(prod.id).update({
      estoque: novoEstoque
    });
  }

  await db.collection("vendas").add(vendaFinalizada);

  ultimaVendaCompleta = vendaFinalizada;
  imprimirCupom(vendaFinalizada);

  venda = [];
  totalVenda = 0;
  renderVenda();

  valorPago.value = "";
  valorExtra.value = "";
  pagamento2.style.display = "none";

  atualizarRelatorio();
  alert("Venda finalizada");
}

  const vendaBase = ultimaVendaCompleta || {

  };

  if(!vendaBase.itens || !vendaBase.itens.length){

  }

  const itens = vendaBase.itens.map(p => `

<td>${p.qtd}</td>
<td>R$ ${Number(p.valor).toFixed(2)}</td>
<td>R$ ${(Number(p.qtd) * Number(p.valor)).toFixed(2)}</td>
</tr>
`).join("");

  const html = `

${itens}
</tbody>

<h3>Total: R$ ${Number(vendaBase.total || 0).toFixed(2)}</h3>

<script>
window.print();
setTimeout(()=>window.close(), 800);
<\/script>
</body>
</html>`;

  const w = window.open("", "", "width=800,height=900");
  w.document.write(html);
}

function renderRelatorio(vendas){
  const ordenadas = [...vendas].sort((a,b) => {
    const da = a.data ? new Date(a.data.toDate ? a.data.toDate() : a.data).getTime() : 0;
    const dbv = b.data ? new Date(b.data.toDate ? b.data.toDate() : b.data).getTime() : 0;
    return dbv - da;
  });

  if(!ordenadas.length){
    tabelaRel.innerHTML = "<tr><td colspan='5'>Nenhuma venda</td></tr>";
    resumoRel.innerHTML = "Sem vendas para exibir.";
    return;
  }

  tabelaRel.innerHTML = ordenadas.map(v => {
    const pags = (v.pagamentos || []).map(p => p.tipo).join(" / ");
    return `
<tr>
<td>${formatarData(v.data)}</td>
<td>${v.cupomNumero || ""}</td>
<td>R$ ${Number(v.total || 0).toFixed(2)}</td>
<td>${pags}</td>
<td>${v.usuario || ""}</td>
</tr>`;
  }).join("");

  const totalGeral = ordenadas.reduce((t,v) => t + Number(v.total || 0), 0);
  const totalItens = ordenadas.reduce((t,v) => t + (v.itens || []).reduce((a,i) => a + Number(i.qtd || 0), 0), 0);
  const resumoPag = {};

  ordenadas.forEach(v => {
    (v.pagamentos || []).forEach(p => {
      resumoPag[p.tipo] = (resumoPag[p.tipo] || 0) + Number(p.valor || 0);
    });
  });

  const linhasPag = Object.entries(resumoPag).map(([tipo, valor]) => `${tipo}: R$ ${valor.toFixed(2)}`).join("<br>");

  resumoRel.innerHTML = `
Vendas: ${ordenadas.length} | Itens: ${totalItens} | Total: R$ ${totalGeral.toFixed(2)}<br>
${linhasPag || ""}
`;
}

async function atualizarRelatorio(){
  const snap = await db.collection("vendas").get();
  vendasCache = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  renderRelatorio(vendasCache);
}

async function fecharCaixa(){
  if(!vendasCache.length){
    await atualizarRelatorio();
  }

  const vendas = [...vendasCache];
  if(!vendas.length){
    alert("Nenhuma venda para fechamento");
    return;
  }

  const totalGeral = vendas.reduce((t,v) => t + Number(v.total || 0), 0);
  const totalItens = vendas.reduce((t,v) => t + (v.itens || []).reduce((a,i) => a + Number(i.qtd || 0), 0), 0);
  const porPagamento = {};

  vendas.forEach(v => {
    (v.pagamentos || []).forEach(p => {
      porPagamento[p.tipo] = (porPagamento[p.tipo] || 0) + Number(p.valor || 0);
    });
  });

  let resumo = `
FECHAMENTO DE CAIXA

LOJA: CHINELOS MIX
CNPJ: 46.982.791/0001-01
OPERADOR: ${usuarioAtual}

VENDAS: ${vendas.length}
ITENS: ${totalItens}
TOTAL GERAL: R$ ${totalGeral.toFixed(2)}

`;

  for(const [tipo, valor] of Object.entries(porPagamento)){
    resumo += `${tipo}: R$ ${valor.toFixed(2)}\n`;
  }

  const html = `
<html>
<head>
<meta charset="UTF-8">
<style>
body{font-family:monospace;padding:16px;white-space:pre-wrap}
</style>
</head>
<body>
${resumo}

<script>
window.print();
setTimeout(()=>window.close(), 800);
<\/script>
</body>
</html>`;

  const w = window.open("", "", "width=500,height=700");
  w.document.write(html);
}

  document.getElementById(t).style.display = "block";
  if(t === "rel"){
    atualizarRelatorio();
  }
}
