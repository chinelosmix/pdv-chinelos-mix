<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV PRO</title>

<style>
body{background:#111;color:#fff;text-align:center;font-family:Arial}
button{padding:10px;margin:5px;background:green;color:#fff}
input,select{padding:8px;margin:5px}
.tela{display:none}
.ativa{display:block}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<h2>Login</h2>
<input id="user"><br>
<input id="senha" type="password"><br>
<button onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<h1>PDV CHINELOS MIX</h1>

<button onclick="mostrar('prod')">Produtos</button>
<button onclick="mostrar('venda')">Venda</button>
<button onclick="logout()">Sair</button>

<!-- PRODUTOS -->
<div id="prod" class="tela">
<input id="nome" placeholder="Produto">
<input id="preco" placeholder="Preço">
<button onclick="salvarProd()">Salvar</button>
<ul id="listaProd"></ul>
</div>

<!-- VENDA -->
<div id="venda" class="tela ativa">

<h2>Venda</h2>

<select id="selectProd"></select>
<input id="qtd" value="1">

<br>

<h3>Pagamento</h3>
<button onclick="setPagamento('Dinheiro')">Dinheiro</button>
<button onclick="setPagamento('Cartão')">Cartão</button>
<button onclick="setPagamento('Pix')">Pix</button>

<p id="pag"></p>

<button onclick="add()">Adicionar</button>

<ul id="lista"></ul>

<h3>Total: R$ <span id="total">0</span></h3>

<button onclick="finalizar()">Finalizar</button>
<button onclick="cupom()">🧾 Cupom</button>

</div>

</div>

<script>

// LOGIN
function login(){
fetch('/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({user:user.value,senha:senha.value})
})
.then(r=>{
if(r.ok){
login.style.display='none';
app.style.display='block';
carregar();
}else alert("Erro");
});
}

// LOGOUT
function logout(){location.reload()}

// TELA
function mostrar(t){
document.querySelectorAll('.tela').forEach(e=>e.classList.remove('ativa'));
document.getElementById(t).classList.add('ativa');
}

// PRODUTO
function salvarProd(){
fetch('/produto',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({nome:nome.value,preco:preco.value})
}).then(()=>carregar());
}

function carregar(){
fetch('/produtos')
.then(r=>r.json())
.then(d=>{
selectProd.innerHTML='';
d.forEach(p=>{
let op=document.createElement('option');
op.value=p.nome;
op.innerText=p.nome;
selectProd.appendChild(op);
});
});
}

// VENDA
let itens=[];
let total=0;
let pagamento="";

function setPagamento(p){
pagamento=p;
pag.innerText="Pagamento: "+p;
}

function add(){
let nome=selectProd.value;
let qtd=parseInt(document.getElementById('qtd').value);

let item=itens.find(i=>i.nome===nome);

if(item){item.qtd+=qtd}
else itens.push({nome,qtd});

total+=qtd*10;

render();
}

function render(){
lista.innerHTML='';
itens.forEach(i=>{
let li=document.createElement('li');
li.innerText=i.nome+" x"+i.qtd;
lista.appendChild(li);
});
document.getElementById('total').innerText=total;
}

// CUPOM PROFISSIONAL
function cupom(){

let txt="*** CHINELOS MIX ***\n\n";

itens.forEach(i=>{
txt+=i.nome+" x"+i.qtd+"\n";
});

txt+="\nTOTAL: R$ "+total+"\n";
txt+="PAGAMENTO: "+pagamento+"\n";
txt+="OBRIGADO!";

let w=window.open('');
w.document.write("<pre>"+txt+"</pre>");
w.print();
}

// FINALIZAR
function finalizar(){
fetch('/venda',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({itens,total,pagamento})
});

itens=[];
total=0;
render();
}

</script>

</body>
</html>
