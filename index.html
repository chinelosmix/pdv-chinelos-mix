<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV CHINELOS MIX</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center}
input,button,select{padding:10px;margin:5px;font-size:16px}
button{background:green;color:#fff;border:none}
table{width:100%;margin-top:20px;border-collapse:collapse}
td,th{border:1px solid #fff;padding:5px}
.tela{display:none}
#reader,#readerVenda{width:300px;margin:auto}
</style>
</head>

<body>

<h1>PDV CHINELOS MIX</h1>

<!-- LOGIN -->
<div id="login" class="tela" style="display:block">
<input id="user" placeholder="Usuário"><br>
<input id="pass" type="password" placeholder="Senha"><br>
<button onclick="entrar()">Entrar</button>
</div>

<!-- MENU -->
<div id="menu" class="tela">
<button onclick="mostrar('produtos')">📦 Produtos</button>
<button onclick="mostrar('vendas')">💰 Vendas</button>
<button onclick="mostrar('funcionarios')">👨‍💼 Funcionários</button>
</div>

<!-- PRODUTOS -->
<div id="produtos" class="tela">

<h2>Cadastro de Produto</h2>

<input id="codigo" placeholder="Código"><br>
<button onclick="scanProduto()">📷 Scanner</button>
<div id="reader"></div>

<input id="nome" placeholder="Nome"><br>
<input id="cor" placeholder="Cor"><br>
<input id="numero" placeholder="Numeração"><br>
<input id="quantidade" type="number" placeholder="Quantidade"><br>
<input id="valor" type="number" placeholder="Valor"><br>

<button onclick="salvarProduto()">Salvar</button>

<table>
<thead>
<tr>
<th>Código</th><th>Nome</th><th>Cor</th><th>Nº</th><th>Qtd</th><th>Valor</th><th>Ação</th>
</tr>
</thead>
<tbody id="listaProdutos"></tbody>
</table>

<br>
<button onclick="mostrar('menu')">⬅ Voltar</button>

</div>

<!-- VENDAS -->
<div id="vendas" class="tela">

<h2>Venda</h2>

<input id="codVenda" placeholder="Código"><br>
<button onclick="scanVenda()">📷 Scanner</button>
<div id="readerVenda"></div>

<button onclick="addVenda()">Adicionar</button>

<h3>Total: R$ <span id="total">0</span></h3>

<select id="pagamento">
<option>Dinheiro</option>
<option>Pix</option>
<option>Débito</option>
<option>Crédito</option>
<option>Vale</option>
</select>

<button onclick="finalizar()">Finalizar</button>

<table>
<thead>
<tr><th>Nome</th><th>Valor</th><th>Ação</th></tr>
</thead>
<tbody id="listaVenda"></tbody>
</table>

<br>
<button onclick="mostrar('menu')">⬅ Voltar</button>

</div>

<!-- FUNCIONÁRIOS -->
<div id="funcionarios" class="tela">

<h2>Funcionários</h2>

<input id="nomeFunc" placeholder="Nome"><br>
<input id="cargoFunc" placeholder="Cargo"><br>

<button onclick="salvarFunc()">Salvar</button>

<table>
<thead>
<tr>
<th>Nome</th><th>Cargo</th><th>Ponto</th><th>Ação</th>
</tr>
</thead>
<tbody id="listaFunc"></tbody>
</table>

<br>
<button onclick="mostrar('menu')">⬅ Voltar</button>

</div>

<script>

// LOGIN
function entrar(){
if(user.value=="admin" && pass.value=="123"){
mostrar("menu")
}else{
alert("Login inválido")
}
}

// TROCAR TELA
function mostrar(id){
document.querySelectorAll(".tela").forEach(t=>t.style.display="none")
document.getElementById(id).style.display="block"
}

// PRODUTOS
let produtos = JSON.parse(localStorage.getItem("produtos")) || []
let edit = -1

function salvarProduto(){

let p={
codigo:codigo.value,
nome:nome.value,
cor:cor.value,
numero:numero.value,
quantidade:quantidade.value,
valor:valor.value
}

if(edit>=0){
produtos[edit]=p
edit=-1
}else{
produtos.push(p)
}

localStorage.setItem("produtos", JSON.stringify(produtos))
listarProdutos()
limpar()
}

function listarProdutos(){
let html=""
produtos.forEach((p,i)=>{
html+=`
<tr>
<td>${p.codigo}</td>
<td>${p.nome}</td>
<td>${p.cor}</td>
<td>${p.numero}</td>
<td>${p.quantidade}</td>
<td>R$ ${p.valor}</td>
<td>
<button onclick="editar(${i})">Editar</button>
<button onclick="excluir(${i})">Excluir</button>
</td>
</tr>`
})
listaProdutos.innerHTML=html
}

function editar(i){
let p=produtos[i]
codigo.value=p.codigo
nome.value=p.nome
cor.value=p.cor
numero.value=p.numero
quantidade.value=p.quantidade
valor.value=p.valor
edit=i
}

function excluir(i){
produtos.splice(i,1)
localStorage.setItem("produtos", JSON.stringify(produtos))
listarProdutos()
}

function limpar(){
codigo.value=""
nome.value=""
cor.value=""
numero.value=""
quantidade.value=""
valor.value=""
}

listarProdutos()

function scanProduto(){
const cam=new Html5Qrcode("reader")
Html5Qrcode.getCameras().then(dev=>{
cam.start(dev[0].id,{fps:10,qrbox:250},code=>{
codigo.value=code
cam.stop()
reader.innerHTML=""
})
})
}

// VENDAS
let venda=[]
let total=0

function addVenda(){
let p=produtos.find(x=>x.codigo==codVenda.value)
if(!p){alert("Produto não encontrado");return}
venda.push(p)
total+=Number(p.valor)
atualizarVenda()
}

function atualizarVenda(){
let html=""
venda.forEach((p,i)=>{
html+=`
<tr>
<td>${p.nome}</td>
<td>R$ ${p.valor}</td>
<td><button onclick="remover(${i})">X</button></td>
</tr>`
})
listaVenda.innerHTML=html
totalSpan.innerText=total.toFixed(2)
}

function remover(i){
total-=Number(venda[i].valor)
venda.splice(i,1)
atualizarVenda()
}

function finalizar(){
if(venda.length==0){alert("Sem venda");return}
alert("Total: R$ "+total+"\nPagamento: "+pagamento.value)
venda=[]
total=0
atualizarVenda()
}

function scanVenda(){
const cam=new Html5Qrcode("readerVenda")
Html5Qrcode.getCameras().then(dev=>{
cam.start(dev[0].id,{fps:10,qrbox:250},code=>{
codVenda.value=code
cam.stop()
readerVenda.innerHTML=""
})
})
}

const totalSpan=document.getElementById("total")

// FUNCIONÁRIOS
let funcionarios=JSON.parse(localStorage.getItem("funcionarios"))||[]

function salvarFunc(){
let f={
nome:nomeFunc.value,
cargo:cargoFunc.value,
ponto:[]
}
funcionarios.push(f)
localStorage.setItem("funcionarios", JSON.stringify(funcionarios))
nomeFunc.value=""
cargoFunc.value=""
listarFunc()
}

function listarFunc(){
let html=""
funcionarios.forEach((f,i)=>{
html+=`
<tr>
<td>${f.nome}</td>
<td>${f.cargo}</td>
<td><button onclick="ponto(${i})">Bater ponto</button></td>
<td><button onclick="excluirFunc(${i})">Excluir</button></td>
</tr>`
})
listaFunc.innerHTML=html
}

function ponto(i){
let hora=new Date().toLocaleString()
funcionarios[i].ponto.push(hora)
localStorage.setItem("funcionarios", JSON.stringify(funcionarios))
alert("Ponto: "+hora)
}

function excluirFunc(i){
funcionarios.splice(i,1)
localStorage.setItem("funcionarios", JSON.stringify(funcionarios))
listarFunc()
}

listarFunc()

</script>

</body>
</html>
