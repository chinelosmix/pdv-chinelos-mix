```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV CHINELOS MIX</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center}
input,button,select{padding:10px;margin:5px;font-size:16px}
button{background:green;color:#fff;border:none}
table{width:100%;margin-top:15px;border-collapse:collapse}
td,th{border:1px solid #555;padding:5px}
.tela{display:none}
.menu{background:#111;padding:10px}
#reader,#readerVenda{width:300px;margin:auto}
</style>
</head>

<body>

<h1>PDV CHINELOS MIX</h1>

<!-- LOGIN -->
<div id="login" class="tela" style="display:block">
<input id="user" placeholder="Usuário"><br>
<input id="pass" type="password" placeholder="Senha"><br>
<button onclick="entrar()">Entrar</button>
</div>

<!-- MENU -->
<div id="menu" class="tela menu">
<button onclick="mostrar('produtos')">📦 Produtos</button>
<button onclick="mostrar('vendas')">💰 Vendas</button>
<button onclick="mostrar('funcionarios')">👨‍💼 Funcionários</button>
</div>

<!-- PRODUTOS -->
<div id="produtos" class="tela">

<h2>Cadastro de Produto</h2>

<input id="codigo" placeholder="Código">
<button onclick="scanProduto()">📷 Scanner</button>
<div id="reader"></div>

<input id="nome" placeholder="Nome">
<input id="cor" placeholder="Cor">
<input id="numero" placeholder="Numeração">
<input id="quantidade" placeholder="Quantidade">
<input id="valor" placeholder="Valor">

<button onclick="salvarProduto()">Salvar</button>

<table>
<thead>
<tr>
<th>Código</th><th>Nome</th><th>Cor</th><th>Nº</th><th>Qtd</th><th>Valor</th><th>Ação</th>
</tr>
</thead>
<tbody id="listaProdutos"></tbody>
</table>

<button onclick="mostrar('menu')">⬅ Voltar</button>

</div>

<!-- VENDAS -->
<div id="vendas" class="tela">

<h2>Venda</h2>

<input id="codVenda" placeholder="Código">
<button onclick="scanVenda()">📷 Scanner</button>

<div id="readerVenda"></div>

<button onclick="addVenda()">Adicionar</button>

<h3>Total: R$ <span id="total">0</span></h3>

<select id="pagamento">
<option>Dinheiro</option>
<option>Pix</option>
<option>Débito</option>
<option>Crédito à vista</option>
<option>Crédito 2x</option>
<option>Crédito 3x</option>
</select>

<button onclick="imprimir()">🧾 Imprimir Cupom</button>
<button onclick="finalizar()">Finalizar</button>

<table>
<thead>
<tr><th>Nome</th><th>Valor</th><th>Ação</th></tr>
</thead>
<tbody id="listaVenda"></tbody>
</table>

<button onclick="mostrar('menu')">⬅ Voltar</button>

</div>

<!-- FUNCIONÁRIOS -->
<div id="funcionarios" class="tela">

<h2>Funcionários</h2>

<input id="nomeFunc" placeholder="Nome">
<input id="cargoFunc" placeholder="Cargo">

<button onclick="salvarFunc()">Salvar</button>

<table>
<thead>
<tr>
<th>Nome</th><th>Cargo</th><th>Ponto</th><th>Ação</th>
</tr>
</thead>
<tbody id="listaFunc"></tbody>
</table>

<button onclick="mostrar('menu')">⬅ Voltar</button>

</div>

<script>

// LOGIN
function entrar(){
if(user.value==="admin" && pass.value==="123"){
mostrar("menu")
}else{
alert("Login inválido")
}
}

// TROCAR TELA
function mostrar(t){
document.querySelectorAll(".tela").forEach(e=>e.style.display="none")
document.getElementById(t).style.display="block"
listarProdutos()
listarFunc()
}

// ================= PRODUTOS =================
let produtos = JSON.parse(localStorage.getItem("produtos"))||[]
let edit=-1

function salvarProduto(){
let p={
codigo:codigo.value,
nome:nome.value,
cor:cor.value,
numero:numero.value,
quantidade:quantidade.value,
valor:valor.value
}

if(edit>=0){
produtos[edit]=p
edit=-1
}else{
produtos.push(p)
}

localStorage.setItem("produtos",JSON.stringify(produtos))
listarProdutos()
limpar()
}

function listarProdutos(){
let html=""
produtos.forEach((p,i)=>{
html+=`
<tr>
<td>${p.codigo}</td>
<td>${p.nome}</td>
<td>${p.cor}</td>
<td>${p.numero}</td>
<td>${p.quantidade}</td>
<td>R$ ${p.valor}</td>
<td>
<button onclick="editar(${i})">Editar</button>
<button onclick="excluir(${i})">Excluir</button>
</td>
</tr>`
})
listaProdutos.innerHTML=html
}

function editar(i){
let p=produtos[i]
codigo.value=p.codigo
nome.value=p.nome
cor.value=p.cor
numero.value=p.numero
quantidade.value=p.quantidade
valor.value=p.valor
edit=i
}

function excluir(i){
produtos.splice(i,1)
localStorage.setItem("produtos",JSON.stringify(produtos))
listarProdutos()
}

function limpar(){
codigo.value=""
nome.value=""
cor.value=""
numero.value=""
quantidade.value=""
valor.value=""
}

// ================= SCANNER =================
let camProduto=null
let camVenda=null

function scanProduto(){

if(camProduto){
camProduto.stop()
camProduto=null
reader.innerHTML=""
return
}

camProduto=new Html5Qrcode("reader")

camProduto.start({facingMode:"environment"},{fps:10},code=>{
codigo.value=code
camProduto.stop()
camProduto=null
reader.innerHTML=""
})
}

function scanVenda(){

if(camVenda){
camVenda.stop()
camVenda=null
readerVenda.innerHTML=""
return
}

camVenda=new Html5Qrcode("readerVenda")

camVenda.start({facingMode:"environment"},{fps:10},code=>{
codVenda.value=code
camVenda.stop()
camVenda=null
readerVenda.innerHTML=""
})
}

// ================= VENDAS =================
let venda=[]
let total=0

function addVenda(){
let p=produtos.find(x=>x.codigo==codVenda.value)
if(!p)return alert("Produto não encontrado")

venda.push(p)
total+=Number(p.valor)
atualizarVenda()
}

function atualizarVenda(){
let html=""
venda.forEach((p,i)=>{
html+=`
<tr>
<td>${p.nome}</td>
<td>R$ ${p.valor}</td>
<td><button onclick="remover(${i})">X</button></td>
</tr>`
})
listaVenda.innerHTML=html
document.getElementById("total").innerText=total.toFixed(2)
}

function remover(i){
total-=Number(venda[i].valor)
venda.splice(i,1)
atualizarVenda()
}

// 🧾 CUPOM PROFISSIONAL
function imprimir(){

let cupom = `
CHINELOS MIX
CNPJ: 46.982.791/0001-01
END: AV. LEONOR BOLSONI MARQUES DA SILVA, 45
CENTRO - POÁ

-----------------------------
`

venda.forEach(p=>{
cupom += `${p.nome} - R$ ${p.valor}\n`
})

cupom += `
-----------------------------
TOTAL: R$ ${total.toFixed(2)}
PAGAMENTO: ${pagamento.value}

OBRIGADO PELA PREFERÊNCIA!
`

let w = window.open("", "", "width=300,height=600")
w.document.write("<pre style='font-size:14px'>"+cupom+"</pre>")
w.print()
}

function finalizar(){
alert("Venda finalizada")
venda=[]
total=0
atualizarVenda()
}

// ================= FUNCIONÁRIOS =================
let funcionarios=JSON.parse(localStorage.getItem("funcionarios"))||[]

function salvarFunc(){
funcionarios.push({
nome:nomeFunc.value,
cargo:cargoFunc.value,
ponto:[]
})
localStorage.setItem("funcionarios",JSON.stringify(funcionarios))
listarFunc()
}

function listarFunc(){
let html=""
funcionarios.forEach((f,i)=>{
html+=`
<tr>
<td>${f.nome}</td>
<td>${f.cargo}</td>
<td>
<button onclick="ponto(${i},'Entrada')">Entrada</button>
<button onclick="ponto(${i},'Almoço')">Almoço</button>
<button onclick="ponto(${i},'Volta')">Volta</button>
<button onclick="ponto(${i},'Saída')">Saída</button>
</td>
<td><button onclick="excluirFunc(${i})">Excluir</button></td>
</tr>`
})
listaFunc.innerHTML=html
}

function ponto(i,tipo){
let hora=new Date().toLocaleString()
funcionarios[i].ponto.push({tipo,hora})
localStorage.setItem("funcionarios",JSON.stringify(funcionarios))
alert(tipo+" registrado: "+hora)
}

function excluirFunc(i){
funcionarios.splice(i,1)
localStorage.setItem("funcionarios",JSON.stringify(funcionarios))
listarFunc()
}

listarProdutos()
listarFunc()

</script>

</body>
</html>
```
