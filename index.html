<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV CHINELOS MIX</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
header{background:#020617;padding:15px;text-align:center}
nav{display:flex;background:#020617}
nav button{flex:1;padding:12px;border:none;background:#020617;color:#fff}
.box{display:none;padding:10px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:5px;border:none}
button{padding:10px;background:#22c55e;color:#fff;border:none;border-radius:5px;margin-top:5px}
table{width:100%;margin-top:10px;border-collapse:collapse}
td,th{border-bottom:1px solid #334155;padding:8px}
#reader{width:300px;margin:auto}
</style>
</head>

<body>

<header>PDV CHINELOS MIX</header>

<div id="loginBox">
<input id="user" placeholder="Nome">
<input id="senha" placeholder="Senha" type="password">
<button onclick="login()">Entrar</button>
</div>

<nav>
<button onclick="show('prod')">Produtos</button>
<button onclick="show('ven')">Venda</button>
<button onclick="show('rel')">Relatório</button>
</nav>

<!-- PRODUTOS -->
<div id="prod" class="box">

<input id="codigo" placeholder="Código ou escaneie">
<button onclick="gerarCodigo()">Gerar Código</button>
<button onclick="iniciarScanner()">📷 Escanear</button>

<div id="reader"></div>

<input id="nome" placeholder="Nome">
<input id="cor" placeholder="Cor">
<input id="numero" placeholder="Numeração">
<input id="estoque" placeholder="Quantidade">
<input id="valor" placeholder="Valor">

<button onclick="salvarProduto()">Salvar</button>

<table>
<thead>
<tr>
<th>Código</th><th>Nome</th><th>Cor</th><th>Nº</th><th>Qtd</th><th>Valor</th><th>Ações</th>
</tr>
</thead>
<tbody id="listaProdutos"></tbody>
</table>

</div>

<!-- VENDA -->
<div id="ven" class="box">

<input id="codVenda" placeholder="Passe o código">
<input id="qtd" value="1">
<button onclick="addVenda()">Adicionar</button>

<h3>Total: R$ <span id="total">0</span></h3>

<table id="listaVenda"></table>

<button onclick="finalizar()">Finalizar</button>

</div>

<!-- RELATORIO -->
<div id="rel" class="box">
<table id="listaRelatorio"></table>
<h3 id="totalRelatorio"></h3>
</div>

<script>

// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyARpePSrPuvzOwLP6v9gzmhWfzdo0JZJK4",
  authDomain: "pdv-chinelos.firebaseapp.com",
  projectId: "pdv-chinelos-2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let produtos=[]
let venda=[],totalVenda=0
let usuarioAtual=""

// LOGIN
function login(){
if(!user.value || !senha.value){
alert("Preencha os dados")
return
}
usuarioAtual=user.value
loginBox.style.display="none"
}

// GERAR CODIGO
function gerarCodigo(){
codigo.value = "789" + Math.floor(Math.random()*1000000000)
}

// SCANNER CAMERA
function iniciarScanner(){
let scanner = new Html5Qrcode("reader")

scanner.start(
{ facingMode: "environment" },
{ fps: 10, qrbox: 250 },
(codigoLido)=>{
codigo.value = codigoLido
scanner.stop()
}
)
}

// FIREBASE REALTIME
db.collection("produtos").onSnapshot(snapshot=>{
produtos = snapshot.docs.map(doc=>({
id:doc.id,
...doc.data()
}))
listarProdutos()
})

// SALVAR
async function salvarProduto(){

let cod = codigo.value || Date.now().toString()

let produto={
codigo: cod,
codigoBarras: cod,
nome: nome.value,
cor: cor.value,
numero: numero.value,
estoque: Number(estoque.value||0),
valor: Number(valor.value||0)
}

let existente = produtos.find(p=>p.codigo==cod)

if(existente){
await db.collection("produtos").doc(existente.id).set(produto)
}else{
await db.collection("produtos").add(produto)
}

limparCampos()
}

// EDITAR
function editar(cod){
let p = produtos.find(x=>x.codigo==cod)
if(!p)return

codigo.value=p.codigo
nome.value=p.nome
cor.value=p.cor
numero.value=p.numero
estoque.value=p.estoque
valor.value=p.valor
}

// EXCLUIR
async function excluir(cod){
if(!confirm("Excluir produto?")) return
let p = produtos.find(x=>x.codigo==cod)
if(!p)return
await db.collection("produtos").doc(p.id).delete()
}

// LISTAR
function listarProdutos(){

if(!produtos.length){
listaProdutos.innerHTML="<tr><td colspan='7'>Nenhum produto</td></tr>"
return
}

listaProdutos.innerHTML = produtos.map(p=>`
<tr>
<td>${p.codigo}</td>
<td>${p.nome}</td>
<td>${p.cor}</td>
<td>${p.numero}</td>
<td>${p.estoque}</td>
<td>R$ ${Number(p.valor).toFixed(2)}</td>
<td>
<button onclick="editar('${p.codigo}')">✏️</button>
<button onclick="excluir('${p.codigo}')">🗑️</button>
<button onclick="etiqueta('${p.codigo}')">🏷️</button>
</td>
</tr>
`).join("")
}

// ETIQUETA
function etiqueta(cod){
let p = produtos.find(x=>x.codigo==cod)
if(!p)return

let html = `
<html>
<body style="font-family:monospace;text-align:center">
<b>CHINELOS MIX</b><br>
${p.nome}<br>
${p.cor} | ${p.numero}<br>
<b>R$ ${Number(p.valor).toFixed(2)}</b><br>
<svg id="barcode"></svg>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>
<script>
JsBarcode("#barcode","${p.codigo}",{width:2,height:40,displayValue:false})
window.print()
<\/script>
</body>
</html>
`
let w=window.open("")
w.document.write(html)
}

// VENDA
function addVenda(){

let p = produtos.find(x =>
x.codigo==codVenda.value ||
x.codigoBarras==codVenda.value
)

if(!p)return alert("Produto não encontrado")

let q=Number(qtd.value)

venda.push({...p,qtd:q})
totalVenda+=p.valor*q

codVenda.value=""
atualizarVenda()
}

function atualizarVenda(){
listaVenda.innerHTML=venda.map(p=>`
<tr><td>${p.nome}</td><td>${p.qtd}</td><td>R$${p.valor}</td></tr>
`).join("")
total.innerText=totalVenda.toFixed(2)
}

// FINALIZAR
async function finalizar(){
await db.collection("vendas").add({
itens:venda,
total:totalVenda,
data:new Date(),
usuario:usuarioAtual
})

venda=[];totalVenda=0
atualizarVenda()
alert("Venda salva")
}

// RELATORIO
async function listarRelatorio(){

let snap = await db.collection("vendas").get()

let t=0
listaRelatorio.innerHTML=snap.docs.map(doc=>{
let r = doc.data()
t+=r.total
return `<tr><td>R$${r.total}</td></tr>`
}).join("")

totalRelatorio.innerText="Total: R$ "+t.toFixed(2)
}

// LIMPAR
function limparCampos(){
codigo.value=""
nome.value=""
cor.value=""
numero.value=""
estoque.value=""
valor.value=""
}

// NAV
function show(t){
document.querySelectorAll(".box").forEach(x=>x.style.display="none")
document.getElementById(t).style.display="block"
listarRelatorio()
}

show("prod")

</script>

</body>
</html>
