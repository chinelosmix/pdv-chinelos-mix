```html id="sistema-pdv-final">
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV CHINELOS MIX</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
header{background:#020617;padding:15px;text-align:center}
nav{display:flex;background:#020617}
nav button{flex:1;padding:12px;border:none;background:#020617;color:#fff}
.box{display:none;padding:10px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:5px;border:none}
button{padding:10px;background:#22c55e;color:#fff;border:none;border-radius:5px;margin-top:5px}
table{width:100%;margin-top:10px;border-collapse:collapse}
td,th{border-bottom:1px solid #334155;padding:8px}
#reader,#readerVenda{width:300px;margin:auto}
</style>
</head>

<body>

<header>PDV CHINELOS MIX</header>

<div id="loginBox">
<input id="user" placeholder="Funcionário">
<button onclick="login()">Entrar</button>
</div>

<nav>
<button onclick="show('prod')">Produtos</button>
<button onclick="show('ven')">Venda</button>
<button onclick="show('fun')">Funcionários</button>
<button onclick="show('cx')">Caixa</button>
<button onclick="show('rel')">Relatório</button>
</nav>

<!-- PRODUTOS -->
<div id="prod" class="box">
<h2>Produtos</h2>

<input id="codigo" placeholder="Código">
<button onclick="scanProduto()">📷 Scanner</button>
<div id="reader"></div>

<input id="nome" placeholder="Nome">
<input id="cor" placeholder="Cor">
<input id="numero" placeholder="Numeração">
<input id="estoque" placeholder="Quantidade">
<input id="valor" placeholder="Valor">

<button onclick="salvarProduto()">Salvar</button>

<table>
<thead>
<tr>
<th>Código</th><th>Nome</th><th>Cor</th><th>Nº</th><th>Qtd</th><th>Valor</th><th>Ação</th>
</tr>
</thead>
<tbody id="listaProdutos"></tbody>
</table>
</div>

<!-- VENDAS -->
<div id="ven" class="box">
<h2>Venda</h2>

<input id="codVenda" placeholder="Código">
<button onclick="scanVenda()">📷 Scanner</button>
<div id="readerVenda"></div>

<input id="qtd" value="1">
<button onclick="addVenda()">Adicionar</button>

<select id="pagamento">
<option>Dinheiro</option>
<option>Pix</option>
<option>Débito</option>
<option>Crédito à vista</option>
<option>Crédito 2x</option>
<option>Crédito 3x</option>
<option>Vale</option>
</select>

<h3>Total: R$ <span id="total">0</span></h3>

<button onclick="imprimir()">🧾 Imprimir Cupom</button>
<button onclick="finalizar()">Finalizar</button>

<table id="listaVenda"></table>
</div>

<!-- FUNCIONARIOS -->
<div id="fun" class="box">
<h2>Funcionários</h2>

<input id="nomeF" placeholder="Nome">
<input id="cargoF" placeholder="Cargo">
<button onclick="salvarFunc()">Salvar</button>

<table id="listaFunc"></table>
</div>

<!-- CAIXA -->
<div id="cx" class="box">
<input id="valorInicial" placeholder="Valor inicial">
<button onclick="abrirCaixa()">Abrir</button>
<button onclick="fecharCaixa()">Fechar</button>
<h3 id="status"></h3>
</div>

<!-- RELATORIO -->
<div id="rel" class="box">
<h2>Relatório</h2>
<table id="listaRelatorio"></table>
<h3>Total: R$ <span id="totalRelatorio">0</span></h3>
</div>

<script>

// LOGIN
let usuarioAtual=""
function login(){
usuarioAtual=user.value
loginBox.style.display="none"
}

// PRODUTOS
let produtos=JSON.parse(localStorage.getItem("produtos"))||[]
let edit=-1

function salvarProduto(){
let p={codigo:codigo.value,nome:nome.value,cor:cor.value,numero:numero.value,estoque:Number(estoque.value),valor:Number(valor.value)}
if(edit>=0){produtos[edit]=p;edit=-1}else{produtos.push(p)}
localStorage.setItem("produtos",JSON.stringify(produtos))
listarProdutos()
}

function listarProdutos(){
listaProdutos.innerHTML=produtos.map((p,i)=>`
<tr>
<td>${p.codigo}</td>
<td>${p.nome}</td>
<td>${p.cor}</td>
<td>${p.numero}</td>
<td>${p.estoque}</td>
<td>R$${p.valor}</td>
<td>
<button onclick="editar(${i})">Editar</button>
<button onclick="excluir(${i})">Excluir</button>
</td>
</tr>`).join("")
}

function editar(i){
let p=produtos[i]
codigo.value=p.codigo
nome.value=p.nome
cor.value=p.cor
numero.value=p.numero
estoque.value=p.estoque
valor.value=p.valor
edit=i
}

function excluir(i){
produtos.splice(i,1)
localStorage.setItem("produtos",JSON.stringify(produtos))
listarProdutos()
}

// SCANNER
let cam=null
function scanProduto(){
if(cam){cam.stop();cam=null;reader.innerHTML="";return}
cam=new Html5Qrcode("reader")
cam.start({facingMode:"environment"},{fps:10},c=>{
codigo.value=c
cam.stop();reader.innerHTML="";cam=null
})
}
function scanVenda(){
if(cam){cam.stop();cam=null;readerVenda.innerHTML="";return}
cam=new Html5Qrcode("readerVenda")
cam.start({facingMode:"environment"},{fps:10},c=>{
codVenda.value=c
cam.stop();readerVenda.innerHTML="";cam=null
})
}

// VENDAS
let venda=[],totalVenda=0
let rel=JSON.parse(localStorage.getItem("rel"))||[]

function addVenda(){
let p=produtos.find(x=>x.codigo==codVenda.value)
if(!p)return alert("Produto não encontrado")

let q=Number(qtd.value)
if(p.estoque<q)return alert("Sem estoque")

p.estoque-=q
venda.push({...p,qtd:q})
totalVenda+=p.valor*q

localStorage.setItem("produtos",JSON.stringify(produtos))

codVenda.value=""
qtd.value=1
atualizarVenda()
}

function atualizarVenda(){
listaVenda.innerHTML=venda.map(p=>`
<tr><td>${p.nome}</td><td>${p.qtd}</td><td>R$${p.valor}</td></tr>`).join("")
total.innerText=totalVenda.toFixed(2)
}

// CUPOM PERFEITO
function imprimir(){

let agrupado={}
venda.forEach(p=>{
let k=p.codigo+p.nome
if(!agrupado[k]) agrupado[k]={nome:p.nome,qtd:0,valor:p.valor,total:0}
agrupado[k].qtd+=p.qtd
agrupado[k].total+=p.valor*p.qtd
})

function linha(i,n,q,v,t){
return `${String(i).padStart(3,"0")} ${n.substring(0,18).padEnd(18)} ${String(q).padStart(3)} ${("R$"+v.toFixed(2)).padStart(8)} ${("R$"+t.toFixed(2)).padStart(8)}`
}

let html=`<pre style="font-family:monospace">
CHINELOS MIX
CNPJ: 46.982.791/0001-01
AV. LEONOR BOLSONI MARQUES DA SILVA, 45
----------------------------------------
ITEM PRODUTO           QTD VALOR UNIT TOTAL
----------------------------------------
`

let i=1
Object.values(agrupado).forEach(p=>{
html+=linha(i,p.nome,p.qtd,p.valor,p.total)+"\n"
i++
})

html+=`----------------------------------------
TOTAL: R$ ${totalVenda.toFixed(2)}
PAGAMENTO: ${pagamento.value}
RECEBIDO: R$ ${totalVenda.toFixed(2)}

Atendido por: ${usuarioAtual}

OBRIGADO, VOLTE SEMPRE!
</pre>`

let w=window.open("")
w.document.write(html)
w.print()
}

// FINALIZAR
function finalizar(){
rel.push({data:new Date().toLocaleString(),total:totalVenda,pagamento:pagamento.value})
localStorage.setItem("rel",JSON.stringify(rel))
venda=[];totalVenda=0;atualizarVenda()
alert("Venda finalizada")
}

// RELATORIO
function listarRelatorio(){
let t=0
listaRelatorio.innerHTML=rel.map(r=>{
t+=r.total
return `<tr><td>${r.data}</td><td>R$${r.total}</td><td>${r.pagamento}</td></tr>`
}).join("")
totalRelatorio.innerText=t.toFixed(2)
}

// FUNCIONARIOS
let funcs=JSON.parse(localStorage.getItem("funcs"))||[]

function salvarFunc(){
funcs.push({nome:nomeF.value,cargo:cargoF.value})
localStorage.setItem("funcs",JSON.stringify(funcs))
listarFunc()
}

function listarFunc(){
listaFunc.innerHTML=funcs.map((f,i)=>`
<tr>
<td>${f.nome}</td>
<td>${f.cargo}</td>
<td>
<button onclick="excluirFunc(${i})">Excluir</button>
</td>
</tr>`).join("")
}

function excluirFunc(i){
funcs.splice(i,1)
localStorage.setItem("funcs",JSON.stringify(funcs))
listarFunc()
}

// NAV
function show(t){
document.querySelectorAll(".box").forEach(x=>x.style.display="none")
document.getElementById(t).style.display="block"
listarProdutos()
listarFunc()
listarRelatorio()
}

show("ven")

</script>

</body>
</html>
```
