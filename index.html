// ================= VENDA =================
function addVenda(){

let codigo = document.getElementById("codVenda").value
let quantidade = Number(document.getElementById("qtd").value || 1)

let p = produtos.find(x => String(x.codigo) === String(codigo))

if(!p){
  alert("Produto não encontrado")
  return
}

// 👇 AQUI QUE FALTAVA
let item = venda.find(x => x.codigo == p.codigo)

if(item){
  item.qtd += quantidade
}else{
  venda.push({
    codigo: p.codigo,
    nome: p.nome,
    valor: Number(p.valor),
    qtd: quantidade
  })
}

renderVenda()

}

function renderVenda(){

document.getElementById("listaVenda").innerHTML = venda.map((p,i)=>`
<tr>
<td>${p.nome}</td>
<td>${p.qtd}</td>
<td>R$ ${(p.valor*p.qtd).toFixed(2)}</td>
<td><button onclick="remover(${i})">X</button></td>
</tr>
`).join("")

let total = venda.reduce((s,p)=> s + (p.valor*p.qtd),0)

document.getElementById("total").innerText = total.toFixed(2)
}
// REMOVER
function remover(i){
totalVenda -= venda[i].valor*venda[i].qtd
venda.splice(i,1)
renderVenda()
}
function montarCupom() {

    if (!venda || venda.length === 0) {
        alert("Nenhum produto na venda!");
        return "";
    }

    let cupom = "";
    let total = 0;

    venda.forEach(item => {

        // 🧠 nome
        const nome = item.nome || item.produto || "Produto";

        // 🧠 quantidade
        const qtd = Number(item.qtd || item.quantidade || 1);

        // 🧠 preço (resolve QUALQUER formato)
        let preco = item.preco ?? item.valor ?? item.price ?? item.preço ?? 0;

        // 🔥 converte para número (resolve string)
        preco = Number(preco);

        // 🔥 se ainda for inválido, vira 0
        if (isNaN(preco)) preco = 0;

        cupom += `${nome} - ${qtd}x R$ ${preco.toFixed(2)}\n`;

        total += qtd * preco;
    });

    cupom += "\nTOTAL: R$ " + total.toFixed(2);

    return cupom;
}
function imprimirCupom(cupom) {

    const janela = window.open('', '', 'width=300,height=600');

    janela.document.write(`

    janela.print();
}
// BUSCA
function buscarProduto(){

(x.nome||"").toLowerCase().includes(termo) ||
(x.codigo||"").includes(termo)
)

// TROCO
function calcularTroco(){

let total = 0

venda.forEach(p=>{
  total += Number(p.valor) * Number(p.qtd)
})

// 👇 corrige vírgula
let pagoInput = document.getElementById("valorPago").value.replace(",", ".")

let pago = Number(pagoInput || 0)

let troco = pago - total

document.getElementById("troco").innerText = troco.toFixed(2)

}

// FINALIZAR
function finalizarVenda() {

    if (!venda || venda.length === 0) {
        alert("Adicione produtos antes de finalizar!");
        return;
    }

    const cupom = montarCupom();

    if (!cupom) return;

    // 🔥 AQUI CHAMA IMPRESSÃO
    imprimirCupom(cupom);

    alert("Venda finalizada!");

    venda = [];

    if (typeof atualizarTela === "function") {
        atualizarTela();
    }
}
function enviarWhatsUltima() {

    if (!venda || venda.length === 0) {
        alert("Nenhuma venda para enviar!");
        return;
    }

    const cupom = montarCupom();
    if (!cupom) return;

    // 🔥 usa encode completo (mais seguro)
    const mensagem = encodeURIComponent("🧾 CUPOM DA COMPRA:\n\n" + cupom);

    // 🔥 VOLTAMOS PRO MODELO QUE FUNCIONA EM QUALQUER DISPOSITIVO
    const url = "https://wa.me/?text=" + mensagem;

    window.open(url, "_blank");
}

async function atualizarEstoqueTroca(){

  // DEVOLVIDO (entra no estoque)
  for(let p of entrada){

    let prod = produtos.find(x => x.codigo == p.codigo)
    if(!prod) continue

    await db.collection("produtos").doc(prod.id).update({
      estoque: (prod.estoque || 0) + p.qtd
    })

  }

  // NOVO (sai do estoque)
  for(let p of saida){

    let prod = produtos.find(x => x.codigo == p.codigo)
    if(!prod) continue

    await db.collection("produtos").doc(prod.id).update({
      estoque: (prod.estoque || 0) - p.qtd
    })

  }

}

    venda.forEach(item => {

        const nome = item.nome || "Produto";
        const qtd = item.qtd || 1;
        const preco = item.preco || 0;

        cupom += `${nome} - ${qtd}x R$ ${preco}\n`;
        total += qtd * preco;
    });

    cupom += "\nTOTAL: R$ " + total.toFixed(2);

    return cupom;
}

    if (!lista || !totalEl) return;

    lista.innerHTML = "";

    let total = 0;

    venda.forEach((item, i) => {

        const preco = Number(item.preco || 0);
        const subtotal = item.qtd * preco;

        total += subtotal;

        lista.innerHTML += `
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <div>
                    <strong>${item.nome}</strong><br>
                    ${item.qtd}x R$ ${preco.toFixed(2)}
                </div>
                <div>
                    R$ ${subtotal.toFixed(2)}
                </div>
            </div>
        `;
    });

    totalEl.innerText = "Total: R$ " + total.toFixed(2);
}
</script>
</body>
</html>
