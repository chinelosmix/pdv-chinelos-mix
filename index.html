<script>

const API = window.location.origin

let produtos=[]
let venda=[],totalVenda=0
let usuarioAtual=""

// GERAR CÓDIGO BARRAS
function gerarCodigoBarras(){
return Date.now().toString()
}

// LOGIN
async function login(){
let res = await fetch(API+"/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({nome:user.value,senha:senha.value})
})

if(res.status!==200){alert("Login inválido");return}
let f = await res.json()
usuarioAtual=f.nome
loginBox.style.display="none"
}

// PRODUTOS
async function carregarProdutos(){
let res = await fetch(API+"/produtos")
produtos = await res.json()
listarProdutos()
}

async function salvarProduto(){

let produto={
codigo:codigo.value || Date.now(),
codigoBarras: gerarCodigoBarras(),
nome:nome.value,
cor:cor.value,
numero:numero.value,
estoque:Number(estoque.value),
valor:Number(valor.value)
}

await fetch(API+"/produtos",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(produto)
})

carregarProdutos()
}

function listarProdutos(){
listaProdutos.innerHTML=produtos.map(p=>`
<tr>
<td>${p.codigo}</td>
<td>${p.nome}</td>
<td>${p.cor}</td>
<td>${p.numero}</td>
<td>${p.estoque}</td>
<td>R$${p.valor}</td>
<td>
<button onclick="editar('${p.codigo}')">✏️</button>
<button onclick="excluir('${p.codigo}')">🗑️</button>
<button onclick="etiqueta('${p.codigo}')">🏷️</button>
</td>
</tr>
`).join("")
}

// EDITAR
function editar(cod){
let p = produtos.find(x=>x.codigo==cod)
codigo.value=p.codigo
nome.value=p.nome
cor.value=p.cor
numero.value=p.numero
estoque.value=p.estoque
valor.value=p.valor
}

// EXCLUIR
async function excluir(cod){
if(!confirm("Excluir produto?")) return
await fetch(API+"/produtos/"+cod,{method:"DELETE"})
carregarProdutos()
}

// ETIQUETA
function etiqueta(cod){
let p = produtos.find(x=>x.codigo==cod)

let html = `
<html>
<head>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
body{font-family:monospace;text-align:center}
.etq{width:60mm}
.valor{font-size:18px;font-weight:bold}
</style>
</head>
<body>

<div class="etq">
<b>CHINELOS MIX</b><br>
${p.nome}<br>
${p.cor} | ${p.numero}<br>
<div class="valor">R$ ${p.valor.toFixed(2)}</div>
<svg id="barcode"></svg><br>
${p.codigoBarras}
</div>

<script>
JsBarcode("#barcode","${p.codigoBarras}",{
format:"CODE128",
width:2,
height:40,
displayValue:false
})
window.print()
<\/script>

</body>
</html>
`

let w=window.open("")
w.document.write(html)
}

// VENDA
function addVenda(){
let p=produtos.find(x=>x.codigo==codVenda.value || x.codigoBarras==codVenda.value)
if(!p)return alert("Produto não encontrado")

let q=Number(qtd.value)
venda.push({...p,qtd:q})
totalVenda+=p.valor*q
codVenda.value=""
atualizarVenda()
}

function atualizarVenda(){
listaVenda.innerHTML=venda.map(p=>`
<tr><td>${p.nome}</td><td>${p.qtd}</td><td>R$${p.valor}</td></tr>`).join("")
total.innerText=totalVenda.toFixed(2)

let r=Number(recebido.value)
troco.innerText=r?(r-totalVenda).toFixed(2):0
}

// FINALIZAR
async function finalizar(){
await fetch(API+"/venda",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({itens:venda,total:totalVenda})
})

venda=[];totalVenda=0
atualizarVenda()
alert("Venda salva")
}

// RELATORIO
async function listarRelatorio(){
let res = await fetch(API+"/relatorio")
let dados = await res.json()

let t=0
listaRelatorio.innerHTML=dados.map(r=>{
t+=r.total
return `<tr><td>R$${r.total}</td></tr>`
}).join("")

totalRelatorio.innerText="Total: R$ "+t.toFixed(2)
}

// NAV
function show(t){
document.querySelectorAll(".box").forEach(x=>x.style.display="none")
document.getElementById(t).style.display="block"

carregarProdutos()
listarRelatorio()
}

show("ven")

</script>
