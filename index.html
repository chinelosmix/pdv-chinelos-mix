```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV CHINELOS MIX</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
header{background:#020617;padding:15px;text-align:center}
nav{display:flex;background:#020617}
nav button{flex:1;padding:12px;background:#020617;color:#fff;border:none}
.box{display:none;padding:10px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:5px;border:none}
button{padding:10px;background:#22c55e;color:#fff;border:none;border-radius:5px;margin-top:5px}
table{width:100%;margin-top:10px;border-collapse:collapse}
td,th{border-bottom:1px solid #334155;padding:8px}
</style>
</head>

<body>

<header>PDV CHINELOS MIX</header>

<nav>
<button onclick="show('prod')">Produtos</button>
<button onclick="show('ven')">Venda</button>
<button onclick="show('fun')">Funcionários</button>
<button onclick="show('cx')">Caixa</button>
<button onclick="show('rel')">Relatório</button>
</nav>

<!-- PRODUTOS -->
<div id="prod" class="box">
<h2>Produto</h2>

<input id="codigo" placeholder="Código">
<input id="nome" placeholder="Nome">
<input id="cor" placeholder="Cor">
<input id="numero" placeholder="Numeração">
<input id="estoque" placeholder="Estoque">
<input id="valor" placeholder="Valor">

<button onclick="salvarP()">Salvar</button>

<table>
<thead>
<tr>
<th>Código</th><th>Nome</th><th>Cor</th><th>Nº</th><th>Qtd</th><th>Valor</th><th>Ação</th>
</tr>
</thead>
<tbody id="listaP"></tbody>
</table>
</div>

<!-- VENDAS -->
<div id="ven" class="box">
<h2>Venda</h2>

<input id="codVenda" placeholder="Código">
<input id="qtd" value="1">
<button onclick="add()">Adicionar</button>

<h3>Total: R$ <span id="total">0</span></h3>

<button onclick="cupom()">Imprimir Cupom</button>

<table id="listaV"></table>
</div>

<!-- FUNCIONARIOS -->
<div id="fun" class="box">
<h2>Funcionários</h2>

<input id="nomeF" placeholder="Nome">
<input id="cargoF" placeholder="Cargo">

<button onclick="salvarF()">Salvar</button>

<table id="listaF"></table>
</div>

<script>

// ===== PRODUTOS =====
let prod=JSON.parse(localStorage.getItem("prod"))||[]
let edit=-1

function salvarP(){

let p={
codigo:codigo.value,
nome:nome.value,
cor:cor.value,
numero:numero.value,
estoque:estoque.value,
valor:valor.value
}

if(edit>=0){
prod[edit]=p
edit=-1
}else{
prod.push(p)
}

localStorage.setItem("prod",JSON.stringify(prod))
listarP()
}

function listarP(){
listaP.innerHTML=prod.map((p,i)=>`
<tr>
<td>${p.codigo}</td>
<td>${p.nome}</td>
<td>${p.cor}</td>
<td>${p.numero}</td>
<td>${p.estoque}</td>
<td>${p.valor}</td>
<td>
<button onclick="editar(${i})">Editar</button>
<button onclick="excluir(${i})">Excluir</button>
</td>
</tr>
`).join("")
}

function editar(i){
let p=prod[i]
codigo.value=p.codigo
nome.value=p.nome
cor.value=p.cor
numero.value=p.numero
estoque.value=p.estoque
valor.value=p.valor
edit=i
}

function excluir(i){
prod.splice(i,1)
localStorage.setItem("prod",JSON.stringify(prod))
listarP()
}

// ===== VENDAS =====
let venda=[]
let total=0

function add(){
let p=prod.find(x=>x.codigo==codVenda.value)
if(!p)return alert("Produto não encontrado")

let q=Number(qtd.value)

venda.push({...p,qtd:q})
total+=Number(p.valor)*q

atualizar()
}

function atualizar(){
listaV.innerHTML=venda.map(p=>`
<tr>
<td>${p.nome}</td>
<td>${p.qtd}</td>
<td>R$${p.valor}</td>
</tr>
`).join("")

document.getElementById("total").innerText=total.toFixed(2)
}

// CUPOM
function cupom(){
let txt="CHINELOS MIX\n\n"

venda.forEach(p=>{
txt+=`${p.nome}  ${p.qtd}  R$${p.valor}\n`
})

txt+=`
TOTAL: R$ ${total.toFixed(2)}

OBRIGADO, VOLTE SEMPRE!
`

let w=window.open()
w.document.write("<pre>"+txt+"</pre>")
w.print()
}

// ===== FUNCIONARIOS =====
let funcs=JSON.parse(localStorage.getItem("funcs"))||[]

function salvarF(){
funcs.push({nome:nomeF.value,cargo:cargoF.value,ponto:[]})
localStorage.setItem("funcs",JSON.stringify(funcs))
listarF()
}

function listarF(){
listaF.innerHTML=funcs.map((f,i)=>`
<tr>
<td>${f.nome}</td>
<td>${f.cargo}</td>
<td>
<button onclick="ponto(${i},'Entrada')">Entrada</button>
<button onclick="ponto(${i},'Saída')">Saída</button>
<button onclick="imprimir(${i})">🧾 Imprimir</button>
</td>
</tr>
`).join("")
}

function ponto(i,t){
let h=new Date().toLocaleString()
funcs[i].ponto.push({tipo:t,hora:h})
localStorage.setItem("funcs",JSON.stringify(funcs))
alert(t+" "+h)
}

function imprimir(i){
let f=funcs[i]
let u=f.ponto[f.ponto.length-1]

let w=window.open()
w.document.write(`<pre>${f.nome}\n${u.tipo}\n${u.hora}</pre>`)
w.print()
}

// ===== INICIO =====
function show(t){
document.querySelectorAll(".box").forEach(x=>x.style.display="none")
document.getElementById(t).style.display="block"
listarP()
listarF()
}

show("ven")

</script>

</body>
</html>
```
