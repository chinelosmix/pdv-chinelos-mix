<!DOCTYPE html>
<html>
<head>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<meta charset="UTF-8">
<title>PDV CHINELOS MIX</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
header{background:#020617;padding:15px;text-align:center;font-weight:bold}
nav{display:flex;background:#020617}
nav button{flex:1;padding:12px;border:none;background:#020617;color:#fff}
.box{display:none;padding:10px}
input,select{width:100%;padding:10px;margin:5px 0;border:none;border-radius:5px}
button{padding:10px;background:#22c55e;color:#fff;border:none;border-radius:5px;margin-top:5px}
table{width:100%;margin-top:10px;border-collapse:collapse}
td,th{border-bottom:1px solid #334155;padding:8px}
</style>
</head>

<body>

<header>PDV CHINELOS MIX</header>

<div id="loginBox">
<input id="user" placeholder="Nome">
<button onclick="login()">Entrar</button>
</div>

<nav>
<button onclick="show('prod')">Produtos</button>
<button onclick="show('ven')">Venda</button>
<button onclick="show('rel')">Relatório</button>
</nav>

<div id="prod" class="box">

<h3>Cadastro de Produtos</h3>

<input id="codigo" placeholder="Código">

<button onclick="gerarCodigo()">Gerar Código</button>
<button onclick="toggleScanner()">📷 Scanner</button>

<div id="reader" style="width:250px"></div>

<input id="nome" placeholder="Nome">
<input id="cor" placeholder="Cor">
<input id="numero" placeholder="Numeração">
<input id="estoque" placeholder="Quantidade">
<input id="valor" placeholder="Valor">

<button onclick="salvarProduto()">Salvar</button>

<table>
<thead>
<tr>
<th>Código</th>
<th>Nome</th>
<th>Cor</th>
<th>Numeração</th>
<th>Quantidade</th>
<th>Valor</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="listaProdutos"></tbody>
</table>

</div>

<!-- VENDA -->
<div id="ven" class="box">

<input id="codVenda" placeholder="Código">
<input id="buscaProduto" placeholder="Buscar">
<button onclick="buscarProduto()">Buscar</button>

<input id="qtd" value="1">

<button onclick="toggleScannerVenda()">📷 Scanner</button>
<div id="readerVenda"></div>

<hr>

<h3>Total: R$ <span id="total">0.00</span></h3>

<h4>Pagamento</h4>

<select id="formaPagamento">
<option value="Dinheiro">Dinheiro</option>
<option value="Pix">Pix</option>
<option value="Cartão">Cartão</option>
</select>

<input id="valorPago" placeholder="Valor recebido">
<p>Troco: R$ <span id="troco">0.00</span></p>

<button onclick="calcularTroco()">Calcular Troco</button>

<hr>

<button onclick="finalizarVenda()">Finalizar Venda</button>
<button onclick="abrirTroca()">🔄 Troca</button>
<button onclick="enviarWhatsUltima()">📲 Enviar WhatsApp</button>
</div> <!-- VENDA -->
<div id="troca" class="box" style="display:none;">

<h3>🔄 Troca</h3>

<input id="codTroca" placeholder="Código do produto">
<input id="qtdTroca" value="1">

<button onclick="addTroca()">Adicionar</button>

<table>
<tbody id="listaTroca"></tbody>
</table>

<h3>Total Troca: R$ <span id="totalTroca">0.00</span></h3>

<hr>

<h4>Forma de pagamento</h4>

<select id="pagTroca">
<option value="Dinheiro">Dinheiro</option>
<option value="Pix">Pix</option>
<option value="Débito">Débito</option>
<option value="Crédito à vista">Crédito à vista</option>
<option value="Crédito 2x">Crédito 2x</option>
<option value="Crédito 3x">Crédito 3x</option>
<option value="Vale">Vale</option>
</select>

<input id="valorPagoTroca" placeholder="Valor pago">
<p>Troco: R$ <span id="trocoTroca">0.00</span></p>

<button onclick="calcularTrocoTroca()">Calcular Troco</button>

<hr>

<button onclick="finalizarTroca()">Finalizar Troca</button>
<button onclick="show('ven')">⬅ Voltar</button>

</div> <!-- TROCA -->
<!-- RELATORIO -->
<div id="rel" class="box">
<h3>Relatório</h3>
<table>
<thead>
<tr><th>Data</th><th>Total</th><th>Usuário</th></tr>
</thead>
<tbody id="tabelaRel"></tbody>
</table>
<button onclick="atualizarRelatorio()">Atualizar</button>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyARpePSrPuvzOwLP6v9gzmhWfzdo0JZJK4",
  authDomain: "pdv-chinelos.firebaseapp.com",
  projectId: "pdv-chinelos-2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let produtos = [];
let venda = [];
let totalVenda = 0;
let usuarioAtual = "";
let editandoId = null;

// LOGIN
function login(){
usuarioAtual = user.value
loginBox.style.display="none"
show("ven")
}

// NAVEGAÇÃO
function show(t){
document.querySelectorAll(".box").forEach(x=>x.style.display="none")
document.getElementById(t).style.display="block"
}

db.collection("produtos").onSnapshot(s=>{

produtos = s.docs.map(d=>({id:d.id,...d.data()}))

listaProdutos.innerHTML = produtos.map(p=>`
<tr>

<td>${p.codigo}</td>

<td>${p.nome}</td>

<td>${p.cor || ""}</td>

<td>${p.numero || ""}</td>

<td>${p.estoque}</td>

<td>R$ ${Number(p.valor || 0).toFixed(2)}</td>

<td>
<button onclick="editar('${p.id}')">✏️</button>
<button onclick="excluir('${p.id}')">🗑️</button>
<button onclick="etiqueta('${p.codigo}','${p.nome}',${p.valor},'${p.cor}','${p.numero}')">🏷️</button>
</td>

</tr>
`).join("")
})
// SALVAR / EDITAR
function salvarProduto(){

if(editandoId){

db.collection("produtos").doc(editandoId).update({
codigo: codigo.value,
nome: nome.value,
cor: cor.value,
numero: numero.value,
estoque: Number(estoque.value),
valor: Number(valor.value)
})

editandoId = null

}else{

db.collection("produtos").add({
codigo: codigo.value,
nome: nome.value,
cor: cor.value,
numero: numero.value,
estoque: Number(estoque.value),
valor: Number(valor.value)
})

}

codigo.value=""
nome.value=""
cor.value=""
numero.value=""
estoque.value=""
valor.value=""
}

// GERAR CÓDIGO
function gerarCodigo(){
  const campo = document.getElementById("codigo")

  if(!campo){
    alert("Campo código não encontrado")
    return
  }

  campo.value = Date.now().toString().slice(-12)
}

// EDITAR
function editar(id){

let p = produtos.find(x=>x.id==id)

codigo.value = p.codigo
nome.value = p.nome
cor.value = p.cor || ""
numero.value = p.numero || ""
estoque.value = p.estoque
valor.value = p.valor

editandoId = id
}

// EXCLUIR
function excluir(id){

if(confirm("Excluir produto?")){
db.collection("produtos").doc(id).delete()
}

}

function etiqueta(codigo,nome,valor,cor="",numero=""){

let w = window.open("", "", "width=300,height=400")

w.document.write(`
<html>
<head>
<style>

@page { size: 40mm 50mm; margin:0; }

body{
margin:0;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* CAIXA CENTRAL */
.box{
width:40mm;
height:50mm;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
border:1px solid #000;
padding:4px;
box-sizing:border-box;
}

/* NOME */
.nome{
font-size:11px;
font-weight:bold;
margin-bottom:2px;
}

/* COR + NUMERO */
.info{
font-size:10px;
margin-bottom:4px;
}

/* CÓDIGO */
.barcode{
margin:4px 0;
}

/* PREÇO */
.preco{
font-size:20px;
font-weight:bold;
color:#000;
margin-top:4px;
}

</style>
</head>

<body>

<div class="box">

<div class="nome">${nome}</div>

<div class="info">${cor} ${numero}</div>

<div class="barcode">
<svg id="barcode"></svg>
</div>

<div class="preco">R$ ${Number(valor || 0).toFixed(2)}</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>

<script>
JsBarcode("#barcode","${codigo}",{
format:"CODE128",
width:1.2,
height:30,
displayValue:false,
margin:0
})

window.print()
<\/script>

</body>
</html>
`)
}
// ================= VENDA =================
function addVenda(){

let p = produtos.find(x=>x.codigo==codVenda.value)

if(!p){
alert("Produto não encontrado")
return
}

let q = Number(qtd.value)

let item = venda.find(x=>x.codigo==p.codigo)

if(item){
item.qtd+=q
}else{
venda.push({...p,qtd:q})
}

totalVenda += p.valor*q

codVenda.value=""
qtd.value=1

renderVenda()
}

function renderVenda(){
listaVenda.innerHTML = venda.map((p,i)=>`
<tr>
<td>${p.nome}</td>
<td>${p.qtd}</td>
<td>R$ ${(p.valor*p.qtd).toFixed(2)}</td>
<td><button onclick="remover(${i})">X</button></td>
</tr>
`).join("")

total.innerText = totalVenda.toFixed(2)
}
function calcularTroco(){
  let pago = Number(valorPago.value || 0)
  let troco = pago - totalVenda
  if(troco < 0) troco = 0

  document.getElementById("troco").innerText = troco.toFixed(2)
}
function gerarNumeroCupom(){
  return Date.now().toString().slice(-6)
}
// REMOVER
function remover(i){
totalVenda -= venda[i].valor*venda[i].qtd
venda.splice(i,1)
renderVenda()
}
function montarCupom(venda){

let numero = venda.cupom || gerarNumeroCupom()

let texto = ""

texto += "CHINELOS MIX\n"
texto += "CNPJ: 46.982.791/0001-01\n"
texto += "AV. LEONOR BOSONE MARQUES DA SILVA, 45\n"
texto += "POÁ - SP\n\n"

texto += "CUPOM: " + numero + "\n"
texto += "FUNCIONÁRIO: " + (venda.usuario || "") + "\n"
texto += "DATA: " + new Date().toLocaleString() + "\n"

texto += "--------------------------------\n"

venda.itens.forEach(p=>{
texto += `${p.nome} x${p.qtd}\n`
texto += `R$ ${(p.valor*p.qtd).toFixed(2)}\n`
})

texto += "--------------------------------\n"

texto += `TOTAL: R$ ${venda.total.toFixed(2)}\n`
texto += `PAGAMENTO: ${venda.pagamento}\n`
texto += `RECEBIDO: R$ ${venda.pago.toFixed(2)}\n`
texto += `TROCO: R$ ${venda.troco.toFixed(2)}\n`

texto += "\nOBRIGADO, VOLTE SEMPRE!"

return texto
}
function imprimirCupom(venda){

let w = window.open("")

w.document.write(`
<html>
<body style="font-family:monospace;white-space:pre;">
${montarCupom(venda)}

<script>
window.print();
setTimeout(()=>window.close(),800);
<\/script>

</body>
</html>
`)
}
// BUSCA
function buscarProduto(){
let termo = buscaProduto.value.toLowerCase()

let p = produtos.find(x=>
(x.nome||"").toLowerCase().includes(termo) ||
(x.codigo||"").includes(termo)
)

if(p){
codVenda.value = p.codigo
addVenda()
}
}

// TROCO
function calcularTroco(){
let pago = Number(valorPago.value||0)
let troco = pago-totalVenda
if(troco<0) troco=0
document.getElementById("troco").innerText = troco.toFixed(2)
}

// FINALIZAR
function finalizarVenda(){

if(!venda.length){
alert("Nenhuma venda")
return
}

let pago = Number(valorPago.value || 0)
let troco = pago - totalVenda
if(troco < 0) troco = 0

let vendaFinal = {
itens: venda,
total: totalVenda,
usuario: usuarioAtual,
pagamento: formaPagamento.value,
pago: pago,
troco: troco,
data: new Date(),
cupom: gerarNumeroCupom()
}

imprimirCupom(vendaFinal)

enviarWhats(vendaFinal)

venda = []
totalVenda = 0

renderVenda()

valorPago.value = ""
document.getElementById("troco").innerText = "0.00"

alert("Venda finalizada")
}
function enviarWhats(venda){

let texto = montarCupom(venda)

let url = "https://wa.me/?text=" + encodeURIComponent(texto)

window.open(url)
}

// ================= RELATÓRIO =================
async function atualizarRelatorio(){

let snap = await db.collection("vendas").get()

let vendasLista = snap.docs.map(d=>d.data())

tabelaRel.innerHTML = vendasLista.map(v=>{

let data = ""
if(v.data){
if(v.data.seconds){
data = new Date(v.data.seconds*1000).toLocaleDateString()
}else{
data = new Date(v.data).toLocaleDateString()
}
}

return `
<tr>
<td>${data}</td>
<td>R$ ${Number(v.total||0).toFixed(2)}</td>
<td>${v.usuario||""}</td>
</tr>
`

}).join("")
}

// START
show("ven")
let scannerVenda = null

function toggleScannerVenda(){

const reader = document.getElementById("readerVenda")

if(!reader){
alert("readerVenda não encontrado")
return
}

if(scannerVenda){
scannerVenda.stop()
scannerVenda = null
reader.innerHTML = ""
return
}

scannerVenda = new Html5Qrcode("readerVenda")

scannerVenda.start(
{ facingMode: "environment" },
{ fps: 10 },
(decodedText)=>{

document.getElementById("codVenda").value = decodedText

addVenda()

scannerVenda.stop()
scannerVenda = null
reader.innerHTML = ""

}
)

}
let scanner = null

function toggleScanner(){

const reader = document.getElementById("reader")

if(!reader){
alert("reader não encontrado")
return
}

if(scanner){
scanner.stop()
scanner = null
reader.innerHTML = ""
return
}

scanner = new Html5Qrcode("reader")

scanner.start(
{ facingMode: "environment" },
{ fps: 10 },
(decodedText)=>{

document.getElementById("codigo").value = decodedText

scanner.stop()
scanner = null
reader.innerHTML = ""
}
).catch(err=>{
alert("Erro no scanner: " + err)
})

}
let troca = []
let totalTroca = 0

function addTroca(){

let p = produtos.find(x=>x.codigo==codTroca.value)

if(!p){
alert("Produto não encontrado")
return
}

let q = Number(qtdTroca.value)

troca.push({...p,qtd:q})

totalTroca += p.valor*q

renderTroca()

codTroca.value=""
qtdTroca.value=1
}

function renderTroca(){

listaTroca.innerHTML = troca.map((p,i)=>`
<tr>
<td>${p.nome}</td>
<td>${p.qtd}</td>
<td>R$ ${(p.valor*p.qtd).toFixed(2)}</td>
</tr>
`).join("")

totalTroca.innerText = totalTroca.toFixed(2)
}
function calcularTrocoTroca(){

let pago = Number(valorPagoTroca.value || 0)

let troco = pago - totalTroca
if(troco < 0) troco = 0

document.getElementById("trocoTroca").innerText = troco.toFixed(2)
}
function finalizarTroca(){

if(!troca.length){
alert("Nenhuma troca")
return
}

let vendaTroca = {
itens: troca,
total: totalTroca,
pagamento: pagTroca.value,
pago: Number(valorPagoTroca.value || 0),
troco: Number(trocoTroca.innerText || 0),
data: new Date(),
usuario: usuarioAtual
}

alert("Troca realizada com sucesso")

troca = []
totalTroca = 0

renderTroca()

valorPagoTroca.value = ""
trocoTroca.innerText = "0.00"

show("ven")
}
</script>
</body>
</html>
