```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV CHINELOS MIX</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center}
input,button,select{padding:10px;margin:5px}
button{background:#28a745;color:#fff;border:none}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #555;padding:5px}
.tela{display:none}
.menu{background:#111;padding:10px}
#reader,#readerVenda{width:300px;margin:auto}
</style>
</head>

<body>

<h1>PDV CHINELOS MIX</h1>

<!-- LOGIN -->
<div id="login" class="tela" style="display:block">
<input id="user" placeholder="Usuário"><br>
<input id="pass" type="password" placeholder="Senha"><br>
<button onclick="entrar()">Entrar</button>
</div>

<!-- MENU -->
<div id="menu" class="tela menu">
<button onclick="mostrar('produtos')">Produtos</button>
<button onclick="mostrar('vendas')">Vendas</button>
<button onclick="mostrar('funcionarios')">Funcionários</button>
<button onclick="mostrar('caixa')">Caixa</button>
<button onclick="mostrar('relatorio')">Relatório</button>
</div>

<!-- PRODUTOS -->
<div id="produtos" class="tela">
<h2>Produtos</h2>

<input id="codigo" placeholder="Código">
<button onclick="scanProduto()">📷 Scanner</button>
<div id="reader"></div>

<input id="nome" placeholder="Nome">
<input id="cor" placeholder="Cor">
<input id="numero" placeholder="Numeração">
<input id="quantidade" placeholder="Quantidade">
<input id="valor" placeholder="Valor">

<button onclick="salvarProduto()">Salvar</button>

<table>
<thead>
<tr>
<th>Código</th><th>Nome</th><th>Cor</th><th>Nº</th><th>Qtd</th><th>Valor</th><th>Ação</th>
</tr>
</thead>
<tbody id="listaProdutos"></tbody>
</table>

<button onclick="mostrar('menu')">Voltar</button>
</div>

<!-- VENDAS -->
<div id="vendas" class="tela">
<h2>Venda</h2>

<input id="codVenda" placeholder="Código">
<button onclick="scanVenda()">📷 Scanner</button>
<div id="readerVenda"></div>

<input id="qtd" value="1">

<button onclick="addVenda()">Adicionar</button>

<select id="pagamento">
<option>Dinheiro</option>
<option>Pix</option>
<option>Débito</option>
<option>Crédito à vista</option>
<option>Crédito 2x</option>
<option>Crédito 3x</option>
<option>Vale</option>
</select>

<input id="dinheiro" placeholder="Valor recebido">

<h3>Total: R$ <span id="total">0</span></h3>
<h3>Troco: R$ <span id="troco">0</span></h3>

<button onclick="imprimir()">🧾 Imprimir Cupom</button>
<button onclick="finalizar()">Finalizar</button>

<table>
<thead>
<tr><th>Nome</th><th>Qtd</th><th>Valor</th><th>Ação</th></tr>
</thead>
<tbody id="listaVenda"></tbody>
</table>

<button onclick="mostrar('menu')">Voltar</button>
</div>

<!-- FUNCIONÁRIOS -->
<div id="funcionarios" class="tela">
<h2>Funcionários</h2>

<input id="nomeFunc" placeholder="Nome">
<input id="cargoFunc" placeholder="Cargo">

<button onclick="salvarFunc()">Salvar</button>

<table>
<thead>
<tr><th>Nome</th><th>Cargo</th><th>Ponto</th><th>Ação</th></tr>
</thead>
<tbody id="listaFunc"></tbody>
</table>

<button onclick="mostrar('menu')">Voltar</button>
</div>

<!-- CAIXA -->
<div id="caixa" class="tela">
<h2>Caixa</h2>

<input id="valorInicial" placeholder="Valor inicial">

<button onclick="abrirCaixa()">Abrir</button>
<button onclick="fecharCaixa()">Fechar</button>

<h3 id="statusCaixa"></h3>

<button onclick="mostrar('menu')">Voltar</button>
</div>

<!-- RELATÓRIO -->
<div id="relatorio" class="tela">
<h2>Relatório</h2>

<table>
<thead>
<tr><th>Data</th><th>Total</th><th>Pagamento</th></tr>
</thead>
<tbody id="listaRelatorio"></tbody>
</table>

<h3>Total: R$ <span id="totalRelatorio">0</span></h3>

<button onclick="mostrar('menu')">Voltar</button>
</div>

<script>

// LOGIN
function entrar(){
if(user.value==="admin" && pass.value==="123"){
mostrar("menu")
}else alert("Login inválido")
}

// TROCAR TELA
function mostrar(t){
document.querySelectorAll(".tela").forEach(x=>x.style.display="none")
document.getElementById(t).style.display="block"
listarProdutos()
listarFunc()
listarRelatorio()
}

// PRODUTOS
let produtos=JSON.parse(localStorage.getItem("produtos"))||[]
let edit=-1

function salvarProduto(){
let p={
codigo:codigo.value,
nome:nome.value,
cor:cor.value,
numero:numero.value,
quantidade:Number(quantidade.value),
valor:Number(valor.value)
}

if(edit>=0){
produtos[edit]=p
edit=-1
}else{
produtos.push(p)
}

localStorage.setItem("produtos",JSON.stringify(produtos))
listarProdutos()
}

function listarProdutos(){
let html=""
produtos.forEach((p,i)=>{
html+=`
<tr>
<td>${p.codigo}</td>
<td>${p.nome}</td>
<td>${p.cor}</td>
<td>${p.numero}</td>
<td>${p.quantidade}</td>
<td>R$ ${p.valor}</td>
<td>
<button onclick="editar(${i})">Editar</button>
<button onclick="excluir(${i})">Excluir</button>
</td>
</tr>`
})
listaProdutos.innerHTML=html
}

function editar(i){
let p=produtos[i]
codigo.value=p.codigo
nome.value=p.nome
cor.value=p.cor
numero.value=p.numero
quantidade.value=p.quantidade
valor.value=p.valor
edit=i
}

function excluir(i){
produtos.splice(i,1)
localStorage.setItem("produtos",JSON.stringify(produtos))
listarProdutos()
}

// SCANNER
let cam1=null,cam2=null

function scanProduto(){
if(cam1){cam1.stop();reader.innerHTML="";cam1=null;return}
cam1=new Html5Qrcode("reader")
cam1.start({facingMode:"environment"},{fps:10},c=>{
codigo.value=c
cam1.stop()
reader.innerHTML=""
})
}

function scanVenda(){
if(cam2){cam2.stop();readerVenda.innerHTML="";cam2=null;return}
cam2=new Html5Qrcode("readerVenda")
cam2.start({facingMode:"environment"},{fps:10},c=>{
codVenda.value=c
cam2.stop()
readerVenda.innerHTML=""
})
}

// VENDAS
let venda=[]
let total=0

function addVenda(){
let p=produtos.find(x=>x.codigo==codVenda.value)
if(!p)return alert("Produto não encontrado")

let q=Number(qtd.value)
if(p.quantidade<q)return alert("Sem estoque")

p.quantidade-=q

venda.push({...p,qtd:q})
total+=p.valor*q

localStorage.setItem("produtos",JSON.stringify(produtos))
atualizarVenda()
}

function atualizarVenda(){
let html=""
venda.forEach((p,i)=>{
html+=`
<tr>
<td>${p.nome}</td>
<td>${p.qtd}</td>
<td>R$ ${p.valor}</td>
<td><button onclick="remover(${i})">X</button></td>
</tr>`
})
listaVenda.innerHTML=html
document.getElementById("total").innerText=total.toFixed(2)

// TROCO
let recebido=Number(dinheiro.value)
troco.innerText=recebido? (recebido-total).toFixed(2):0
}

function remover(i){
total-=venda[i].valor*venda[i].qtd
venda.splice(i,1)
atualizarVenda()
}

// CUPOM PROFISSIONAL
function imprimir(){
let linha="--------------------------------"

let cupom=`
        CHINELOS MIX
CNPJ: 46.982.791/0001-01
AV. LEONOR BOLSONI MARQUES DA SILVA, 45
CENTRO - POÁ

${linha}
ITEM   QTD   VALOR   TOTAL
${linha}
`

venda.forEach(p=>{
let t=p.valor*p.qtd
cupom+=`${p.nome} ${p.qtd} R$${p.valor} R$${t}\n`
})

cupom+=`${linha}
TOTAL: R$ ${total.toFixed(2)}
PAGAMENTO: ${pagamento.value}
RECEBIDO: R$ ${dinheiro.value}
TROCO: R$ ${(dinheiro.value-total).toFixed(2)}

OBRIGADO!
`

let w=window.open()
w.document.write("<pre>"+cupom+"</pre>")
w.print()
}

// CAIXA + RELATORIO
let caixa=0,aberto=false
let rel=JSON.parse(localStorage.getItem("rel"))||[]

function abrirCaixa(){
caixa=Number(valorInicial.value)
aberto=true
statusCaixa.innerText="Aberto"
}

function fecharCaixa(){
aberto=false
statusCaixa.innerText="Total: R$"+caixa
}

function finalizar(){
if(!aberto)return alert("Abra o caixa")

caixa+=total

rel.push({
data:new Date().toLocaleString(),
total:total,
pagamento:pagamento.value
})

localStorage.setItem("rel",JSON.stringify(rel))

venda=[]
total=0
atualizarVenda()
alert("Venda finalizada")
}

function listarRelatorio(){
let t=0
listaRelatorio.innerHTML=rel.map(r=>{
t+=Number(r.total)
return `<tr><td>${r.data}</td><td>${r.total}</td><td>${r.pagamento}</td></tr>`
}).join("")
totalRelatorio.innerText=t.toFixed(2)
}

// FUNCIONARIOS
let funcs=JSON.parse(localStorage.getItem("funcs"))||[]

function salvarFunc(){
funcs.push({nome:nomeFunc.value,cargo:cargoFunc.value,ponto:[]})
localStorage.setItem("funcs",JSON.stringify(funcs))
listarFunc()
}

function listarFunc(){
listaFunc.innerHTML=funcs.map((f,i)=>`
<tr>
<td>${f.nome}</td>
<td>${f.cargo}</td>
<td>
<button onclick="ponto(${i},'Entrada')">Entrada</button>
<button onclick="ponto(${i},'Almoço')">Almoço</button>
<button onclick="ponto(${i},'Volta')">Volta</button>
<button onclick="ponto(${i},'Saída')">Saída</button>
</td>
<td><button onclick="imprimirPonto(${i})">🧾</button></td>
</tr>`).join("")
}

function ponto(i,t){
let h=new Date().toLocaleString()
funcs[i].ponto.push({tipo:t,hora:h})
localStorage.setItem("funcs",JSON.stringify(funcs))
alert(t+" "+h)
}

function imprimirPonto(i){
let f=funcs[i]
let u=f.ponto[f.ponto.length-1]
let w=window.open()
w.document.write(`<pre>${f.nome}\n${u.tipo}\n${u.hora}</pre>`)
w.print()
}

</script>

</body>
</html>
```
