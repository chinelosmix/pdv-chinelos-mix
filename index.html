<!DOCTYPE html>

<body>

<h1>PDV CHINELOS MIX</h1>

<div id="login" class="tela" style="display:block">
<input id="user" placeholder="Usuário"><br>
<input id="pass" type="password" placeholder="Senha"><br>

<!-- CAIXA -->
<div id="caixa" class="tela">
<h2>Caixa</h2>

<input id="valorInicial" placeholder="Valor inicial">

<button onclick="abrirCaixa()">Abrir Caixa</button>
<button onclick="fecharCaixa()">Fechar Caixa</button>

<h3 id="statusCaixa"></h3>

<button onclick="mostrar('menu')">⬅ Voltar</button>
</div>

<!-- RELATORIO -->
<div id="relatorio" class="tela">
<h2>Relatório de Vendas</h2>

<table>
<thead>
<tr><th>Data</th><th>Total</th><th>Pagamento</th></tr>
</thead>
<tbody id="listaRelatorio"></tbody>
</table>

<h3>Total Geral: R$ <span id="totalRelatorio">0</span></h3>

<button onclick="mostrar('menu')">⬅ Voltar</button>
</div>

<!-- (resto do sistema continua igual: produtos, vendas, funcionarios...) -->

<script>

// LOGIN
function entrar(){
if(user.value==="admin" && pass.value==="123"){
mostrar("menu")
}else{
alert("Login inválido")
}
}

// TROCAR TELA
function mostrar(t){
document.querySelectorAll(".tela").forEach(e=>e.style.display="none")
document.getElementById(t).style.display="block"
listarRelatorio()
}

// ================= CAIXA =================
let caixaAberto = false
let valorCaixa = 0

function abrirCaixa(){
valorCaixa = Number(valorInicial.value)
caixaAberto = true
statusCaixa.innerText = "Caixa aberto com R$ " + valorCaixa
}

function fecharCaixa(){
caixaAberto = false
statusCaixa.innerText = "Caixa fechado. Total em caixa: R$ " + valorCaixa
}

// ================= RELATORIO =================
let vendasRelatorio = JSON.parse(localStorage.getItem("relatorio")) || []

function salvarRelatorio(total,pagamento){
let venda = {
data: new Date().toLocaleString(),
total: total,
pagamento: pagamento
}
vendasRelatorio.push(venda)
localStorage.setItem("relatorio", JSON.stringify(vendasRelatorio))
}

function listarRelatorio(){
let html=""
let totalGeral=0

vendasRelatorio.forEach(v=>{
html+=`<tr><td>${v.data}</td><td>R$ ${v.total}</td><td>${v.pagamento}</td></tr>`
totalGeral+=Number(v.total)
})

listaRelatorio.innerHTML=html
totalRelatorio.innerText=totalGeral.toFixed(2)
}

// ================= FINALIZAR VENDA =================
function finalizar(){

if(venda.length==0){
alert("Sem venda")
return
}

if(!caixaAberto){
alert("Abra o caixa primeiro")
return
}

valorCaixa += total

salvarRelatorio(total,pagamento.value)

alert("Venda finalizada")

venda=[]
total=0
atualizarVenda()
}

</script>

</body>
</html>
