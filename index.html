<!DOCTYPE html>
<html>
<head>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<meta charset="UTF-8">
<title>PDV CHINELOS MIX</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
header{background:#020617;padding:15px;text-align:center;font-weight:bold}
nav{display:flex;background:#020617}
nav button{flex:1;padding:12px;border:none;background:#020617;color:#fff}
.box{display:none;padding:10px}
input,select{width:100%;padding:10px;margin:5px 0;border:none;border-radius:5px}
button{padding:10px;background:#22c55e;color:#fff;border:none;border-radius:5px;margin-top:5px}
table{width:100%;margin-top:10px;border-collapse:collapse}
td,th{border-bottom:1px solid #334155;padding:8px}
</style>
</head>

<body>

<header>PDV CHINELOS MIX</header>

<div id="loginBox">
<input id="user" placeholder="Nome">
<button onclick="login()">Entrar</button>
</div>

<nav>
<button onclick="show('prod')">Produtos</button>
<button onclick="show('ven')">Venda</button>
<button onclick="show('rel')">Relatório</button>
</nav>

<div id="prod" class="box">

<h3>Cadastro de Produtos</h3>

<input id="codigo" placeholder="Código">
<button onclick="gerarCodigo()">Gerar Código</button>
<button onclick="toggleScanner()">📷 Scanner</button>

<div id="reader" style="width:250px"></div>
<input id="codigo" placeholder="Código">
<input id="nome" placeholder="Nome">
<input id="cor" placeholder="Cor">
<input id="numero" placeholder="Numeração">
<input id="estoque" placeholder="Quantidade">
<input id="valor" placeholder="Valor">

<button onclick="salvarProduto()">Salvar</button>

<table>
<thead>
<tr>
<th>Código</th>
<th>Nome</th>
<th>Numeração</th>
<th>Qtd</th>
<th>Valor</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="listaProdutos"></tbody>
</table>

</div>

<!-- VENDA -->
<div id="ven" class="box">
<input id="codVenda" placeholder="Código">
<input id="buscaProduto" placeholder="Buscar">
<button onclick="buscarProduto()">Buscar</button>
<input id="qtd" value="1">
<button onclick="addVenda()">Adicionar</button>
<input id="codigo" placeholder="Código">
<button onclick="gerarCodigo()">Gerar Código</button>
<button onclick="toggleScanner()">📷 Scanner</button>
<h3>Total: R$ <span id="total">0.00</span></h3>

<table><tbody id="listaVenda"></tbody></table>

<input id="valorPago" oninput="calcularTroco()" placeholder="Valor pago">
<h3>Troco: R$ <span id="troco">0.00</span></h3>

<button onclick="finalizar()">Finalizar</button>
</div>

<!-- RELATORIO -->
<div id="rel" class="box">
<h3>Relatório</h3>
<table>
<thead>
<tr><th>Data</th><th>Total</th><th>Usuário</th></tr>
</thead>
<tbody id="tabelaRel"></tbody>
</table>
<button onclick="atualizarRelatorio()">Atualizar</button>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyARpePSrPuvzOwLP6v9gzmhWfzdo0JZJK4",
  authDomain: "pdv-chinelos.firebaseapp.com",
  projectId: "pdv-chinelos-2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let produtos = [];
let venda = [];
let totalVenda = 0;
let usuarioAtual = "";
let editandoId = null;

// LOGIN
function login(){
usuarioAtual = user.value
loginBox.style.display="none"
show("ven")
}

// NAVEGAÇÃO
function show(t){
document.querySelectorAll(".box").forEach(x=>x.style.display="none")
document.getElementById(t).style.display="block"
}

db.collection("produtos").onSnapshot(s=>{

produtos = s.docs.map(d=>({id:d.id,...d.data()}))

listaProdutos.innerHTML = produtos.map(p=>`
<tr>

<td>${p.codigo}</td>

<td>${p.nome}</td>

<td>${p.numero || ""}</td>

<td>${p.estoque}</td>

<td>R$ ${Number(p.valor || 0).toFixed(2)}</td>

<td>

<button onclick="editar('${p.id}')">✏️</button>

<button onclick="excluir('${p.id}')">🗑️</button>

<button onclick="etiqueta('${p.codigo}','${p.nome}',${p.valor},'${p.cor}','${p.numero}')">
🏷️
</button>

</td>

</tr>
`).join("")

})
// SALVAR / EDITAR
function salvarProduto(){

if(editandoId){

db.collection("produtos").doc(editandoId).update({
codigo: codigo.value,
nome: nome.value,
cor: cor.value,
numero: numero.value,
estoque: Number(estoque.value),
valor: Number(valor.value)
})

editandoId = null

}else{

db.collection("produtos").add({
codigo: codigo.value,
nome: nome.value,
cor: cor.value,
numero: numero.value,
estoque: Number(estoque.value),
valor: Number(valor.value)
})

}

codigo.value=""
nome.value=""
cor.value=""
numero.value=""
estoque.value=""
valor.value=""
}

// GERAR CÓDIGO
function gerarCodigo(){
codigo.value = Date.now().toString().slice(-8)
}

// EDITAR
function editar(id){

let p = produtos.find(x=>x.id==id)

codigo.value = p.codigo
nome.value = p.nome
cor.value = p.cor || ""
numero.value = p.numero || ""
estoque.value = p.estoque
valor.value = p.valor

editandoId = id
}

// EXCLUIR
function excluir(id){

if(confirm("Excluir produto?")){
db.collection("produtos").doc(id).delete()
}

}

function etiqueta(codigo,nome,valor,cor="",numero=""){

let w = window.open("", "", "width=300,height=400")

w.document.write(`
<html>
<head>
<style>

@page { size: 40mm 50mm; margin:0; }

body{
margin:0;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
}

.box{
width:40mm;
height:50mm;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
border:1px solid #000;
padding:3px;
box-sizing:border-box;
}

/* NOME */
.nome{
font-size:10px;
font-weight:bold;
margin-bottom:1px;
}

/* COR + NUMERO (COLADO NO CÓDIGO) */
.info{
font-size:9px;
margin-bottom:2px;
}

/* CÓDIGO DE BARRAS */
svg{
margin:0;
}

/* PREÇO */
.preco{
font-size:18px;
font-weight:bold;
color:#000;
margin-top:2px;
}

</style>
</head>

<body>

<div class="box">

<div class="nome">${nome}</div>

<div class="info">${cor} ${numero}</div>

<svg id="barcode"></svg>

<div class="preco">R$ ${Number(valor || 0).toFixed(2)}</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>

<script>
JsBarcode("#barcode","${codigo}",{
format:"CODE128",
width:1.2,
height:28,
displayValue:false,
margin:0
})

window.print()
<\/script>

</body>
</html>
`)
}
// ================= VENDA =================
function addVenda(){

let p = produtos.find(x=>x.codigo==codVenda.value)

if(!p){
alert("Produto não encontrado")
return
}

let q = Number(qtd.value)

let item = venda.find(x=>x.codigo==p.codigo)

if(item){
item.qtd+=q
}else{
venda.push({...p,qtd:q})
}

totalVenda += p.valor*q

codVenda.value=""
qtd.value=1

renderVenda()
}

function renderVenda(){
listaVenda.innerHTML = venda.map((p,i)=>`
<tr>
<td>${p.nome}</td>
<td>${p.qtd}</td>
<td>R$ ${(p.valor*p.qtd).toFixed(2)}</td>
<td><button onclick="remover(${i})">X</button></td>
</tr>
`).join("")

total.innerText = totalVenda.toFixed(2)
}

// REMOVER
function remover(i){
totalVenda -= venda[i].valor*venda[i].qtd
venda.splice(i,1)
renderVenda()
}

// BUSCA
function buscarProduto(){
let termo = buscaProduto.value.toLowerCase()

let p = produtos.find(x=>
(x.nome||"").toLowerCase().includes(termo) ||
(x.codigo||"").includes(termo)
)

if(p){
codVenda.value = p.codigo
addVenda()
}
}

// TROCO
function calcularTroco(){
let pago = Number(valorPago.value||0)
let troco = pago-totalVenda
if(troco<0) troco=0
document.getElementById("troco").innerText = troco.toFixed(2)
}

// FINALIZAR
async function finalizar(){

await db.collection("vendas").add({
itens:venda,
total:totalVenda,
usuario:usuarioAtual,
data:new Date()
})

alert("Venda finalizada")

venda=[]
totalVenda=0
renderVenda()
}

// ================= RELATÓRIO =================
async function atualizarRelatorio(){

let snap = await db.collection("vendas").get()

let vendasLista = snap.docs.map(d=>d.data())

tabelaRel.innerHTML = vendasLista.map(v=>{

let data = ""
if(v.data){
if(v.data.seconds){
data = new Date(v.data.seconds*1000).toLocaleDateString()
}else{
data = new Date(v.data).toLocaleDateString()
}
}

return `
<tr>
<td>${data}</td>
<td>R$ ${Number(v.total||0).toFixed(2)}</td>
<td>${v.usuario||""}</td>
</tr>
`

}).join("")
}

// START
show("ven")
// SCANNER VENDA
let scannerVenda = null

function toggleScannerVenda(){

if(scannerVenda){
scannerVenda.stop()
scannerVenda = null
readerVenda.innerHTML = ""
return
}

scannerVenda = new Html5Qrcode("readerVenda")

scannerVenda.start(
{ facingMode: "environment" },
{ fps: 10 },
(decodedText)=>{

codVenda.value = decodedText
addVenda()

scannerVenda.stop()
scannerVenda = null
readerVenda.innerHTML = ""
}
)

}
</script>
</body>
</html>
