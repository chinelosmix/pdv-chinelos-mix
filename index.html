<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV PRO</title>

<style>
body{background:#111;color:#fff;text-align:center;font-family:Arial}
button{padding:10px;margin:5px;background:green;color:#fff}
input,select{padding:8px;margin:5px}
.tela{display:none}
.ativa{display:block}
</style>
</head>

<body>

<div id="loginTela">
<h2>Login</h2>
<input id="user"><br>
<input id="senha" type="password"><br>
<button onclick="login()">Entrar</button>
</div>

<div id="app" style="display:none">

<h1>PDV PRO</h1>

<button onclick="mostrar('prod')">Produtos</button>
<button onclick="mostrar('venda')">Venda</button>
<button onclick="mostrar('rel')">Relatório</button>

<div id="prod" class="tela">
<input id="cod" placeholder="Código"><br>
<input id="nome" placeholder="Nome"><br>
<input id="valor" placeholder="Valor"><br>
<input id="estoque" placeholder="Qtd"><br>
<button onclick="salvar()">Salvar</button>
<ul id="listaProd"></ul>
</div>

<div id="venda" class="tela ativa">

<input id="leitor" placeholder="Passe código">

<select id="selectProd"></select>
<input id="qtd" value="1">

<button onclick="add()">Adicionar</button>

<ul id="lista"></ul>

<h3>Total: R$ <span id="totalValor">0</span></h3>

<button onclick="cupom()">Cupom</button>
<button onclick="emitirNF()">NF</button>
<button onclick="finalizar()">Finalizar</button>

</div>

<div id="rel" class="tela">
<ul id="dia"></ul>
<ul id="rank"></ul>
<button onclick="carregarRel()">Atualizar</button>
<button onclick="fecharCaixa()">Fechar Caixa</button>
</div>

</div>

<script>

// LOGIN
function login(){
fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({user:user.value,senha:senha.value})})
.then(r=>{
if(r.ok){
loginTela.style.display='none';
app.style.display='block';
carregar();
}else alert("Erro");
});
}

// TELA
function mostrar(t){
document.querySelectorAll('.tela').forEach(e=>e.classList.remove('ativa'));
document.getElementById(t).classList.add('ativa');
}

// PRODUTO
function salvar(){
fetch('/produto',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({
cod:cod.value,nome:nome.value,
valor:parseFloat(valor.value),
estoque:parseInt(estoque.value)
})}).then(()=>carregar());
}

function carregar(){
fetch('/produtos')
.then(r=>r.json())
.then(d=>{
selectProd.innerHTML='';
d.forEach(p=>{
let op=document.createElement('option');
op.value=p.nome;
op.innerText=p.nome;
selectProd.appendChild(op);
});
});
}

// VENDA
let itens=[],total=0;

function add(){
let nome=selectProd.value;
let qtd=parseInt(qtd.value);

fetch('/produtos')
.then(r=>r.json())
.then(lista=>{
let p=lista.find(x=>x.nome===nome);

itens.push({nome,qtd,valor:p.valor});
total+=p.valor*qtd;
render();
});
}

function render(){
lista.innerHTML='';
itens.forEach(i=>{
let li=document.createElement('li');
li.innerText=i.nome+" x"+i.qtd;
lista.appendChild(li);
});
totalValor.innerText=total;
}

// CUPOM
function cupom(){
let txt="PDV PRO\n\n";
itens.forEach(i=>{
txt+=i.nome+" x"+i.qtd+"\n";
});
txt+="TOTAL: "+total;

let w=window.open('');
w.document.write("<pre>"+txt+"</pre>");
w.print();
}

// NF
function emitirNF(){
fetch('/nf',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({itens,total})})
.then(()=>alert("NF enviada"));
}

// FINALIZAR
function finalizar(){
fetch('/venda',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({itens,total})});
itens=[];total=0;render();
}

// RELATORIO
function carregarRel(){
fetch('/relatorio')
.then(r=>r.json())
.then(d=>{
dia.innerHTML='';
rank.innerHTML='';
d.dia.forEach(v=>{
let li=document.createElement('li');
li.innerText=v.total;
dia.appendChild(li);
});
Object.entries(d.ranking).forEach(([k,v])=>{
let li=document.createElement('li');
li.innerText=k+" "+v;
rank.appendChild(li);
});
});
}

// CAIXA
function fecharCaixa(){
fetch('/relatorio')
.then(r=>r.json())
.then(d=>{
let t=d.dia.reduce((s,v)=>s+v.total,0);
alert("Caixa: "+t);
});
}

</script>

</body>
</html>
