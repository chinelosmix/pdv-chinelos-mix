<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV CHINELOS MIX</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
header{background:#020617;padding:15px;text-align:center}
nav{display:flex;background:#020617}
nav button{flex:1;padding:12px;border:none;background:#020617;color:#fff}
.box{display:none;padding:10px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:5px;border:none}
button{padding:10px;background:#22c55e;color:#fff;border:none;border-radius:5px;margin-top:5px}
table{width:100%;margin-top:10px;border-collapse:collapse}
td,th{border-bottom:1px solid #334155;padding:8px}
#reader,#readerVenda{width:300px;margin:auto}
</style>
</head>

<body>

<header>PDV CHINELOS MIX</header>

<div id="loginBox">
<input id="user" placeholder="Nome">
<input id="senha" placeholder="Senha" type="password">
<button onclick="login()">Entrar</button>
</div>

<nav>
<button onclick="show('prod')">Produtos</button>
<button onclick="show('ven')">Venda</button>
</nav>

<!-- PRODUTOS -->
<div id="prod" class="box">

<input id="codigo" placeholder="Código">
<button onclick="gerarCodigo()">Gerar Código</button>
<button onclick="toggleScannerProduto()">📷 Scanner</button>

<div id="reader"></div>

<input id="nome" placeholder="Nome">
<input id="cor" placeholder="Cor">
<input id="numero" placeholder="Numeração">
<input id="estoque" placeholder="Quantidade">
<input id="valor" placeholder="Valor">

<button onclick="salvarProduto()">Salvar</button>

<table>
<thead>
<tr>
<th>Código</th><th>Nome</th><th>Cor</th><th>Nº</th><th>Qtd</th><th>Valor</th><th>Ações</th>
</tr>
</thead>
<tbody id="listaProdutos"></tbody>
</table>

</div>

<!-- VENDA -->
<div id="ven" class="box">

<input id="codVenda" placeholder="Código">
<input id="qtd" value="1">
<button onclick="addVenda()">Adicionar</button>

<button onclick="toggleScannerVenda()">📷 Scanner</button>
<div id="readerVenda"></div>

<h3>Total: R$ <span id="total">0</span></h3>

<table id="listaVenda"></table>

<h3>Pagamento</h3>

<select id="pagamento">
<option>Dinheiro</option>
<option>PIX</option>
<option>Débito</option>
<option>Crédito</option>
<option>2x</option>
<option>3x</option>
<option>Vale</option>
</select>

<input id="valorPago" placeholder="Valor">

<button onclick="usar2Pagamentos()">💳 2 Formas</button>

<div id="pagamento2" style="display:none">
<select id="pagamentoExtra">
<option>Dinheiro</option>
<option>PIX</option>
<option>Débito</option>
<option>Crédito</option>
</select>
<input id="valorExtra" placeholder="Valor">
</div>

<button onclick="finalizar()">Finalizar + Cupom</button>
<button onclick="imprimirCupomSeparado()">🧾 Cupom</button>
<button onclick="gerarNota()">📄 Nota</button>

</div>

<script>

// FIREBASE
const firebaseConfig = {
apiKey: "AIzaSyARpe...",
authDomain: "pdv-chinelos.firebaseapp.com",
projectId: "pdv-chinelos-2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let produtos=[], venda=[], totalVenda=0, usuarioAtual=""

// LOGIN
function login(){
usuarioAtual=user.value
loginBox.style.display="none"
}

// SCANNER
let sp=null,sv=null,ap=false,av=false

function toggleScannerProduto(){
if(!ap){
sp=new Html5Qrcode("reader")
sp.start({facingMode:"environment"},{fps:10,qrbox:250},c=>codigo.value=c)
ap=true
}else{sp.stop();ap=false}
}

function toggleScannerVenda(){
if(!av){
sv=new Html5Qrcode("readerVenda")
sv.start({facingMode:"environment"},{fps:10,qrbox:250},c=>{codVenda.value=c;addVenda()})
av=true
}else{sv.stop();av=false}
}

// CODIGO
function gerarCodigo(){
codigo.value="789"+Math.floor(Math.random()*1000000000)
}

// FIREBASE
db.collection("produtos").onSnapshot(s=>{
produtos=s.docs.map(d=>({id:d.id,...d.data()}))
listarProdutos()
})

// SALVAR
async function salvarProduto(){
let cod=codigo.value||Date.now().toString()
let p={codigo:cod,codigoBarras:cod,nome:nome.value,cor:cor.value,numero:numero.value,estoque:+estoque.value||0,valor:+valor.value||0}
let ex=produtos.find(x=>x.codigo==cod)
ex?await db.collection("produtos").doc(ex.id).set(p):await db.collection("produtos").add(p)
limparCampos()
}

// EDITAR / EXCLUIR
function editar(cod){
let p=produtos.find(x=>x.codigo==cod)
codigo.value=p.codigo
nome.value=p.nome
cor.value=p.cor
numero.value=p.numero
estoque.value=p.estoque
valor.value=p.valor
}

async function excluir(cod){
let p=produtos.find(x=>x.codigo==cod)
await db.collection("produtos").doc(p.id).delete()
}

// LISTAR
function listarProdutos(){
listaProdutos.innerHTML=produtos.map(p=>`
<tr>
<td>${p.codigo}</td>
<td>${p.nome}</td>
<td>${p.cor}</td>
<td>${p.numero}</td>
<td>${p.estoque}</td>
<td>R$ ${p.valor.toFixed(2)}</td>
<td>
<button onclick="editar('${p.codigo}')">✏️</button>
<button onclick="excluir('${p.codigo}')">🗑️</button>
<button onclick="etiqueta('${p.codigo}')">🏷️</button>
</td>
</tr>`).join("")
}

// ETIQUETA 40x50
function etiqueta(c){
let p=produtos.find(x=>x.codigo==c)
let w=window.open("")
w.document.write(`
<html><body style="margin:0;width:40mm;height:50mm;font-family:Arial;text-align:center">
<b>CHINELOS MIX</b><br>
${p.nome}<br>
${p.cor} | ${p.numero}<br>
<b>R$ ${p.valor.toFixed(2)}</b><br>
<svg id="b"></svg>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>
<script>JsBarcode("#b","${p.codigo}",{width:1.3,height:35});window.print()<\/script>
</body></html>
`)
}

// VENDA
function addVenda(){
let p=produtos.find(x=>x.codigo==codVenda.value)
if(!p)return alert("Produto não encontrado")
let q=+qtd.value
venda.push({...p,qtd:q})
totalVenda+=p.valor*q
codVenda.value=""
renderVenda()
}

function renderVenda(){
listaVenda.innerHTML=venda.map(p=>`
<tr><td>${p.nome}</td><td>${p.qtd}</td><td>R$${p.valor}</td></tr>
`).join("")
total.innerText=totalVenda.toFixed(2)
}

// 2 PAGAMENTOS
function usar2Pagamentos(){
pagamento2.style.display="block"
}

// FINALIZAR
async function finalizar(){

let pagamentos=[]
let v1=+valorPago.value||0

if(pagamento2.style.display=="block"){
let v2=+valorExtra.value||0
if(v1+v2<totalVenda)return alert("Valor insuficiente")
pagamentos.push({tipo:pagamento.value,valor:v1})
pagamentos.push({tipo:pagamentoExtra.value,valor:v2})
}else{
if(v1<totalVenda)return alert("Valor insuficiente")
pagamentos.push({tipo:pagamento.value,valor:v1})
}

await db.collection("vendas").add({itens:venda,total:totalVenda,usuario:usuarioAtual})

cupom(pagamentos)

venda=[];totalVenda=0;renderVenda()
}

// CUPOM
function cupom(pagamentos){

let data=new Date().toLocaleString()
let totalItens=venda.reduce((t,p)=>t+p.qtd,0)

let itens=venda.map((p,i)=>{
let cod=String(i+1).padStart(3,"0")
let totalItem=(p.qtd*p.valor).toFixed(2)
return `${cod} ${p.nome}\n   ${p.qtd}  R$${p.valor.toFixed(2)}  R$${totalItem}`
}).join("\n")

let html=`
<html><body style="font-family:monospace;width:280px">
<center>
CHINELOS MIX<br>
CNPJ: 46.982.791/0001-01<br>
AV. LEONOR BOSONE MARQUES DA SILVA, 45
</center>

--------------------------------

DATA: ${data}

--------------------------------

${itens}

--------------------------------

ITENS: ${totalItens}
TOTAL: R$ ${totalVenda.toFixed(2)}

ATENDIDO POR: ${usuarioAtual}

--------------------------------

OBRIGADO, VOLTE SEMPRE!

<script>window.print()<\/script>

</body></html>
`
let w=window.open("")
w.document.write(html)
}

// CUPOM BOTÃO
function imprimirCupomSeparado(){
cupom([{tipo:pagamento.value,valor:totalVenda}])
}

// NOTA
function gerarNota(){
let itens=venda.map(p=>`
<tr><td>${p.nome}</td><td>${p.qtd}</td><td>R$${p.valor}</td></tr>
`).join("")
let w=window.open("")
w.document.write(`
<h2>NOTA</h2>
<table border=1>${itens}</table>
Total: R$${totalVenda.toFixed(2)}
<script>window.print()<\/script>
`)
}

// LIMPAR
function limparCampos(){
codigo.value=nome.value=cor.value=numero.value=estoque.value=valor.value=""
}

// NAV
function show(t){
document.querySelectorAll(".box").forEach(x=>x.style.display="none")
document.getElementById(t).style.display="block"
}

show("prod")

</script>

</body>
</html>
