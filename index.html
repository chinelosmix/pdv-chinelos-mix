<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>PDV Chinelos Mix</title>

<style>
body { font-family: Arial; background:#111; color:#fff; text-align:center; }
button { padding:10px; margin:5px; background:green; color:white; border:none; }
input { padding:10px; margin:5px; }
.tela { display:none; }
.ativa { display:block; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<h2>Login</h2>
<input id="user" placeholder="Usuário"><br>
<input id="senha" type="password" placeholder="Senha"><br>
<button onclick="entrar()">Entrar</button>

<h3>Cadastrar</h3>
<input id="novoUser" placeholder="Usuário"><br>
<input id="novaSenha" type="password" placeholder="Senha"><br>
<button onclick="cadastrar()">Cadastrar</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<h1>PDV Chinelos Mix</h1>

<button onclick="mostrar('vendas')">Vendas</button>
<button onclick="mostrar('relatorio')">Relatório</button>

<!-- VENDAS -->
<div id="vendas" class="tela ativa">

<button onclick="abrirScanner()">📷 Código</button>

<div id="scanner" style="display:none">
<video id="video" width="300"></video><br>
<button onclick="fecharScanner()">Fechar</button>
</div>

<br>

<input id="produto" placeholder="Produto">
<input id="preco" placeholder="Preço">
<input id="qtd" placeholder="Qtd" value="1">

<button onclick="adicionar()">Adicionar</button>

<ul id="lista"></ul>

<h3>Total: R$ <span id="total">0</span></h3>

<h3>Pagamento</h3>
<button onclick="pagar('Dinheiro')">Dinheiro</button>
<button onclick="pagar('Cartão')">Cartão</button>
<button onclick="pagar('Pix')">Pix</button>

<p id="formaPagamento"></p>

<button onclick="imprimir()">🧾 Cupom</button>
<button onclick="emitirNF()">📄 Nota Fiscal</button>

<button onclick="finalizar()">Finalizar</button>

</div>

<!-- RELATORIO -->
<div id="relatorio" class="tela">
<ul id="historico"></ul>
<h3>Total vendido: R$ <span id="totalVendido">0</span></h3>
</div>

</div>

<script>

// LOGIN
function entrar(){
fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({user:user.value,senha:senha.value})})
.then(r=>{ if(r.ok){login.style.display='none';app.style.display='block';}
else alert("Erro login");});
}

// CADASTRO
function cadastrar(){
fetch('/cadastrar',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({user:novoUser.value,senha:novaSenha.value})})
.then(r=>r.json()).then(d=>alert(d.ok?"Cadastrado":d.msg));
}

// TELAS
function mostrar(t){
document.querySelectorAll('.tela').forEach(e=>e.classList.remove('ativa'));
document.getElementById(t).classList.add('ativa');
}

// VARIÁVEIS
let total=0,itens=[],vendas=[],forma="";

// ADD PRODUTO COM QUANTIDADE
function adicionar(){
let nome=produto.value;
let valor=parseFloat(preco.value);
let quantidade=parseInt(qtd.value);

if(!nome||isNaN(valor)||isNaN(quantidade)) return alert("Erro");

let totalItem=valor*quantidade;
total+=totalItem;

let item=itens.find(i=>i.nome===nome);

if(item){
item.qtd+=quantidade;
item.total+=totalItem;
} else {
itens.push({nome,preco:valor,qtd:quantidade,total:totalItem});
}

atualizar();

produto.value="";
preco.value="";
qtd.value="1";
}

// LISTA
function atualizar(){
lista.innerHTML="";
itens.forEach((i,idx)=>{
let li=document.createElement('li');
li.innerHTML=`${i.nome} | ${i.qtd}x | ${i.preco.toFixed(2)} = ${i.total.toFixed(2)}
<button onclick="remover(${idx})">❌</button>`;
lista.appendChild(li);
});
document.getElementById('total').innerText=total.toFixed(2);
}

// REMOVER
function remover(i){
total-=itens[i].preco;
itens[i].qtd--;
itens[i].total-=itens[i].preco;

if(itens[i].qtd<=0) itens.splice(i,1);

atualizar();
}

// PAGAMENTO
function pagar(t){
forma=t;
formaPagamento.innerText="Pagamento: "+t;
}

// CUPOM PROFISSIONAL
function imprimir(){
let txt="===== CUPOM DE VENDA =====\n\n";

itens.forEach(i=>{
txt+=`${i.nome}\n`;
txt+=`${i.qtd} x ${i.preco.toFixed(2)} = ${i.total.toFixed(2)}\n\n`;
});

txt+="-------------------------\n";
txt+="TOTAL: R$ "+total.toFixed(2)+"\n";
txt+="PAGAMENTO: "+forma;

let w=window.open('');
w.document.write("<pre>"+txt+"</pre>");
w.print();
}

// NF
function emitirNF(){
fetch('/nf',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({itens,total})
})
.then(r=>r.json())
.then(d=>alert(d.msg));
}

// FINALIZAR
function finalizar(){
if(total===0||!forma) return alert("Erro");

vendas.push(total);

let li=document.createElement('li');
li.innerText="Venda: "+total.toFixed(2);
historico.appendChild(li);

total=0;itens=[];forma="";
lista.innerHTML="";
document.getElementById('total').innerText="0";
formaPagamento.innerText="";

atualizarRelatorio();
}

// RELATORIO
function atualizarRelatorio(){
let soma=vendas.reduce((a,b)=>a+b,0);
totalVendido.innerText=soma.toFixed(2);
}

// SCANNER SIMPLES
let stream;
function abrirScanner(){
scanner.style.display="block";
navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
.then(s=>{
stream=s;
video.srcObject=s;
video.play();
setTimeout(()=>{
produto.value="Produto Código";
preco.value="25";
fecharScanner();
},2000);
});
}
function fecharScanner(){
scanner.style.display="none";
if(stream) stream.getTracks().forEach(t=>t.stop());
}

</script>

</body>
</html>
