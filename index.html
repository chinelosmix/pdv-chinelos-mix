<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV CHINELOS MIX</title>

<style>
body{background:#111;color:#fff;text-align:center;font-family:Arial}
button{padding:10px;margin:5px;background:green;color:#fff}
input,select{padding:8px;margin:5px}
.tela{display:none}
.ativa{display:block}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginTela">
<h2>Login</h2>

<input id="user" placeholder="Usuário"><br>
<input id="senha" type="password" placeholder="Senha"><br>

<button onclick="entrar()">Entrar</button>

<h3>Cadastrar Funcionário</h3>
<input id="novoUser"><br>
<input id="novaSenha"><br>
<button onclick="cadUser()">Cadastrar</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<h1>PDV CHINELOS MIX</h1>

<button onclick="mostrar('prod')">Produtos</button>
<button onclick="mostrar('venda')">Venda</button>
<button onclick="mostrar('rel')">Relatório</button>
<button onclick="logout()">Sair</button>

<!-- PRODUTO -->
<div id="prod" class="tela">

<h2>Cadastro Produto</h2>

<input id="cod" placeholder="Código de barras"><br>
<input id="nome" placeholder="Nome"><br>
<input id="cor" placeholder="Cor"><br>
<input id="num" placeholder="Numeração"><br>
<input id="valor" placeholder="Valor"><br>
<input id="estoque" placeholder="Quantidade"><br>

<button onclick="salvarProd()">Salvar</button>

<ul id="listaProd"></ul>

</div>

<!-- VENDA -->
<div id="venda" class="tela ativa">

<select id="selectProd"></select>
<input id="qtd" value="1">

<button onclick="add()">Adicionar</button>

<ul id="lista"></ul>

<h3>Total: R$ <span id="totalValor">0</span></h3>

<h3>Pagamento</h3>
<button onclick="setPag('Dinheiro')">Dinheiro</button>
<button onclick="setPag('Cartão')">Cartão</button>
<button onclick="setPag('Pix')">Pix</button>

<p id="pagamento"></p>

<button onclick="cupom()">🧾 Cupom</button>
<button onclick="emitirNF()">📄 Nota Fiscal</button>
<button onclick="finalizar()">Finalizar</button>

</div>

<!-- RELATORIO -->
<div id="rel" class="tela">

<h3>Vendas do Dia</h3>
<ul id="dia"></ul>

<h3>Vendas do Mês</h3>
<ul id="mes"></ul>

<h3>Ranking</h3>
<ul id="rank"></ul>

<button onclick="carregarRel()">Atualizar</button>

</div>

</div>

<script>

// LOGIN
function entrar(){
fetch('/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
user:document.getElementById('user').value,
senha:document.getElementById('senha').value
})
})
.then(r=>{
if(r.ok){
document.getElementById('loginTela').style.display='none';
document.getElementById('app').style.display='block';
carregarProd();
}else alert("Login inválido");
});
}

// CADASTRAR FUNCIONARIO
function cadUser(){
fetch('/cadastrar',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
user:novoUser.value,
senha:novaSenha.value
})
});
}

// LOGOUT
function logout(){location.reload()}

// TELAS
function mostrar(t){
document.querySelectorAll('.tela').forEach(e=>e.classList.remove('ativa'));
document.getElementById(t).classList.add('ativa');
}

// PRODUTO
function salvarProd(){
fetch('/produto',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
cod:cod.value,
nome:nome.value,
cor:cor.value,
num:num.value,
valor:parseFloat(valor.value),
estoque:parseInt(estoque.value)
})
}).then(()=>carregarProd());
}

function carregarProd(){
fetch('/produtos')
.then(r=>r.json())
.then(d=>{
selectProd.innerHTML='';
listaProd.innerHTML='';

d.forEach(p=>{
let op=document.createElement('option');
op.value=p.nome;
op.innerText=p.nome;
selectProd.appendChild(op);

let li=document.createElement('li');
li.innerText=`${p.nome} | R$ ${p.valor} | estoque:${p.estoque}`;
listaProd.appendChild(li);
});
});
}

// VENDA
let itens=[];
let total=0;
let pag="";

function setPag(p){
pag=p;
document.getElementById('pagamento').innerText="Pagamento: "+p;
}

function add(){
let nome=selectProd.value;
let qtd=parseInt(document.getElementById('qtd').value);

fetch('/produtos')
.then(r=>r.json())
.then(lista=>{
let prod=lista.find(p=>p.nome===nome);

let item=itens.find(i=>i.nome===nome);

if(item){
item.qtd+=qtd;
item.total+=prod.valor*qtd;
}else{
itens.push({
nome,
qtd,
valor:prod.valor,
total:prod.valor*qtd
});
}

total+=prod.valor*qtd;

render();
});
}

function render(){
lista.innerHTML='';

itens.forEach((i,index)=>{
let li=document.createElement('li');

li.innerHTML = `
${i.nome} | ${i.qtd}x | R$ ${i.valor.toFixed(2)} 
= R$ ${i.total.toFixed(2)}
<button onclick="remover(${index})">X</button>
`;

lista.appendChild(li);
});

document.getElementById('totalValor').innerText=total.toFixed(2);
}

function remover(i){
total-=itens[i].total;
itens.splice(i,1);
render();
}

// CUPOM PROFISSIONAL
function cupom(){
let txt="*** CHINELOS MIX ***\n\n";

itens.forEach(i=>{
txt+=`${i.nome}\n`;
txt+=`${i.qtd} x ${i.valor.toFixed(2)} = ${i.total.toFixed(2)}\n\n`;
});

txt+="---------------------\n";
txt+="TOTAL: R$ "+total.toFixed(2)+"\n";
txt+="PAGAMENTO: "+pag+"\n";
txt+="OBRIGADO!";

let w=window.open('');
w.document.write("<pre>"+txt+"</pre>");
w.print();
}

// NF
function emitirNF(){
alert("NF será integrada com SEFAZ");
}

// FINALIZAR
function finalizar(){
fetch('/venda',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({itens,total})
});

itens=[];
total=0;
render();
}

// RELATORIO
function carregarRel(){
fetch('/relatorio')
.then(r=>r.json())
.then(d=>{
dia.innerHTML='';
mes.innerHTML='';
rank.innerHTML='';

d.dia.forEach(v=>{
let li=document.createElement('li');
li.innerText="R$ "+v.total;
dia.appendChild(li);
});

d.mes.forEach(v=>{
let li=document.createElement('li');
li.innerText="R$ "+v.total;
mes.appendChild(li);
});

Object.entries(d.ranking).forEach(([k,v])=>{
let li=document.createElement('li');
li.innerText=k+" : "+v;
rank.appendChild(li);
});
});
}

</script>

</body>
</html>
