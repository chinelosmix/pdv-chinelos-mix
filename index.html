```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV CHINELOS MIX PRO</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
header{background:#020617;padding:15px;text-align:center;font-size:20px}
nav{display:flex;background:#020617}
nav button{flex:1;padding:15px;border:none;background:#020617;color:#fff;font-weight:bold}
nav button:hover{background:#1e293b}
.container{padding:15px}
.card{background:#1e293b;padding:15px;border-radius:10px;margin-bottom:15px}
input,select{width:100%;padding:12px;margin:5px 0;border:none;border-radius:5px}
button{padding:12px;border:none;border-radius:5px;background:#22c55e;color:#fff;margin-top:5px}
table{width:100%;margin-top:10px;border-collapse:collapse}
td,th{border-bottom:1px solid #334155;padding:8px}
h2{margin-top:0}
.flex{display:flex;gap:10px}
</style>
</head>

<body>

<header>PDV CHINELOS MIX</header>

<nav>
<button onclick="tab('prod')">Produtos</button>
<button onclick="tab('ven')">Vendas</button>
<button onclick="tab('fun')">Funcionários</button>
<button onclick="tab('cx')">Caixa</button>
<button onclick="tab('rel')">Relatório</button>
</nav>

<div class="container">

<!-- PRODUTOS -->
<div id="prod" class="card">
<h2>Cadastro de Produto</h2>

<input id="codigo" placeholder="Código de barras">
<button onclick="scanP()">📷 Escanear</button>
<div id="reader"></div>

<input id="nome" placeholder="Nome">
<input id="cor" placeholder="Cor">
<input id="numero" placeholder="Numeração">
<input id="estoque" placeholder="Quantidade">
<input id="valor" placeholder="Valor">

<button onclick="salvarProduto()">Salvar Produto</button>

<table id="listaProdutos"></table>
</div>

<!-- VENDAS -->
<div id="ven" class="card" style="display:none">
<h2>Venda</h2>

<input id="codVenda" placeholder="Código">
<button onclick="scanV()">📷</button>
<div id="readerVenda"></div>

<div class="flex">
<input id="qtd" value="1">
<button onclick="addVenda()">Adicionar</button>
</div>

<select id="pagamento">
<option>Dinheiro</option>
<option>Pix</option>
<option>Débito</option>
<option>Crédito à vista</option>
<option>Crédito 2x</option>
<option>Crédito 3x</option>
<option>Vale</option>
</select>

<input id="recebido" placeholder="Valor recebido">

<h3>Total: R$ <span id="total">0</span></h3>
<h3>Troco: R$ <span id="troco">0</span></h3>

<button onclick="imprimir()">🧾 Imprimir</button>
<button onclick="finalizar()">Finalizar Venda</button>

<table id="listaVenda"></table>
</div>

<!-- FUNCIONARIO -->
<div id="fun" class="card" style="display:none">
<h2>Funcionários</h2>

<input id="nomeF" placeholder="Nome">
<input id="cargoF" placeholder="Cargo">
<button onclick="salvarFunc()">Salvar</button>

<table id="listaFunc"></table>
</div>

<!-- CAIXA -->
<div id="cx" class="card" style="display:none">
<h2>Caixa</h2>

<input id="valorInicial" placeholder="Valor inicial">
<button onclick="abrirCaixa()">Abrir Caixa</button>
<button onclick="fecharCaixa()">Fechar Caixa</button>

<h3 id="status"></h3>
</div>

<!-- RELATORIO -->
<div id="rel" class="card" style="display:none">
<h2>Relatório</h2>
<table id="listaRelatorio"></table>
<h3>Total: R$ <span id="totalRelatorio">0</span></h3>
</div>

</div>

<script>

// trocar abas
function tab(t){
["prod","ven","fun","cx","rel"].forEach(id=>{
document.getElementById(id).style.display="none"
})
document.getElementById(t).style.display="block"
listarProdutos()
listarFunc()
listarRelatorio()
}

// ================= PRODUTOS =================
let produtos=JSON.parse(localStorage.getItem("produtos"))||[]

function salvarProduto(){
produtos.push({
codigo:codigo.value,
nome:nome.value,
cor:cor.value,
numero:numero.value,
estoque:Number(estoque.value),
valor:Number(valor.value)
})
localStorage.setItem("produtos",JSON.stringify(produtos))
listarProdutos()
}

function listarProdutos(){
listaProdutos.innerHTML=produtos.map((p,i)=>`
<tr>
<td>${p.nome}</td>
<td>${p.estoque}</td>
<td>R$${p.valor}</td>
</tr>`).join("")
}

// ================= SCANNER =================
function scanP(){
new Html5Qrcode("reader").start({facingMode:"environment"},{fps:10},c=>codigo.value=c)
}
function scanV(){
new Html5Qrcode("readerVenda").start({facingMode:"environment"},{fps:10},c=>codVenda.value=c)
}

// ================= VENDAS =================
let venda=[],total=0

function addVenda(){
let p=produtos.find(x=>x.codigo==codVenda.value)
if(!p)return alert("Produto não encontrado")

let q=Number(qtd.value)
if(p.estoque<q)return alert("Sem estoque")

p.estoque-=q

venda.push({...p,qtd:q})
total+=p.valor*q

localStorage.setItem("produtos",JSON.stringify(produtos))
atualizarVenda()
}

function atualizarVenda(){
listaVenda.innerHTML=venda.map(p=>`
<tr>
<td>${p.nome}</td>
<td>${p.qtd}</td>
<td>R$${p.valor}</td>
</tr>`).join("")

totalEl=document.getElementById("total")
totalEl.innerText=total.toFixed(2)

let r=Number(recebido.value)
troco.innerText=r?(r-total).toFixed(2):0
}

recebido.oninput=atualizarVenda

function imprimir(){
let txt="CHINELOS MIX\nCNPJ: 46.982.791/0001-01\nPOÁ\n\n"
venda.forEach(p=>txt+=`${p.nome} ${p.qtd} R$${p.valor}\n`)
txt+=`\nTOTAL: R$${total}`
let w=window.open()
w.document.write("<pre>"+txt+"</pre>")
w.print()
}

// ================= CAIXA =================
let caixa=0,aberto=false
let rel=JSON.parse(localStorage.getItem("rel"))||[]

function abrirCaixa(){
caixa=Number(valorInicial.value)
aberto=true
status.innerText="Caixa aberto"
}

function fecharCaixa(){
aberto=false
status.innerText="Total: R$"+caixa
}

function finalizar(){
if(!aberto)return alert("Abra o caixa")

caixa+=total

rel.push({
data:new Date().toLocaleString(),
total:total,
pagamento:pagamento.value
})

localStorage.setItem("rel",JSON.stringify(rel))

venda=[]
total=0
atualizarVenda()
alert("Venda finalizada")
}

// ================= RELATORIO =================
function listarRelatorio(){
let t=0
listaRelatorio.innerHTML=rel.map(r=>{
t+=Number(r.total)
return `<tr><td>${r.data}</td><td>${r.total}</td><td>${r.pagamento}</td></tr>`
}).join("")
totalRelatorio.innerText=t.toFixed(2)
}

// ================= FUNCIONARIO =================
let funcs=JSON.parse(localStorage.getItem("funcs"))||[]

function salvarFunc(){
funcs.push({nome:nomeF.value,cargo:cargoF.value,ponto:[]})
localStorage.setItem("funcs",JSON.stringify(funcs))
listarFunc()
}

function listarFunc(){
listaFunc.innerHTML=funcs.map((f,i)=>`
<tr>
<td>${f.nome}</td>
<td>${f.cargo}</td>
<td>
<button onclick="ponto(${i},'Entrada')">Entrada</button>
<button onclick="ponto(${i},'Almoço')">Almoço</button>
<button onclick="ponto(${i},'Volta')">Volta</button>
<button onclick="ponto(${i},'Saída')">Saída</button>
</td>
</tr>`).join("")
}

function ponto(i,t){
let h=new Date().toLocaleString()
funcs[i].ponto.push({tipo:t,hora:h})
localStorage.setItem("funcs",JSON.stringify(funcs))
alert(t+" "+h)
}

</script>

</body>
</html>
```
