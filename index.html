<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV PRO</title>
<style>
body { background:#000; color:#fff; font-family:Arial; text-align:center; }
input, button { padding:10px; margin:5px; }
button { background:green; color:#fff; border:none; }
</style>
</head>

<body>

<h1>LOGIN</h1>
<div id="login">
<input id="user" placeholder="Usuário"><br>
<input id="senha" type="password" placeholder="Senha"><br>
<button onclick="login()">Entrar</button>
</div>

<div id="pdv" style="display:none;">
<h1>PDV PRO</h1>

<input id="codigo" placeholder="Código ou nome">
<input id="qtd" type="number" value="1">
<button onclick="add()">Adicionar</button>

<h2 id="total">Total: R$ 0</h2>

<button onclick="finalizar()">Finalizar</button>
<button onclick="cupom()">Cupom</button>

<hr>

<h3>Cadastro Produto</h3>
<input id="nomeProd" placeholder="Nome">
<input id="precoProd" placeholder="Preço">
<button onclick="cadastrarProduto()">Salvar</button>

<hr>

<h3>Funcionário</h3>
<input id="funcNome" placeholder="Nome">
<button onclick="cadastrarFunc()">Salvar</button>

</div>

<script>
let carrinho = [];
let total = 0;

function login(){
fetch('/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
user:document.getElementById('user').value,
senha:document.getElementById('senha').value
})
})
.then(r=>r.json())
.then(d=>{
if(d.ok){
document.getElementById('login').style.display='none';
document.getElementById('pdv').style.display='block';
}else{
alert("Login inválido");
}
});
}

function add(){
let nome = document.getElementById('codigo').value;
let qtd = Number(document.getElementById('qtd').value);

let item = {nome, qtd, preco:10};
carrinho.push(item);

total += item.preco * qtd;
document.getElementById('total').innerText = "Total: R$ " + total;
}

function finalizar(){
fetch('/venda',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({carrinho,total})
});
alert("Venda salva!");
carrinho=[];
total=0;
document.getElementById('total').innerText="Total: R$ 0";
}

function cupom(){
alert("Cupom:\nTotal: R$ " + total);
window.print();
}

function cadastrarProduto(){
fetch('/produto',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
nome:document.getElementById('nomeProd').value,
preco:document.getElementById('precoProd').value
})
});
alert("Produto salvo!");
}

function cadastrarFunc(){
fetch('/funcionario',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
nome:document.getElementById('funcNome').value
})
});
alert("Funcionário salvo!");
}
</script>

</body>
</html>
