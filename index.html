```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV CHINELOS MIX</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center}
input,button,select{padding:10px;margin:5px}
button{background:green;color:#fff;border:none}
table{width:100%;margin-top:10px;border-collapse:collapse}
td,th{border:1px solid #555;padding:5px}
.tela{display:none}
.menu{background:#111;padding:10px}
</style>
</head>

<body>

<h1>PDV CHINELOS MIX</h1>

<div id="login" class="tela" style="display:block">
<input id="user" placeholder="Usuário"><br>
<input id="pass" type="password" placeholder="Senha"><br>
<button onclick="entrar()">Entrar</button>
</div>

<div id="menu" class="tela menu">
<button onclick="mostrar('produtos')">Produtos</button>
<button onclick="mostrar('vendas')">Vendas</button>
<button onclick="mostrar('funcionarios')">Funcionários</button>
<button onclick="mostrar('caixa')">Caixa</button>
<button onclick="mostrar('relatorio')">Relatório</button>
</div>

<!-- PRODUTOS -->
<div id="produtos" class="tela">
<h2>Produtos</h2>

<input id="codigo" placeholder="Código">
<input id="nome" placeholder="Nome">
<input id="valor" placeholder="Valor">

<button onclick="salvarProduto()">Salvar</button>

<table><tbody id="listaProdutos"></tbody></table>
<button onclick="mostrar('menu')">Voltar</button>
</div>

<!-- VENDAS -->
<div id="vendas" class="tela">
<h2>Vendas</h2>

<input id="codVenda" placeholder="Código">
<button onclick="addVenda()">Adicionar</button>

<select id="pagamento">
<option>Dinheiro</option>
<option>Pix</option>
<option>Débito</option>
<option>Crédito</option>
</select>

<h3>Total: <span id="total">0</span></h3>

<button onclick="finalizar()">Finalizar</button>

<table><tbody id="listaVenda"></tbody></table>

<button onclick="mostrar('menu')">Voltar</button>
</div>

<!-- FUNCIONARIOS -->
<div id="funcionarios" class="tela">
<h2>Funcionários</h2>

<input id="nomeFunc" placeholder="Nome">
<button onclick="salvarFunc()">Salvar</button>

<table><tbody id="listaFunc"></tbody></table>

<button onclick="mostrar('menu')">Voltar</button>
</div>

<!-- CAIXA -->
<div id="caixa" class="tela">
<h2>Caixa</h2>

<input id="valorInicial" placeholder="Valor inicial">
<button onclick="abrirCaixa()">Abrir</button>
<button onclick="fecharCaixa()">Fechar</button>

<h3 id="statusCaixa"></h3>

<button onclick="mostrar('menu')">Voltar</button>
</div>

<!-- RELATORIO -->
<div id="relatorio" class="tela">
<h2>Relatório</h2>

<table><tbody id="listaRelatorio"></tbody></table>

<button onclick="mostrar('menu')">Voltar</button>
</div>

<script>

// LOGIN
function entrar(){
if(user.value=="admin" && pass.value=="123"){
mostrar("menu")
}else alert("Erro login")
}

// TROCAR TELA
function mostrar(t){
document.querySelectorAll(".tela").forEach(x=>x.style.display="none")
document.getElementById(t).style.display="block"
listarProdutos()
listarFunc()
listarRelatorio()
}

// PRODUTOS
let produtos = JSON.parse(localStorage.getItem("produtos"))||[]

function salvarProduto(){
produtos.push({codigo:codigo.value,nome:nome.value,valor:valor.value})
localStorage.setItem("produtos",JSON.stringify(produtos))
listarProdutos()
}

function listarProdutos(){
listaProdutos.innerHTML = produtos.map(p=>`<tr><td>${p.nome}</td></tr>`).join("")
}

// VENDAS
let venda=[]
let total=0

function addVenda(){
let p=produtos.find(x=>x.codigo==codVenda.value)
if(!p)return alert("Não encontrado")
venda.push(p)
total+=Number(p.valor)
atualizarVenda()
}

function atualizarVenda(){
listaVenda.innerHTML = venda.map(p=>`<tr><td>${p.nome}</td></tr>`).join("")
document.getElementById("total").innerText=total
}

// CAIXA
let caixa=0
let aberto=false

function abrirCaixa(){
caixa=Number(valorInicial.value)
aberto=true
statusCaixa.innerText="Aberto"
}

function fecharCaixa(){
aberto=false
statusCaixa.innerText="Fechado: "+caixa
}

// RELATORIO
let rel = JSON.parse(localStorage.getItem("rel"))||[]

function salvarRel(){
rel.push({data:new Date().toLocaleString(),total:total})
localStorage.setItem("rel",JSON.stringify(rel))
}

function listarRelatorio(){
listaRelatorio.innerHTML = rel.map(r=>`<tr><td>${r.data} - ${r.total}</td></tr>`).join("")
}

// FINALIZAR
function finalizar(){
if(!aberto)return alert("Abra o caixa")
caixa+=total
salvarRel()
alert("Finalizado")
venda=[]
total=0
atualizarVenda()
}

function salvarFunc(){
let f=nomeFunc.value
let lista = JSON.parse(localStorage.getItem("func"))||[]
lista.push(f)
localStorage.setItem("func",JSON.stringify(lista))
listarFunc()
}

function listarFunc(){
let lista = JSON.parse(localStorage.getItem("func"))||[]
listaFunc.innerHTML = lista.map(f=>`<tr><td>${f}</td></tr>`).join("")
}

</script>

</body>
</html>
```
