<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV</title>

<style>
body{background:#111;color:#fff;text-align:center;font-family:Arial}
button{padding:10px;margin:5px;background:green;color:#fff}
input,select{padding:8px;margin:5px}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="telaLogin">
<h2>Login</h2>

<input id="user" placeholder="Usuário"><br>
<input id="senha" type="password" placeholder="Senha"><br>

<button onclick="fazerLogin()">Entrar</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<h1>CHINELOS MIX</h1>

<select id="selectProd"></select>
<input id="qtd" value="1">

<br>

<button onclick="add()">Adicionar</button>

<ul id="lista"></ul>

<h3>Total: R$ <span id="total">0</span></h3>

<h3>Pagamento</h3>
<button onclick="pagamento='Dinheiro'">Dinheiro</button>
<button onclick="pagamento='Cartão'">Cartão</button>
<button onclick="pagamento='Pix'">Pix</button>

<br><br>

<button onclick="cupom()">🧾 Cupom</button>
<button onclick="finalizar()">Finalizar</button>

</div>

<script>

// LOGIN CORRIGIDO
function fazerLogin(){
fetch('/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
user:document.getElementById('user').value,
senha:document.getElementById('senha').value
})
})
.then(res=>{
if(res.ok){
document.getElementById('telaLogin').style.display='none';
document.getElementById('app').style.display='block';
carregar();
}else{
alert("Login errado");
}
});
}

// PRODUTOS
function carregar(){
fetch('/produtos')
.then(r=>r.json())
.then(d=>{
selectProd.innerHTML='';
d.forEach(p=>{
let op=document.createElement('option');
op.value=p.nome;
op.innerText=p.nome;
selectProd.appendChild(op);
});
});
}

// VENDA
let itens=[];
let total=0;
let pagamento="";

function add(){
let nome=selectProd.value;
let qtd=parseInt(document.getElementById('qtd').value);

let item=itens.find(i=>i.nome===nome);

if(item){item.qtd+=qtd}
else itens.push({nome,qtd});

total+=qtd*10;

render();
}

function render(){
lista.innerHTML='';
itens.forEach(i=>{
let li=document.createElement('li');
li.innerText=i.nome+" x"+i.qtd;
lista.appendChild(li);
});
document.getElementById('total').innerText=total;
}

// CUPOM
function cupom(){
let txt="*** CHINELOS MIX ***\n\n";

itens.forEach(i=>{
txt+=i.nome+" x"+i.qtd+"\n";
});

txt+="\nTOTAL: "+total+"\n";
txt+="PAGAMENTO: "+pagamento;

let w=window.open('');
w.document.write("<pre>"+txt+"</pre>");
w.print();
}

// FINALIZAR
function finalizar(){
fetch('/venda',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({itens,total,pagamento})
});

itens=[];
total=0;
render();
}

</script>

</body>
</html>
