```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV CHINELOS MIX PRO</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff}
header{background:#000;padding:15px;text-align:center;font-size:20px}
.menu{display:flex;flex-wrap:wrap;background:#222}
.menu button{flex:1;padding:15px;margin:2px}
.box{display:none;padding:10px}
input,select{padding:12px;margin:5px;width:90%}
button{background:#28a745;color:#fff;border:none;padding:12px}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #444;padding:5px}
#reader,#readerVenda{width:300px;margin:auto}
</style>
</head>

<body>

<header>PDV CHINELOS MIX</header>

<!-- LOGIN -->
<div id="loginBox" class="box" style="display:block">
<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">
<button onclick="entrar()">Entrar</button>
</div>

<!-- MENU -->
<div id="menu" class="menu box">
<button onclick="show('prod')">Produtos</button>
<button onclick="show('ven')">Venda</button>
<button onclick="show('fun')">Funcionários</button>
<button onclick="show('cx')">Caixa</button>
<button onclick="show('rel')">Relatório</button>
</div>

<!-- PRODUTOS -->
<div id="prod" class="box">
<h2>Produtos</h2>

<input id="codigo" placeholder="Código">
<button onclick="scanP()">📷 Scanner</button>
<div id="reader"></div>

<input id="nome" placeholder="Nome">
<input id="cor" placeholder="Cor">
<input id="numero" placeholder="Numeração">
<input id="qtdEstoque" placeholder="Quantidade">
<input id="valor" placeholder="Valor">

<button onclick="salvarP()">Salvar</button>

<table id="listaP"></table>
</div>

<!-- VENDAS -->
<div id="ven" class="box">
<h2>Venda</h2>

<input id="codVenda" placeholder="Código">
<button onclick="scanV()">📷 Scanner</button>
<div id="readerVenda"></div>

<input id="qtdVenda" value="1">
<button onclick="addVenda()">Adicionar</button>

<select id="pagamento">
<option>Dinheiro</option>
<option>Pix</option>
<option>Débito</option>
<option>Crédito à vista</option>
<option>Crédito 2x</option>
<option>Crédito 3x</option>
<option>Vale</option>
</select>

<input id="recebido" placeholder="Valor recebido">

<h3>Total: R$ <span id="total">0</span></h3>
<h3>Troco: R$ <span id="troco">0</span></h3>

<button onclick="imprimir()">🧾 Cupom</button>
<button onclick="finalizar()">Finalizar</button>

<table id="listaVenda"></table>
</div>

<!-- FUNCIONARIOS -->
<div id="fun" class="box">
<h2>Funcionários</h2>

<input id="nomeF" placeholder="Nome">
<input id="cargoF" placeholder="Cargo">

<button onclick="salvarF()">Salvar</button>

<table id="listaF"></table>
</div>

<!-- CAIXA -->
<div id="cx" class="box">
<input id="valorInicial" placeholder="Valor inicial">
<button onclick="abrirCaixa()">Abrir Caixa</button>
<button onclick="fecharCaixa()">Fechar</button>
<h3 id="status"></h3>
</div>

<!-- RELATORIO -->
<div id="rel" class="box">
<table id="listaR"></table>
<h3>Total: R$ <span id="totalR">0</span></h3>
</div>

<script>

// LOGIN
function entrar(){
if(user.value==="admin" && pass.value==="123"){
document.getElementById("loginBox").style.display="none"
document.getElementById("menu").style.display="flex"
show("ven")
}else alert("Login inválido")
}

// TROCAR TELAS
function show(t){
document.querySelectorAll(".box").forEach(x=>x.style.display="none")
document.getElementById("menu").style.display="flex"
document.getElementById(t).style.display="block"
listarP(); listarF(); listarR();
}

// PRODUTOS
let produtos=JSON.parse(localStorage.getItem("prod"))||[]

function salvarP(){
produtos.push({
codigo:codigo.value,
nome:nome.value,
cor:cor.value,
numero:numero.value,
qtd:Number(qtdEstoque.value),
valor:Number(valor.value)
})
localStorage.setItem("prod",JSON.stringify(produtos))
listarP()
}

function listarP(){
listaP.innerHTML=produtos.map((p,i)=>`
<tr>
<td>${p.codigo}</td>
<td>${p.nome}</td>
<td>${p.cor}</td>
<td>${p.numero}</td>
<td>${p.qtd}</td>
<td>R$${p.valor}</td>
</tr>`).join("")
}

// SCANNER
function scanP(){
new Html5Qrcode("reader").start({facingMode:"environment"},{fps:10},c=>codigo.value=c)
}
function scanV(){
new Html5Qrcode("readerVenda").start({facingMode:"environment"},{fps:10},c=>codVenda.value=c)
}

// VENDAS
let venda=[],total=0

function addVenda(){
let p=produtos.find(x=>x.codigo==codVenda.value)
if(!p)return alert("Produto não encontrado")

let q=Number(qtdVenda.value)
if(p.qtd<q)return alert("Sem estoque")

p.qtd-=q

venda.push({...p,qtd:q})
total+=p.valor*q

localStorage.setItem("prod",JSON.stringify(produtos))
atualizarVenda()
}

function atualizarVenda(){
listaVenda.innerHTML=venda.map((p,i)=>`
<tr>
<td>${p.nome}</td>
<td>${p.qtd}</td>
<td>R$${p.valor}</td>
</tr>`).join("")

document.getElementById("total").innerText=total.toFixed(2)

let r=Number(recebido.value)
troco.innerText=r?(r-total).toFixed(2):0
}

recebido.oninput=atualizarVenda

// CUPOM
function imprimir(){
let linha="---------------------------"
let txt=`
CHINELOS MIX
CNPJ: 46.982.791/0001-01
AV. LEONOR BOLSONI MARQUES DA SILVA, 45
CENTRO - POÁ

${linha}
`

venda.forEach(p=>{
txt+=`${p.nome} ${p.qtd} R$${p.valor}\n`
})

txt+=`
${linha}
TOTAL: R$${total.toFixed(2)}
PAGAMENTO: ${pagamento.value}
RECEBIDO: R$${recebido.value}
TROCO: R$${(recebido.value-total).toFixed(2)}

OBRIGADO!
`

let w=window.open()
w.document.write("<pre>"+txt+"</pre>")
w.print()
}

// CAIXA
let caixa=0,aberto=false
let rel=JSON.parse(localStorage.getItem("rel"))||[]

function abrirCaixa(){
caixa=Number(valorInicial.value)
aberto=true
status.innerText="Caixa aberto"
}

function fecharCaixa(){
aberto=false
status.innerText="Total: R$"+caixa
}

function finalizar(){
if(!aberto)return alert("Abra o caixa")

caixa+=total

rel.push({
data:new Date().toLocaleString(),
total:total,
pagamento:pagamento.value
})

localStorage.setItem("rel",JSON.stringify(rel))

venda=[]
total=0
atualizarVenda()
alert("Venda finalizada")
}

// RELATORIO
function listarR(){
let t=0
listaR.innerHTML=rel.map(r=>{
t+=Number(r.total)
return `<tr><td>${r.data}</td><td>${r.total}</td><td>${r.pagamento}</td></tr>`
}).join("")
totalR.innerText=t.toFixed(2)
}

// FUNCIONARIOS
let funcs=JSON.parse(localStorage.getItem("func"))||[]

function salvarF(){
funcs.push({nome:nomeF.value,cargo:cargoF.value,ponto:[]})
localStorage.setItem("func",JSON.stringify(funcs))
listarF()
}

function listarF(){
listaF.innerHTML=funcs.map((f,i)=>`
<tr>
<td>${f.nome}</td>
<td>${f.cargo}</td>
<td>
<button onclick="ponto(${i},'Entrada')">Entrada</button>
<button onclick="ponto(${i},'Almoço')">Almoço</button>
<button onclick="ponto(${i},'Volta')">Volta</button>
<button onclick="ponto(${i},'Saída')">Saída</button>
</td>
<td><button onclick="imprimirPonto(${i})">🧾</button></td>
</tr>`).join("")
}

function ponto(i,t){
let h=new Date().toLocaleString()
funcs[i].ponto.push({tipo:t,hora:h})
localStorage.setItem("func",JSON.stringify(funcs))
alert(t+" "+h)
}

function imprimirPonto(i){
let f=funcs[i]
let u=f.ponto[f.ponto.length-1]
let w=window.open()
w.document.write(`<pre>${f.nome}\n${u.tipo}\n${u.hora}</pre>`)
w.print()
}

</script>

</body>
</html>
