<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV COMPLETO</title>

<style>
body{background:#111;color:#fff;text-align:center;font-family:Arial}
button{padding:10px;margin:5px;background:green;color:#fff}
input,select{padding:8px;margin:5px}
.tela{display:none}
.ativa{display:block}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginTela">
<h2>Login</h2>
<input id="user"><br>
<input id="senha" type="password"><br>
<button onclick="entrar()">Entrar</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<h1>PDV</h1>

<button onclick="mostrar('prod')">Produtos</button>
<button onclick="mostrar('venda')">Venda</button>
<button onclick="mostrar('rel')">Relatório</button>

<!-- PRODUTO -->
<div id="prod" class="tela">

<input id="cod" placeholder="Código"><br>
<input id="nome" placeholder="Nome"><br>
<input id="valor" placeholder="Valor"><br>
<input id="estoque" placeholder="Qtd"><br>

<button onclick="salvarProd()">Salvar</button>

<ul id="listaProd"></ul>

</div>

<!-- VENDA -->
<div id="venda" class="tela ativa">

<select id="selectProd"></select>
<input id="qtd" value="1">
<button onclick="add()">Adicionar</button>

<ul id="lista"></ul>

<h3>Total: R$ <span id="totalValor">0</span></h3>

<button onclick="finalizar()">Finalizar</button>
<button onclick="emitirNF()">NF</button>

</div>

<!-- RELATORIO -->
<div id="rel" class="tela">

<ul id="dia"></ul>
<ul id="rank"></ul>

<button onclick="carregarRel()">Atualizar</button>

</div>

</div>

<script>

function entrar(){
fetch('/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
user:document.getElementById('user').value,
senha:document.getElementById('senha').value
})
})
.then(r=>{
if(r.ok){
document.getElementById('loginTela').style.display='none';
document.getElementById('app').style.display='block';
carregarProd();
}else alert("Erro login");
});
}

function mostrar(t){
document.querySelectorAll('.tela').forEach(e=>e.classList.remove('ativa'));
document.getElementById(t).classList.add('ativa');
}

function salvarProd(){
fetch('/produto',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
cod:cod.value,
nome:nome.value,
valor:parseFloat(valor.value),
estoque:parseInt(estoque.value)
})
}).then(()=>carregarProd());
}

function carregarProd(){
fetch('/produtos')
.then(r=>r.json())
.then(d=>{
selectProd.innerHTML='';
listaProd.innerHTML='';

d.forEach(p=>{
let op=document.createElement('option');
op.value=p.nome;
op.innerText=p.nome;
selectProd.appendChild(op);

let li=document.createElement('li');
li.innerText=p.nome+" R$"+p.valor;
listaProd.appendChild(li);
});
});
}

let itens=[];
let total=0;

function add(){
let nome=selectProd.value;
let qtd=parseInt(document.getElementById('qtd').value);

fetch('/produtos')
.then(r=>r.json())
.then(lista=>{
let prod=lista.find(p=>p.nome===nome);

itens.push({nome,qtd,valor:prod.valor});
total+=prod.valor*qtd;
render();
});
}

function render(){
lista.innerHTML='';
itens.forEach(i=>{
let li=document.createElement('li');
li.innerText=i.nome+" x"+i.qtd;
lista.appendChild(li);
});
totalValor.innerText=total;
}

function finalizar(){
fetch('/venda',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({itens,total})
});
itens=[];total=0;render();
}

function emitirNF(){
fetch('/nf',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({itens,total})
})
.then(()=>alert("NF enviada"));
}

function carregarRel(){
fetch('/relatorio')
.then(r=>r.json())
.then(d=>{
dia.innerHTML='';
rank.innerHTML='';

d.dia.forEach(v=>{
let li=document.createElement('li');
li.innerText=v.total;
dia.appendChild(li);
});

Object.entries(d.ranking).forEach(([k,v])=>{
let li=document.createElement('li');
li.innerText=k+" "+v;
rank.appendChild(li);
});
});
}

</script>

</body>
</html>
