<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV</title>

<style>
body{background:#111;color:#fff;text-align:center;font-family:Arial}
button{padding:10px;margin:5px;background:green;color:#fff}
input,select{padding:8px;margin:5px}
.tela{display:none}
.ativa{display:block}
</style>
</head>

<body>

<div id="loginTela">
<h2>Login</h2>
<input id="user"><br>
<input id="senha" type="password"><br>
<button onclick="entrar()">Entrar</button>
</div>

<div id="app" style="display:none">

<h1>PDV CHINELOS MIX</h1>

<select id="selectProd"></select>
<input id="qtd" value="1">
<button onclick="add()">Adicionar</button>

<ul id="lista"></ul>

<h3>Total: R$ <span id="totalValor">0</span></h3>

<button onclick="emitirNF()">Nota Fiscal</button>

</div>

<script>

function entrar(){
fetch('/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
user:document.getElementById('user').value,
senha:document.getElementById('senha').value
})
})
.then(res=>{
if(res.ok){
document.getElementById('loginTela').style.display='none';
document.getElementById('app').style.display='block';
}else{
alert("Login inválido");
}
});
}

let itens=[];
let total=0;

function add(){
itens.push({nome:"Produto",qtd:1,valor:10});
total+=10;
render();
}

function render(){
lista.innerHTML='';
itens.forEach(i=>{
let li=document.createElement('li');
li.innerText=i.nome+" x"+i.qtd;
lista.appendChild(li);
});
totalValor.innerText=total;
}

function emitirNF(){
fetch('/nf',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({itens,total})
})
.then(()=>alert("NF enviada"));
}

</script>

</body>
</html>
