```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV PRO</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{background:#111;color:#fff;font-family:Arial;margin:0;text-align:center}
header{background:#000;padding:15px;font-size:20px}
.menu{display:flex;justify-content:space-around;background:#222;padding:10px}
.menu button{padding:15px;font-size:16px;width:30%;background:#28a745}
.box{display:none;padding:10px}
input,select{padding:12px;margin:5px;width:90%}
.big{font-size:20px;padding:15px;width:90%}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #555;padding:5px}
#reader,#readerVenda{width:300px;margin:auto}
</style>
</head>

<body>

<header>PDV CHINELOS MIX</header>

<!-- LOGIN -->
<div id="login">
<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">
<button class="big" onclick="entrar()">Entrar</button>
</div>

<!-- MENU -->
<div id="menu" class="menu" style="display:none">
<button onclick="mostrar('produtos')">📦</button>
<button onclick="mostrar('vendas')">💰</button>
<button onclick="mostrar('funcionarios')">👨‍💼</button>
</div>

<!-- PRODUTOS -->
<div id="produtos" class="box">
<h2>Produtos</h2>

<input id="codigo" placeholder="Código">
<button onclick="scanProduto()">📷</button>
<div id="reader"></div>

<input id="nome" placeholder="Nome">
<input id="cor" placeholder="Cor">
<input id="numero" placeholder="Numeração">
<input id="quantidade" placeholder="Quantidade">
<input id="valor" placeholder="Valor">

<button class="big" onclick="salvarProduto()">Salvar</button>

<table><tbody id="listaProdutos"></tbody></table>
</div>

<!-- VENDAS -->
<div id="vendas" class="box">
<h2>Venda</h2>

<input id="codVenda" placeholder="Código">
<button onclick="scanVenda()">📷</button>
<div id="readerVenda"></div>

<input id="qtd" value="1">

<select id="pagamento">
<option>Dinheiro</option>
<option>Pix</option>
<option>Débito</option>
<option>Crédito</option>
<option>Vale</option>
</select>

<button class="big" onclick="addVenda()">Adicionar</button>

<table><tbody id="listaVenda"></tbody></table>

<h2>Total: R$ <span id="total">0</span></h2>

<button class="big" onclick="finalizar()">Finalizar</button>
</div>

<!-- FUNCIONARIO -->
<div id="funcionarios" class="box">
<h2>Funcionários</h2>

<input id="nomeFunc" placeholder="Nome">
<input id="cargoFunc" placeholder="Cargo">

<button onclick="salvarFunc()">Salvar</button>

<table><tbody id="listaFunc"></tbody></table>
</div>

<script>

let usuarioAtual = ""

// LOGIN FUNCIONÁRIO
function entrar(){
usuarioAtual = user.value

if(pass.value === "123"){
login.style.display="none"
menu.style.display="flex"
mostrar("vendas")
}
}

// MENU
function mostrar(t){
document.querySelectorAll(".box").forEach(e=>e.style.display="none")
document.getElementById(t).style.display="block"
listarProdutos()
listarFunc()
}

// PRODUTOS
let produtos = JSON.parse(localStorage.getItem("produtos"))||[]

function salvarProduto(){
let p={
codigo:codigo.value,
nome:nome.value,
cor:cor.value,
numero:numero.value,
quantidade:Number(quantidade.value),
valor:Number(valor.value)
}
produtos.push(p)
localStorage.setItem("produtos",JSON.stringify(produtos))
listarProdutos()
}

function listarProdutos(){
let html=""
produtos.forEach(p=>{
html+=`<tr><td>${p.nome}</td><td>${p.quantidade}</td><td>R$${p.valor}</td></tr>`
})
listaProdutos.innerHTML=html
}

// VENDAS
let venda=[]
let total=0

function addVenda(){
let p=produtos.find(x=>x.codigo==codVenda.value)

if(!p)return alert("Produto não encontrado")
if(p.quantidade<=0)return alert("Sem estoque")

let q=Number(qtd.value)

if(p.quantidade<q)return alert("Estoque insuficiente")

p.quantidade-=q

venda.push({...p,qtd:q})
total+=p.valor*q

localStorage.setItem("produtos",JSON.stringify(produtos))
atualizarVenda()
}

function atualizarVenda(){
let html=""
venda.forEach(p=>{
html+=`<tr><td>${p.nome}</td><td>${p.qtd}</td><td>R$${p.valor}</td></tr>`
})
listaVenda.innerHTML=html
total.innerText=total.toFixed(2)
}

// CUPOM + IMPRESSÃO
function finalizar(){

let cupom = `
PDV CHINELOS MIX
CNPJ: 00.000.000/0001-00
END: SUA LOJA

----------------
`

venda.forEach(p=>{
cupom += `${p.nome} x${p.qtd} R$${p.valor}\n`
})

cupom += `
----------------
TOTAL: R$ ${total.toFixed(2)}
PAGAMENTO: ${pagamento.value}
VENDEDOR: ${usuarioAtual}

OBRIGADO!
`

let w = window.open("", "", "width=300,height=600")
w.document.write("<pre>"+cupom+"</pre>")
w.print()

venda=[]
total=0
atualizarVenda()
}

// FUNCIONARIOS
let funcionarios=JSON.parse(localStorage.getItem("funcionarios"))||[]

function salvarFunc(){
funcionarios.push({nome:nomeFunc.value,cargo:cargoFunc.value})
localStorage.setItem("funcionarios",JSON.stringify(funcionarios))
listarFunc()
}

function listarFunc(){
let html=""
funcionarios.forEach(f=>{
html+=`<tr><td>${f.nome}</td><td>${f.cargo}</td></tr>`
})
listaFunc.innerHTML=html
}

// SCANNER
function scanProduto(){
let cam=new Html5Qrcode("reader")
Html5QrCode.getCameras().then(dev=>{
cam.start(dev[0].id,{fps:10},code=>{
codigo.value=code
cam.stop()
reader.innerHTML=""
})
})
}

function scanVenda(){
let cam=new Html5Qrcode("readerVenda")
Html5QrCode.getCameras().then(dev=>{
cam.start(dev[0].id,{fps:10},code=>{
codVenda.value=code
cam.stop()
readerVenda.innerHTML=""
})
})
}

</script>

</body>
</html>
```
