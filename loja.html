<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chinelos Mix</title>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5}

header{
background:#0a7f3f;
color:white;
text-align:center;
padding:15px;
}

.tela{display:none;padding:10px}
.ativa{display:block}

button{
width:100%;
padding:15px;
margin:5px 0;
border:none;
background:#0a7f3f;
color:white;
border-radius:10px;
font-size:16px;
}

.produto{
background:white;
padding:10px;
margin:10px 0;
border-radius:10px;
}
</style>
</head>

<body>

<header>
<h2>Chinelos Mix</h2>
</header>

<!-- TELA 1 -->
<div id="inicio" class="tela ativa">
<h3>Mundo Havaianas</h3>

<button onclick="abrir('categorias')">
Entrar
</button>
</div>

<!-- TELA 2 -->
<div id="categorias" class="tela">
<h3>Escolha a categoria</h3>

<button onclick="carregar('infantil')">Infantil</button>
<button onclick="carregar('feminino')">Feminino</button>
<button onclick="carregar('masculino')">Masculino</button>

<button onclick="abrir('inicio')">⬅ Voltar</button>
</div>

<!-- TELA 3 -->
<div id="produtos" class="tela">
<h3 id="titulo"></h3>

<div id="lista"></div>

<button onclick="abrir('categorias')">⬅ Voltar</button>
</div>

<script>

// ================= TROCAR TELA =================
function abrir(tela){
document.querySelectorAll(".tela").forEach(t=>{
t.classList.remove("ativa")
})
document.getElementById(tela).classList.add("ativa")
}

// ================= PRODUTOS =================
let dados = {
infantil:[
{nome:"Havaianas Infantil Azul", preco:30},
{nome:"Havaianas Infantil Rosa", preco:30}
],

feminino:[
{nome:"Havaianas Feminino Estampa", preco:35},
{nome:"Havaianas Feminino Floral", preco:35}
],

masculino:[
{nome:"Havaianas Masculino Preto", preco:35},
{nome:"Havaianas Masculino Branco", preco:35}
]
}

// ================= CARREGAR PRODUTOS =================
function carregar(tipo){

abrir("produtos")

document.getElementById("titulo").innerText = "Havaianas " + tipo

let html=""

dados[tipo].forEach(p=>{
html+=`
<div class="produto">
<h4>${p.nome}</h4>
<p>R$ ${p.preco}</p>
<button>Comprar</button>
</div>
`
})

document.getElementById("lista").innerHTML = html
}

</script>

</body>
</html>
