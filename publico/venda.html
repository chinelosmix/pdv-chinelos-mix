```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV Vendas</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center}
input,button{padding:10px;margin:5px;font-size:16px}
button{background:green;color:#fff;border:none}
table{width:100%;margin-top:20px;border-collapse:collapse}
td,th{border:1px solid #fff;padding:5px}
#reader{width:300px;margin:auto}
</style>
</head>

<body>

<h1>💰 PDV VENDAS</h1>

<input id="codigo" placeholder="Código de Barras"><br>
<button onclick="abrirCamera()">📷 Scanner</button>

<div id="reader"></div>

<br>

<button onclick="adicionar()">Adicionar Produto</button>

<h2>Total: R$ <span id="total">0</span></h2>

<select id="pagamento">
<option>Dinheiro</option>
<option>Pix</option>
<option>Débito</option>
<option>Crédito</option>
<option>Vale</option>
</select>

<br><br>

<button onclick="finalizar()">Finalizar Venda</button>

<table>
<thead>
<tr>
<th>Nome</th>
<th>Valor</th>
<th>Ação</th>
</tr>
</thead>
<tbody id="lista"></tbody>
</table>

<script>

let produtos = JSON.parse(localStorage.getItem("produtos")) || []
let venda = []
let total = 0

function abrirCamera(){
const html5QrCode = new Html5Qrcode("reader")

Html5Qrcode.getCameras().then(devices => {
if(devices.length){
html5QrCode.start(
devices[0].id,
{ fps: 10, qrbox: 250 },
(code)=>{
document.getElementById("codigo").value = code
html5QrCode.stop()
document.getElementById("reader").innerHTML=""
}
)
}
})
}

function adicionar(){
let cod = document.getElementById("codigo").value

let produto = produtos.find(p => p.codigo == cod)

if(!produto){
alert("Produto não encontrado")
return
}

venda.push(produto)
total += Number(produto.valor)

atualizar()
}

function atualizar(){
let html = ""

venda.forEach((p,i)=>{
html += `
<tr>
<td>${p.nome}</td>
<td>R$ ${p.valor}</td>
<td><button onclick="remover(${i})">X</button></td>
</tr>
`
})

lista.innerHTML = html
totalSpan.innerText = total.toFixed(2)
}

function remover(i){
total -= Number(venda[i].valor)
venda.splice(i,1)
atualizar()
}

function finalizar(){
if(venda.length == 0){
alert("Nenhuma venda")
return
}

let forma = pagamento.value

alert("Venda finalizada\nTotal: R$ " + total + "\nPagamento: " + forma)

venda = []
total = 0
atualizar()
}

const totalSpan = document.getElementById("total")

</script>

</body>
</html>
```
