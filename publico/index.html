```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Produtos</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center}
input,button{padding:10px;margin:5px;font-size:16px}
button{background:green;color:#fff;border:none}
table{width:100%;margin-top:20px;border-collapse:collapse}
td,th{border:1px solid #fff;padding:5px}
#reader{width:300px;margin:auto}
</style>
</head>

<body>

<h2>Cadastro de Produtos</h2>

<input id="codigo" placeholder="Código de barras"><br>
<button onclick="abrirCamera()">📷 Scanner</button>

<div id="reader"></div>

<input id="nome" placeholder="Nome"><br>
<input id="cor" placeholder="Cor"><br>
<input id="numero" placeholder="Numeração"><br>
<input id="quantidade" type="number" placeholder="Quantidade"><br>
<input id="valor" type="number" placeholder="Valor"><br>

<button onclick="salvarProduto()">Salvar</button>

<h3>Produtos</h3>

<table>
<thead>
<tr>
<th>Código</th>
<th>Nome</th>
<th>Cor</th>
<th>Nº</th>
<th>Qtd</th>
<th>Valor</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="lista"></tbody>
</table>

<script>

let produtos = JSON.parse(localStorage.getItem("produtos")) || []
let editIndex = -1

function abrirCamera(){
const html5QrCode = new Html5Qrcode("reader")

Html5Qrcode.getCameras().then(devices => {
if(devices.length){
html5QrCode.start(
devices[0].id,
{ fps: 10 },
(code)=>{
document.getElementById("codigo").value = code
html5QrCode.stop()
document.getElementById("reader").innerHTML=""
}
)
}
})
}

function salvarProduto(){

let p = {
codigo: document.getElementById("codigo").value,
nome: document.getElementById("nome").value,
cor: document.getElementById("cor").value,
numero: document.getElementById("numero").value,
quantidade: Number(document.getElementById("quantidade").value || 0),
valor: Number(document.getElementById("valor").value || 0)
}

if(!p.codigo || !p.nome){
alert("Preencha código e nome")
return
}

if(editIndex >= 0){
produtos[editIndex] = p
editIndex = -1
}else{
produtos.push(p)
}

localStorage.setItem("produtos", JSON.stringify(produtos))

limpar()
listar()
}

function listar(){

let html = ""

produtos.forEach((p,i)=>{
html += `
<tr>
<td>${p.codigo}</td>
<td>${p.nome}</td>
<td>${p.cor}</td>
<td>${p.numero}</td>
<td>${p.quantidade}</td>
<td>R$ ${p.valor}</td>
<td>
<button onclick="editar(${i})">Editar</button>
<button onclick="excluir(${i})">Excluir</button>
</td>
</tr>
`
})

document.getElementById("lista").innerHTML = html
}

function editar(i){

let p = produtos[i]

document.getElementById("codigo").value = p.codigo
document.getElementById("nome").value = p.nome
document.getElementById("cor").value = p.cor
document.getElementById("numero").value = p.numero
document.getElementById("quantidade").value = p.quantidade
document.getElementById("valor").value = p.valor

editIndex = i
}

function excluir(i){
if(confirm("Excluir produto?")){
produtos.splice(i,1)
localStorage.setItem("produtos", JSON.stringify(produtos))
listar()
}
}

function limpar(){
document.getElementById("codigo").value=""
document.getElementById("nome").value=""
document.getElementById("cor").value=""
document.getElementById("numero").value=""
document.getElementById("quantidade").value=""
document.getElementById("valor").value=""
}

// 🔥 ESSA LINHA É FUNDAMENTAL
listar()

</script>

</body>
</html>
```
