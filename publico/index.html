<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV Chinelos Mix</title>

<style>
body { background:#000; color:#fff; font-family:Arial; text-align:center; }
input, button, select { padding:10px; margin:5px; width:80%; }
button { background:green; color:#fff; border:none; }
.box { display:none; }
</style>

</head>

<body>

<h1>PDV CHINELOS MIX</h1>

<!-- LOGIN -->
<div id="login">
<input id="user" placeholder="Usuário"><br>
<input id="pass" type="password" placeholder="Senha"><br>
<button onclick="entrar()">Entrar</button>
</div>

<!-- MENU -->
<div id="menu" class="box">
<button onclick="mostrar('cadastro')">Cadastro</button>
<button onclick="mostrar('venda')">Venda</button>
</div>

<!-- CADASTRO -->
<div id="cadastro" class="box">
<h2>Cadastro Produto</h2>

<input id="codigo" placeholder="Código (barras)">
<input id="nome" placeholder="Nome">
<input id="cor" placeholder="Cor">
<input id="numero" placeholder="Numeração">
<input id="valor" placeholder="Valor">

<button onclick="salvarProduto()">Salvar Produto</button>
</div>

<!-- VENDA -->
<div id="venda" class="box">
<h2>Venda</h2>

<input id="busca" placeholder="Código ou nome">
<button onclick="buscarProduto()">Buscar</button>

<br>
<button onclick="iniciarScanner()">📷 Scanner</button>

<h3 id="produtoSelecionado"></h3>

<input id="qtd" placeholder="Quantidade" value="1">

<button onclick="add()">Adicionar</button>

<h3>Total: R$ <span id="total">0</span></h3>

<button onclick="finalizar()">Finalizar</button>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
let produtos = JSON.parse(localStorage.getItem('produtos')) || [];
let total = 0;
let atual = null;

// LOGIN
function entrar(){
if(user.value === "admin" && pass.value === "123"){
login.style.display="none";
menu.style.display="block";
}else{
alert("Login errado");
}
}

// MENU
function mostrar(tela){
cadastro.style.display="none";
venda.style.display="none";
document.getElementById(tela).style.display="block";
}

// SALVAR PRODUTO
function salvarProduto(){
let p = {
codigo: codigo.value,
nome: nome.value,
cor: cor.value,
numero: numero.value,
valor: Number(valor.value)
};

produtos.push(p);
localStorage.setItem('produtos', JSON.stringify(produtos));

alert("Produto salvo!");
}

// BUSCAR
function buscarProduto(){
let buscaTexto = busca.value;

atual = produtos.find(p =>
p.codigo == buscaTexto || p.nome.toLowerCase().includes(buscaTexto.toLowerCase())
);

if(atual){
produtoSelecionado.innerText =
atual.nome + " | " + atual.cor + " | " + atual.numero + " | R$ " + atual.valor;
}else{
alert("Produto não encontrado");
}
}

// ADD VENDA
function add(){
if(!atual) return alert("Selecione produto");

let qtd = Number(document.getElementById('qtd').value);
total += atual.valor * qtd;

document.getElementById('total').innerText = total;
}

// FINALIZAR
function finalizar(){
alert("Venda finalizada: R$ " + total);
total = 0;
document.getElementById('total').innerText = total;
}

// SCANNER CAMERA
function iniciarScanner(){
const scanner = new Html5Qrcode("reader");

let div = document.createElement("div");
div.id = "reader";
document.body.appendChild(div);

scanner.start(
{ facingMode: "environment" },
{
fps: 10,
qrbox: 250
},
(code) => {
busca.value = code;
buscarProduto();
scanner.stop();
}
);
}
</script>

</body>
</html>
