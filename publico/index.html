```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cadastro de Produtos</title>

<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center}
input,button{padding:10px;margin:5px;font-size:16px}
button{background:green;color:#fff;border:none}
table{width:100%;margin-top:20px;border-collapse:collapse}
td,th{border:1px solid #fff;padding:5px}
</style>
</head>

<body>

<h1>PDV CHINELOS MIX</h1>

<h2>Cadastro de Produto</h2>

<input id="codigo" placeholder="Código de Barras"><br>
<input id="nome" placeholder="Nome"><br>
<input id="cor" placeholder="Cor"><br>
<input id="numero" placeholder="Numeração"><br>
<input id="quantidade" placeholder="Quantidade" type="number"><br>
<input id="valor" placeholder="Valor" type="number"><br>

<button onclick="salvarProduto()">Salvar Produto</button>

<h2>Produtos Cadastrados</h2>

<table>
<thead>
<tr>
<th>Código</th>
<th>Nome</th>
<th>Cor</th>
<th>Nº</th>
<th>Qtd</th>
<th>Valor</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="lista"></tbody>

</table>

<script>

let produtos = JSON.parse(localStorage.getItem("produtos")) || []

function salvarProduto(){

let p = {
codigo: document.getElementById("codigo").value,
nome: document.getElementById("nome").value,
cor: document.getElementById("cor").value,
numero: document.getElementById("numero").value,
quantidade: document.getElementById("quantidade").value,
valor: document.getElementById("valor").value
}

if(!p.codigo || !p.nome){
alert("Preencha código e nome")
return
}

produtos.push(p)
localStorage.setItem("produtos", JSON.stringify(produtos))

limpar()
listar()
}

function listar(){
let html = ""

produtos.forEach((p, i)=>{
html += `
<tr>
<td>${p.codigo}</td>
<td>${p.nome}</td>
<td>${p.cor}</td>
<td>${p.numero}</td>
<td>${p.quantidade}</td>
<td>R$ ${p.valor}</td>
<td><button onclick="excluir(${i})">Excluir</button></td>
</tr>
`
})

document.getElementById("lista").innerHTML = html
}

function excluir(i){
if(confirm("Excluir produto?")){
produtos.splice(i,1)
localStorage.setItem("produtos", JSON.stringify(produtos))
listar()
}
}

function limpar(){
document.getElementById("codigo").value=""
document.getElementById("nome").value=""
document.getElementById("cor").value=""
document.getElementById("numero").value=""
document.getElementById("quantidade").value=""
document.getElementById("valor").value=""
}

listar()

</script>

</body>
</html>
```
