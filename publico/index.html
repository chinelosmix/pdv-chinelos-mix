```html id="vendas01"
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV Venda</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center}
input,button,select{padding:10px;margin:5px;font-size:16px}
button{background:green;color:#fff;border:none}
table{width:100%;margin-top:20px;border-collapse:collapse}
td,th{border:1px solid #fff;padding:5px}
#reader{width:300px;margin:auto}
</style>
</head>

<body>

<h1>PDV CHINELOS MIX</h1>

<h2>Venda</h2>

<input id="codigo" placeholder="Código de Barras">
<button onclick="abrirCamera()">📷</button>

<div id="reader"></div>

<br>

<button onclick="adicionar()">Adicionar</button>

<table>
<thead>
<tr>
<th>Produto</th>
<th>Qtd</th>
<th>Valor</th>
</tr>
</thead>

<tbody id="listaVenda"></tbody>
</table>

<h2>Total: R$ <span id="total">0</span></h2>

<h3>Forma de Pagamento</h3>

<select id="pagamento">
<option>Dinheiro</option>
<option>Pix</option>
<option>Débito</option>
<option>Crédito</option>
<option>Vale</option>
</select>

<br>

<button onclick="finalizar()">Finalizar Venda</button>

<script>

let produtos = JSON.parse(localStorage.getItem("produtos")) || []
let venda = []
let total = 0

function abrirCamera(){
const html5QrCode = new Html5Qrcode("reader")

Html5Qrcode.getCameras().then(devices => {
if(devices.length){
html5QrCode.start(
devices[0].id,
{ fps: 10, qrbox: 250 },
(code)=>{
codigo.value = code
html5QrCode.stop()
reader.innerHTML=""
adicionar()
}
)
}
})
}

function adicionar(){

let cod = codigo.value
let produto = produtos.find(p => p.codigo == cod)

if(!produto){
alert("Produto não encontrado")
return
}

venda.push(produto)
total += Number(produto.valor)

atualizar()
codigo.value=""
}

function atualizar(){

let html = ""

venda.forEach(p=>{
html += `
<tr>
<td>${p.nome}</td>
<td>1</td>
<td>R$ ${p.valor}</td>
</tr>
`
})

listaVenda.innerHTML = html
document.getElementById("total").innerText = total.toFixed(2)
}

function finalizar(){

let pagamento = document.getElementById("pagamento").value

let cupom = `
PDV CHINELOS MIX
CNPJ: 00.000.000/0001-00
END: SUA LOJA

-------------------------
`

venda.forEach(p=>{
cupom += `${p.nome} - R$ ${p.valor}\n`
})

cupom += `
-------------------------
TOTAL: R$ ${total.toFixed(2)}
PAGAMENTO: ${pagamento}

OBRIGADO!
`

imprimir(cupom)

venda = []
total = 0
atualizar()
}

function imprimir(texto){

let win = window.open("","","width=300,height=600")

win.document.write("<pre>"+texto+"</pre>")
win.print()
win.close()
}

</script>

</body>
</html>
```
