```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDV Produtos</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center}
input,button{padding:10px;margin:5px;font-size:16px}
button{background:green;color:#fff;border:none}
table{width:100%;margin-top:20px;border-collapse:collapse}
td,th{border:1px solid #fff;padding:5px}
#reader{width:300px;margin:auto}
</style>
</head>

<body>

<h1>PDV CHINELOS MIX</h1>

<h2>Cadastro de Produto</h2>

<input id="codigo" placeholder="Código de Barras"><br>
<button onclick="abrirCamera()">📷 Escanear</button>

<div id="reader"></div>

<input id="nome" placeholder="Nome"><br>
<input id="cor" placeholder="Cor"><br>
<input id="numero" placeholder="Numeração"><br>
<input id="quantidade" type="number" placeholder="Quantidade"><br>
<input id="valor" type="number" placeholder="Valor"><br>

<button onclick="salvarProduto()">Salvar</button>

<h2>Produtos</h2>

<table>
<thead>
<tr>
<th>Código</th>
<th>Nome</th>
<th>Cor</th>
<th>Nº</th>
<th>Qtd</th>
<th>Valor</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="lista"></tbody>

</table>

<script>

let produtos = JSON.parse(localStorage.getItem("produtos")) || []
let editIndex = -1

function abrirCamera(){
const html5QrCode = new Html5Qrcode("reader")

Html5Qrcode.getCameras().then(devices => {
if(devices.length){
html5QrCode.start(
devices[0].id,
{ fps: 10, qrbox: 250 },
(code)=>{
document.getElementById("codigo").value = code
html5QrCode.stop()
document.getElementById("reader").innerHTML=""
}
)
}
})
}

function salvarProduto(){

let p = {
codigo: codigo.value,
nome: nome.value,
cor: cor.value,
numero: numero.value,
quantidade: quantidade.value,
valor: valor.value
}

if(editIndex >= 0){
produtos[editIndex] = p
editIndex = -1
}else{
produtos.push(p)
}

localStorage.setItem("produtos", JSON.stringify(produtos))

limpar()
listar()
}

function listar(){
let html = ""

produtos.forEach((p,i)=>{
html += `
<tr>
<td>${p.codigo}</td>
<td>${p.nome}</td>
<td>${p.cor}</td>
<td>${p.numero}</td>
<td>${p.quantidade}</td>
<td>R$ ${p.valor}</td>
<td>
<button onclick="editar(${i})">Editar</button>
<button onclick="excluir(${i})">Excluir</button>
</td>
</tr>
`
})

lista.innerHTML = html
}

function editar(i){
let p = produtos[i]

codigo.value = p.codigo
nome.value = p.nome
cor.value = p.cor
numero.value = p.numero
quantidade.value = p.quantidade
valor.value = p.valor

editIndex = i
}

function excluir(i){
if(confirm("Excluir produto?")){
produtos.splice(i,1)
localStorage.setItem("produtos", JSON.stringify(produtos))
listar()
}
}

function limpar(){
codigo.value=""
nome.value=""
cor.value=""
numero.value=""
quantidade.value=""
valor.value=""
}

listar()

</script>

</body>
</html>
```
